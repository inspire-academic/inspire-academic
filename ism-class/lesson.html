<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISM Class — Inspire Academic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/app-shared.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
<script src="/assets/js/nav-back.js"></script>
<script src="/assets/js/capacitor-utils.js"></script>
<script src="/assets/js/app-lock.js"></script>
<style>
html,body{height:100%;}
.viewer-header{
  height:auto;min-height:56px;background:var(--navy2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.75rem;padding:.6rem 1rem;flex-wrap:wrap;
  position:sticky;top:0;z-index:100;
}
.back-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:.35rem .75rem;border-radius:var(--r);font-size:.8rem;flex-shrink:0;}
.back-btn:hover{border-color:var(--gold);color:var(--gold);}
.header-title-wrap{flex:1;min-width:160px;}
.header-title{font-family:var(--font-display);font-weight:700;font-size:.95rem;}
.header-week{font-size:.72rem;color:var(--muted);}
.save-indicator{font-size:.72rem;color:var(--muted);white-space:nowrap;}
.save-indicator.saving{color:var(--gold);}
.save-indicator.saved{color:#4ade80;}
.status-pill{font-family:var(--font-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;padding:.25rem .6rem;border-radius:99px;white-space:nowrap;}
.status-not_started{background:var(--navy3);color:var(--muted);}
.status-in_progress{background:#e8620a22;color:var(--orange);}
.status-submitted{background:#1c4f8a22;color:#60a5fa;}
.status-reviewed{background:#16803c22;color:#4ade80;}
.status-returned{background:#b92b1a22;color:#f87171;}
.submit-btn{background:var(--gold);color:var(--navy);border:none;padding:.5rem 1.1rem;border-radius:var(--r);font-size:.82rem;font-weight:700;flex-shrink:0;}
.submit-btn:hover:not(:disabled){background:var(--gold2);}
.submit-btn:disabled{opacity:.5;cursor:default;}

main{max-width:960px;margin:0 auto;padding:1rem 1rem 4rem;}

.lesson-frame-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:1.5rem;position:relative;min-height:400px;}
.lesson-frame-wrap iframe{width:100%;min-height:1400px;border:none;display:block;background:#fff;}
.loading-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--navy);gap:1rem;}
.loading-overlay.hidden{display:none;}
.loading-text{font-size:.85rem;color:var(--muted);}

.section-title{font-family:var(--font-mono);font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:.8rem;display:flex;align-items:center;gap:.6rem;}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}

.photo-section{margin-bottom:1.5rem;}
.photo-hint{font-size:.82rem;color:var(--muted);margin-bottom:.8rem;}
.photo-upload-btn{display:inline-flex;align-items:center;gap:.5rem;cursor:pointer;}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:.7rem;margin-top:1rem;}
.photo-thumb{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--border);aspect-ratio:1;background:var(--navy2);}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-thumb .remove-btn{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:.75rem;line-height:1;}

.feedback-panel{margin-top:1.5rem;}
.feedback-row{display:flex;gap:1.2rem;flex-wrap:wrap;margin-bottom:1rem;}
.feedback-stat{}
.feedback-stat-val{font-family:var(--font-display);font-size:1.4rem;font-weight:800;color:var(--gold);}
.feedback-stat-lbl{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
.feedback-comment{font-size:.88rem;line-height:1.6;margin-top:.6rem;}
.field-feedback-item{border-top:1px solid var(--border);padding:.6rem 0;font-size:.85rem;}
.field-feedback-item .fid{font-family:var(--font-mono);font-size:.7rem;color:var(--gold);}

#toast{position:fixed;bottom:1.5rem;left:50%;transform:translate(-50%,100px);background:var(--navy2);border:1px solid var(--border);padding:.8rem 1.2rem;border-radius:var(--r);font-size:.85rem;opacity:0;transition:all .3s;z-index:9999;max-width:90%;}
#toast.show{transform:translate(-50%,0);opacity:1;}
#toast.success{border-color:var(--green);}
#toast.error{border-color:var(--red);}
</style>
</head>
<body>

<header class="viewer-header" id="viewer-header">
  <button class="back-btn" onclick="inspireGoBack('/ism-class/index.html')">← Back</button>
  <div class="header-title-wrap">
    <div class="header-title" id="header-title">Loading…</div>
    <div class="header-week" id="header-week"></div>
  </div>
  <span class="save-indicator" id="save-indicator"></span>
  <span class="status-pill status-not_started" id="status-pill">Loading</span>
  <button class="submit-btn" id="submit-btn" style="display:none;" onclick="submitLesson()">Submit to Teacher</button>
</header>

<main>
  <div class="lesson-frame-wrap" id="frame-wrap">
    <div class="loading-overlay" id="loading-overlay">
      <div class="spinner"></div>
      <div class="loading-text">Loading lesson…</div>
    </div>
  </div>

  <section class="photo-section">
    <div class="section-title">Photos of handwritten work</div>
    <div class="card">
      <div class="photo-hint">Attach photos of any working, diagrams or calculations you did on paper for this lesson.</div>
      <label class="btn btn-outline photo-upload-btn" id="photo-upload-label">
        📷 <span>Add photo</span>
        <input type="file" accept="image/*" capture="environment" multiple id="photo-input" style="display:none;">
      </label>
      <div class="photo-grid" id="photo-grid"></div>
    </div>
  </section>

  <section class="feedback-panel" id="feedback-panel" style="display:none;">
    <div class="section-title">Teacher feedback</div>
    <div class="card">
      <div class="feedback-row" id="feedback-stats"></div>
      <div class="feedback-comment" id="feedback-comment"></div>
      <div id="feedback-fields"></div>
    </div>
  </section>
</main>

<div id="toast"></div>

<script>
const SUPA_URL = 'https://ygtsrdwoikqnrbexjrtl.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlndHNyZHdvaWtxbnJiZXhqcnRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMjY1NDYsImV4cCI6MjA5MDkwMjU0Nn0.K0NMpMtD1-Ajv2kFoVy7CIjf2JHJ4vXM0BLiPqvZslo';
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

const STATUS_LABEL = {
  not_started: 'Not Started', in_progress: 'In Progress',
  submitted: 'Submitted', reviewed: 'Reviewed', returned: 'Returned'
};

let currentUser = null;
let accessToken = null;
let lessonId = null;
let currentStatus = 'not_started';
let iframeEl = null;

function toast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show ' + type;
  setTimeout(() => t.className = '', 3000);
}

function setSaveIndicator(state) {
  const el = document.getElementById('save-indicator');
  el.className = 'save-indicator ' + (state || '');
  el.textContent = state === 'saving' ? 'Saving…' : state === 'saved' ? 'Saved' : state === 'error' ? 'Could not save' : '';
  if (state === 'saved') setTimeout(() => { if (el.textContent === 'Saved') el.textContent = ''; }, 2000);
}

function setStatus(status) {
  currentStatus = status;
  const pill = document.getElementById('status-pill');
  pill.className = 'status-pill status-' + status;
  pill.textContent = STATUS_LABEL[status] || status;
  const submitBtn = document.getElementById('submit-btn');
  submitBtn.style.display = ['submitted', 'reviewed'].includes(status) ? 'none' : 'inline-flex';
}

async function apiCall(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${accessToken}`, ...(options.headers || {}) }
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok || body.success === false) throw new Error(body?.error?.message || 'Request failed');
  return body;
}

async function loadLesson() {
  const params = new URLSearchParams(location.search);
  lessonId = params.get('lesson');
  if (!lessonId) { location.href = '/ism-class/index.html'; return; }

  let data;
  try {
    data = await apiCall(`/api/v1/ism-class/lesson/content?lessonId=${encodeURIComponent(lessonId)}`);
  } catch (e) {
    console.error('ISM Class content load failed:', e);
    const friendly = e.message === 'Lesson not found.'
      ? "This lesson isn't available — it may not be published or assigned to you yet."
      : `Something went wrong loading this lesson (${e.message || 'unknown error'}). Please try again, or contact support if it persists.`;
    document.getElementById('frame-wrap').innerHTML = `<div class="loading-overlay"><div class="loading-text">${friendly}</div></div>`;
    return;
  }

  document.getElementById('header-title').textContent = data.lesson.title;
  document.getElementById('header-week').textContent = `Week ${data.lesson.week_number}`;
  document.title = data.lesson.title + ' — ISM Class';
  setStatus(data.progress?.status || 'not_started');

  const wrap = document.getElementById('frame-wrap');
  const iframe = document.createElement('iframe');
  iframe.setAttribute('sandbox', 'allow-scripts allow-forms');
  iframe.setAttribute('title', data.lesson.title);
  iframe.srcdoc = data.html;
  wrap.appendChild(iframe);
  iframeEl = iframe;

  iframe.addEventListener('load', () => {
    document.getElementById('loading-overlay')?.classList.add('hidden');
    // Sandboxed content can grow after load (accordions, dynamic
    // rows) — resize the wrapper to its scrollHeight so nothing gets
    // clipped, checked periodically since the iframe itself can't be
    // read cross-document without allow-same-origin.
    const resize = () => {
      try {
        const h = iframe.contentWindow.document.body.scrollHeight;
        if (h) iframe.style.minHeight = (h + 40) + 'px';
      } catch (e) { /* opaque origin — expected, ignore */ }
    };
    setInterval(resize, 1000);
    setTimeout(resize, 300);
  });

  await loadPhotos();
  await loadFeedback();
}

let saveDebounce = {};
window.addEventListener('message', (event) => {
  if (!iframeEl || event.source !== iframeEl.contentWindow) return; // only trust our own iframe instance
  const msg = event.data;
  if (!msg || typeof msg !== 'object') return;

  if (msg.type === 'ism:save' && typeof msg.fieldId === 'string') {
    setSaveIndicator('saving');
    clearTimeout(saveDebounce[msg.fieldId]);
    saveDebounce[msg.fieldId] = setTimeout(async () => {
      try {
        await apiCall('/api/v1/ism-class/response/save', {
          method: 'POST', body: JSON.stringify({ lessonId, fieldId: msg.fieldId, value: msg.value })
        });
        setSaveIndicator('saved');
        if (currentStatus === 'not_started') setStatus('in_progress');
      } catch (e) {
        setSaveIndicator('error');
      }
    }, 150); // bridge already debounces 800ms per field; this just coalesces the network call
  }

  if (msg.type === 'ism:progress' && Array.isArray(msg.completedSteps)) {
    supa.from('ism_student_lesson_progress')
      .select('id,completed_steps').eq('student_id', currentUser.id).eq('lesson_id', lessonId).single()
      .then(({ data }) => {
        if (!data) return;
        const merged = Array.from(new Set([...(data.completed_steps || []), ...msg.completedSteps]));
        supa.from('ism_student_lesson_progress').update({ completed_steps: merged }).eq('id', data.id);
      });
  }
});

async function submitLesson() {
  if (!confirm('Submit this lesson to your teacher? You will not be able to edit it unless your teacher returns it for corrections.')) return;
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  try {
    await apiCall('/api/v1/ism-class/lesson/submit', { method: 'POST', body: JSON.stringify({ lessonId }) });
    setStatus('submitted');
    toast('Submitted to your teacher!');
    await loadLesson(); // reload so the iframe re-renders read-only with the frozen state
  } catch (e) {
    toast(e.message || 'Could not submit', 'error');
    btn.disabled = false;
  }
}

// ── Photo uploads ──
const PHOTO_BUCKET = 'ism-response-photos';

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => { img.src = reader.result; };
    reader.onerror = reject;
    img.onload = () => {
      const maxDim = 1600;
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale); height = Math.round(height * scale);
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.72);
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function loadPhotos() {
  const { data } = await supa.from('ism_response_photos')
    .select('id,photo_url').eq('student_id', currentUser.id).eq('lesson_id', lessonId).order('uploaded_at');
  const grid = document.getElementById('photo-grid');
  grid.innerHTML = '';
  (data || []).forEach(p => {
    const el = document.createElement('div');
    el.className = 'photo-thumb';
    const locked = ['submitted', 'reviewed'].includes(currentStatus);
    el.innerHTML = `<img src="${p.photo_url}" loading="lazy">${locked ? '' : `<button class="remove-btn" onclick="removePhoto('${p.id}')">✕</button>`}`;
    grid.appendChild(el);
  });
  document.getElementById('photo-upload-label').style.display = ['submitted', 'reviewed'].includes(currentStatus) ? 'none' : 'inline-flex';
}

document.getElementById('photo-input').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  for (const file of files) {
    try {
      const blob = await compressImage(file);
      const path = `${currentUser.id}/${lessonId}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
      const { error: upErr } = await supa.storage.from(PHOTO_BUCKET).upload(path, blob, { contentType: 'image/jpeg' });
      if (upErr) throw upErr;
      const { data: { publicUrl } } = supa.storage.from(PHOTO_BUCKET).getPublicUrl(path);
      await supa.from('ism_response_photos').insert({
        student_id: currentUser.id, lesson_id: lessonId,
        photo_url: publicUrl
      });
    } catch (err) {
      toast('Could not upload photo: ' + (err.message || 'unknown error'), 'error');
    }
  }
  await loadPhotos();
});

async function removePhoto(id) {
  await supa.from('ism_response_photos').delete().eq('id', id).eq('student_id', currentUser.id);
  await loadPhotos();
}
window.removePhoto = removePhoto;

// ── Feedback ──
async function loadFeedback() {
  const { data: submissions } = await supa.from('ism_submissions')
    .select('id,status,submission_number').eq('student_id', currentUser.id).eq('lesson_id', lessonId)
    .order('submission_number', { ascending: false }).limit(1);
  const submission = submissions && submissions[0];
  if (!submission || submission.status !== 'reviewed') return;

  const [{ data: reviews }, { data: fieldFeedback }] = await Promise.all([
    supa.from('ism_teacher_reviews').select('*').eq('submission_id', submission.id).order('reviewed_at', { ascending: false }).limit(1),
    supa.from('ism_teacher_feedback').select('*').eq('submission_id', submission.id)
  ]);
  const review = reviews && reviews[0];
  if (!review) return;

  document.getElementById('feedback-panel').style.display = 'block';
  const stats = document.getElementById('feedback-stats');
  stats.innerHTML = [
    review.marks !== null ? `<div class="feedback-stat"><div class="feedback-stat-val">${review.marks}${review.marks_total !== null ? ' / ' + review.marks_total : ''}</div><div class="feedback-stat-lbl">Marks</div></div>` : '',
    review.mastery_score ? `<div class="feedback-stat"><div class="feedback-stat-val">${review.mastery_score}</div><div class="feedback-stat-lbl">Mastery</div></div>` : ''
  ].join('');
  document.getElementById('feedback-comment').textContent = review.overall_comment || '';
  document.getElementById('feedback-fields').innerHTML = (fieldFeedback || [])
    .map(f => `<div class="field-feedback-item"><span class="fid">${f.field_id}</span> — ${f.comment}</div>`).join('');
}

(async () => {
  const { data: { session } } = await supa.auth.getSession();
  if (!session) { window.location.href = '/index.html'; return; }
  currentUser = session.user;
  accessToken = session.access_token;
  await loadLesson();
})();
</script>
</body>
</html>
