<style>
.nav-links{display:none;gap:.3rem;flex:1;}
@media(min-width:769px){ .nav-links{display:flex;} .nav-user span:last-child{display:inline;} }

main{max-width:960px;margin:0 auto;padding:1.2rem 1rem 4rem;}
.page-header{margin-bottom:1.8rem;}
.page-title{font-family:var(--font-display);font-size:1.6rem;font-weight:800;margin-bottom:.3rem;}
.page-sub{font-size:.9rem;color:var(--muted);}

.subject-grid{display:grid;grid-template-columns:1fr;gap:1rem;}
@media(min-width:600px){ .subject-grid{grid-template-columns:1fr 1fr;} }

.subject-card{position:relative;overflow:hidden;padding:0;display:flex;flex-direction:column;}
.subject-card::before{content:'';display:block;height:4px;}
.subject-card.physics::before{background:linear-gradient(90deg,#1d4ed8,#06b6d4);}
.subject-card.chemistry::before{background:linear-gradient(90deg,#059669,#34d399);}
.subject-card.biology::before{background:linear-gradient(90deg,#7c3aed,#a78bfa);}
.subject-card.maths::before{background:linear-gradient(90deg,#d97706,#fbbf24);}
.subject-card.itt::before{background:linear-gradient(90deg,#10233F,#c9a84c);}
/* Phones: title and count on the left, the button on the right, so five
   cards fit without a long scroll. The whole card is the link, so the
   touch target is the full row. The stacked layout returns at 600px. */
.subject-card-body{padding:.9rem 1rem;flex:1;display:grid;grid-template-columns:1fr auto;align-items:center;gap:.15rem .9rem;}
.subject-card-title{font-family:var(--font-display);font-size:1.15rem;font-weight:700;grid-column:1;}
.subject-card-count{font-size:.82rem;color:var(--muted);grid-column:1;}
.subject-card-next{font-size:.82rem;font-weight:600;grid-column:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.subject-card-cta{grid-column:2;grid-row:1 / span 2;min-height:44px;}
/* Unit progress summary: lessons done across the subject, and the unit the
   student is working in now. More than one unit lists each one (wider
   screens only, so phone cards stay short). */
.subject-card-progress{grid-column:1;display:flex;align-items:center;gap:.6rem;font-size:.78rem;color:var(--muted);margin-top:.2rem;}
.progress-bar{flex:1;max-width:180px;height:5px;border-radius:99px;background:var(--navy3);overflow:hidden;}
.progress-bar-fill{display:block;height:100%;background:var(--gold);border-radius:99px;}
.subject-card-next .muted{color:var(--muted);font-weight:500;}
.unit-summary{display:none;}
@media(min-width:600px){
  .unit-summary{display:flex;flex-direction:column;gap:.45rem;margin:.2rem 0 0;padding:.7rem 0 0;border-top:1px solid var(--border);list-style:none;}
  .unit-summary li{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.2rem .7rem;font-size:.78rem;}
  .unit-summary-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .unit-summary-count{color:var(--muted);font-family:var(--font-mono);font-size:.7rem;}
  .unit-summary .progress-bar{grid-column:1 / -1;max-width:none;height:3px;}
  .unit-summary li.done .unit-summary-count{color:var(--gold);}
}
.subject-card.itt .subject-card-cta{grid-column:1 / -1;grid-row:auto;justify-content:center;margin-top:.5rem;}
.subject-card.disabled{opacity:.5;}
.subject-card.disabled .subject-card-cta{pointer-events:none;}
@media(min-width:600px){
  .subject-card-body{padding:1.4rem;display:flex;flex-direction:column;align-items:stretch;gap:.6rem;}
  .subject-card-title{font-size:1.2rem;}
  .subject-card-cta,.subject-card.itt .subject-card-cta{margin-top:auto;align-self:flex-start;}
  .subject-card.itt{grid-column:1 / -1;}
}

.itt-notice{display:flex;align-items:center;justify-content:space-between;gap:.75rem;min-height:48px;padding:.7rem 1rem;margin-bottom:1rem;
  background:var(--navy2);border:1px solid var(--gold);border-left-width:4px;border-radius:var(--r);font-size:.9rem;}
.itt-notice:hover{background:var(--navy3);}

.empty-state{text-align:center;padding:2.5rem;color:var(--muted);background:var(--navy2);border:1px solid var(--border);border-radius:var(--r);margin-top:1rem;}
</style>
</head>
<body>

<nav class="topnav">
<a href="/dashboard.html" style="text-decoration:none;color:inherit;"><div class="topnav-logo" style="display:flex;align-items:center;gap:.6rem;">
  <img src="/assets/images/shared/1775416612494_image.webp" alt="Inspire Science" onerror="this.style.display='none'">
  <span class="topnav-title" style="flex:none;">Inspire Science</span>
</div></a>
<div class="nav-links">
  <button class="nav-link" onclick="location.href='/dashboard.html'">Dashboard</button>
  <button class="nav-link" onclick="location.href='/subjects.html'">Subjects</button>
  <button class="nav-link" onclick="location.href='/diagnostic'">Inspire Diagnostic</button>
  <button class="nav-link" onclick="location.href='/student/progress.html'">My Progress</button>
  <button class="nav-link active">ISM Class</button>
</div>
<div class="nav-user" onclick="signOut()">
  <div class="avatar" id="nav-avatar" style="background:var(--gold);color:var(--navy);">?</div>
  <span id="nav-name">Loading…</span>
</div>
</nav>

<main>
  <div class="page-header fade-in">
    <h1 class="page-title">ISM Class</h1>
    <p class="page-sub">Your weekly Inspire Science Mastery lessons — pick a subject to continue.</p>
  </div>

  <div id="itt-notice" hidden></div>

  <div class="subject-grid" id="subject-grid">
    <div class="card"><div class="spinner"></div></div>
  </div>
</main>

<div id="toast"></div>

<script>
const SUPA_URL = 'https://ygtsrdwoikqnrbexjrtl.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlndHNyZHdvaWtxbnJiZXhqcnRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMjY1NDYsImV4cCI6MjA5MDkwMjU0Nn0.K0NMpMtD1-Ajv2kFoVy7CIjf2JHJ4vXM0BLiPqvZslo';
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

// Same tolerant subject-name matching convention already used by
// student/lesson-viewer.html's subjectBadgeClass() — subject names
// aren't version-controlled (see CLAUDE.md), so this never assumes
// an exact string.
const SUBJECTS = [
  { key: 'physics',   label: 'Physics',     match: n => n.includes('physics') },
  { key: 'chemistry', label: 'Chemistry',   match: n => n.includes('chem') },
  { key: 'biology',   label: 'Biology',     match: n => n.includes('bio') },
  { key: 'maths',     label: 'Mathematics', match: n => n.includes('math') }
];

async function signOut(){ clearProfileCache(); await supa.auth.signOut(); window.location.href='/index.html'; }

(async () => {
  const { data: { user } } = await supa.auth.getUser();
  if (!user) { window.location.href = '/index.html'; return; }

  let profile = getCachedProfile();
  if (!profile || profile.id !== user.id) {
    const { data: pd } = await supa.from('profiles').select('*').eq('id', user.id).single();
    profile = pd;
    if (profile) setCachedProfile(profile);
  }
  document.getElementById('nav-name').textContent = profile?.full_name?.split(' ')[0] || 'Student';
  document.getElementById('nav-avatar').textContent = (profile?.full_name || 'S')[0].toUpperCase();

  const [{ data: subjectRows }, { data: lessonRows }, { data: unitRows }] = await Promise.all([
    supa.from('subjects').select('*'),
    // RLS scopes students to published + assigned-to-me; staff (Student View)
    // can read drafts too, so filter to published to match what students see.
    supa.from('ism_lessons').select('*').eq('is_published', true),
    supa.from('ism_units').select('id,subject_id,unit_number,title')
  ]);

  const lessonIds = (lessonRows || []).map(l => l.id);
  const { data: progressRows } = lessonIds.length
    ? await supa.from('ism_student_lesson_progress').select('lesson_id,status').eq('student_id', user.id).in('lesson_id', lessonIds)
    : { data: [] };
  const statusByLesson = Object.fromEntries((progressRows || []).map(p => [p.lesson_id, p.status]));
  const isDone = l => ISMUnits.DONE_STATUSES.includes(statusByLesson[l.id]);

  const grid = document.getElementById('subject-grid');
  grid.innerHTML = '';

  SUBJECTS.forEach(s => {
    const subjectRow = (subjectRows || []).find(r => (r.level || 'gcse') === 'gcse' && s.match((r.name || '').toLowerCase()));
    const lessons = subjectRow ? (lessonRows || []).filter(l => l.subject_id === subjectRow.id) : [];
    const count = lessons.length;
    const enabled = !!subjectRow;

    const groups = ISMUnits.groupIntoUnits(lessons, (unitRows || []).filter(u => subjectRow && u.subject_id === subjectRow.id));
    const doneCount = lessons.filter(isDone).length;
    const next = ISMUnits.nextLesson(groups, statusByLesson);
    const cta = !enabled ? 'Not available' : !count ? 'Open' : !doneCount ? 'Start' : next ? 'Continue' : 'Review';

    const card = document.createElement(enabled ? 'a' : 'div');
    card.className = `card subject-card ${s.key} ${enabled ? '' : 'disabled'} fade-in`;
    if (enabled) card.href = `/ism-class/subject.html?subject=${subjectRow.id}`;
    card.innerHTML = `
      <div class="subject-card-body">
        <div class="subject-card-title">${s.label}</div>
        ${count ? progressSummary(groups, doneCount, count, next) : `<div class="subject-card-count">${enabled ? 'No lessons assigned yet' : 'Coming soon'}</div>`}
        <span class="btn btn-gold subject-card-cta">${cta}</span>
      </div>`;
    grid.appendChild(card);
  });

  // Overall bar, then where the student is now ("Now: Unit 1 · Quadratic
  // Equations"), then — when the subject has more than one unit — a
  // line per unit.
  function progressSummary(groups, doneCount, count, next) {
    const pct = Math.round((doneCount / count) * 100);
    const unitName = g => (g.unit ? `Unit ${g.unit.unit_number} · ${g.unit.title}` : 'Other lessons');
    const now = next
      ? `<span class="muted">Now:</span> ${esc(unitName(next.group))}`
      : `All ${count} lessons done ✓`;
    const unitList = groups.filter(g => g.unit).length > 1
      ? `<ul class="unit-summary">${groups.map(g => {
          const d = g.lessons.filter(isDone).length;
          const p = Math.round((d / g.lessons.length) * 100);
          return `<li class="${d === g.lessons.length ? 'done' : ''}">
            <span class="unit-summary-name">${esc(unitName(g))}</span>
            <span class="unit-summary-count">${d}/${g.lessons.length}</span>
            <span class="progress-bar" aria-hidden="true"><span class="progress-bar-fill" style="width:${p}%"></span></span>
          </li>`;
        }).join('')}</ul>`
      : '';
    return `
      <div class="subject-card-progress">
        <span class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="Lessons done"><span class="progress-bar-fill" style="width:${pct}%"></span></span>
        <span>${doneCount} of ${count} lesson${count === 1 ? '' : 's'} done</span>
      </div>
      <div class="subject-card-next">${now}</div>
      ${unitList}`;
  }

  function esc(v) {
    return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // Fifth card, under Mathematics: the student's Test & Teach assignments.
  if (window.ITTCard) ITTCard.mount(grid, document.getElementById('itt-notice'), supa);
})();
</script>
</body>
</html>
