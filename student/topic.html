<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{
  --navy:#0b1628;--navy2:#112240;--navy3:#1a3a5c;
  --gold:#d4a017;--gold2:#f0c040;
  --orange:#e8620a;
  --white:#ffffff;
  --border:#1e3a5f;
  --muted:#7a8fa6;
  --green:#16803c;--red:#b92b1a;
  --r:6px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-body);background:var(--navy);color:var(--white);min-height:100vh;line-height:1.6;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;font-family:var(--font-body);border:none;}

::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:var(--navy2);}
::-webkit-scrollbar-thumb{background:var(--navy3);border-radius:3px;}

.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.fade-in{animation:fadeIn .4s ease both;}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

#toast{position:fixed;bottom:2rem;right:2rem;background:var(--navy2);border:1px solid var(--border);padding:.8rem 1.2rem;border-radius:var(--r);font-size:.85rem;transform:translateY(100px);opacity:0;transition:all .3s;z-index:9999;max-width:320px;}
#toast.show{transform:translateY(0);opacity:1;}
#toast.success{border-color:var(--green);}
#toast.error{border-color:var(--red);}

.badge{display:inline-block;font-family:var(--font-mono);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;padding:.2rem .55rem;border-radius:3px;}
.badge-gold{background:#d4a01722;color:var(--gold);}
.badge-green{background:#16803c22;color:#4ade80;}
.badge-blue{background:#1c4f8a22;color:#60a5fa;}
.badge-purple{background:#7c3aed22;color:#c4b5fd;}
.badge-teal{background:#0b6e6d22;color:#5eead4;}
.badge-orange{background:#e8620a22;color:var(--orange);}
.badge-red{background:#b92b1a22;color:#f87171;}

.mastery-not_started{color:var(--muted);}
.mastery-learning{color:#f87171;}
.mastery-developing{color:#fb923c;}
.mastery-secure{color:#facc15;}
.mastery-mastered{color:#4ade80;}

/* ── NAV ── */
/* Mobile-first: base is the phone layout (nav-links hidden,
   bottom tab bar takes over); min-width:769px restores the
   full top nav — see the responsive block near the end. */
.topnav{background:var(--navy2);border-bottom:1px solid var(--border);padding:.8rem 1rem;display:flex;align-items:center;gap:.8rem;position:sticky;top:0;z-index:100;}
.topnav-logo{display:flex;align-items:center;gap:.6rem;}
.topnav-logo img{height:36px;width:auto;background:#fff;border-radius:6px;padding:2px 6px;}
.logo-text{font-family:var(--font-display);font-size:1rem;font-weight:700;color:var(--gold);}
.nav-links{display:none;gap:.3rem;flex:1;}
.nav-link{padding:.45rem .9rem;border-radius:var(--r);font-size:.82rem;font-weight:500;color:var(--muted);background:none;transition:all .2s;cursor:pointer;}
.nav-link:hover{background:var(--navy3);color:var(--white);}
.nav-user{display:flex;align-items:center;gap:.75rem;padding:.4rem .8rem;border:1px solid var(--border);border-radius:var(--r);font-size:.82rem;cursor:pointer;transition:all .2s;}
.nav-user:hover{border-color:var(--gold);}
.avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;flex-shrink:0;}

/* ── MAIN ── */
main{max-width:860px;margin:0 auto;padding:1.2rem 1rem 6rem;}

/* ── BREADCRUMB ── */
.breadcrumb{font-size:.78rem;color:var(--muted);margin-bottom:1rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;}
.breadcrumb a,.breadcrumb button{color:var(--muted);background:none;font-size:.78rem;cursor:pointer;transition:color .2s;}
.breadcrumb a:hover,.breadcrumb button:hover{color:var(--gold);}
.breadcrumb span{color:var(--border);}

/* ── TOPIC HEADER ── */
.topic-header{
  background:var(--navy2);border:1px solid var(--border);
  border-radius:var(--r);padding:1.2rem 1rem;margin-bottom:1.5rem;
  position:relative;overflow:hidden;
}
.topic-header::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  border-radius:var(--r) var(--r) 0 0;
}
.subject-maths .topic-header::before{background:linear-gradient(90deg,#1c4f8a,#3b82f6);}
.subject-physics .topic-header::before{background:linear-gradient(90deg,#7c3aed,#a78bfa);}
.subject-chemistry .topic-header::before{background:linear-gradient(90deg,#0b6e6d,#2dd4bf);}
.subject-biology .topic-header::before{background:linear-gradient(90deg,#16803c,#4ade80);}

.topic-header-inner{display:flex;align-items:flex-start;justify-content:space-between;gap:1.5rem;flex-wrap:wrap;}
.topic-name{font-family:var(--font-display);font-size:1.3rem;font-weight:800;margin-bottom:.4rem;}
.topic-desc-text{font-size:.88rem;color:var(--muted);max-width:500px;line-height:1.6;}
.topic-meta-row{display:flex;gap:.5rem;margin-top:.9rem;flex-wrap:wrap;align-items:center;}

.mastery-pill{
  display:flex;align-items:center;gap:.4rem;
  background:var(--navy3);border-radius:20px;
  padding:.3rem .8rem;font-size:.78rem;font-weight:600;
}
.mastery-dot-sm{width:8px;height:8px;border-radius:50%;}

.topic-stats{display:none;flex-direction:column;gap:.4rem;align-items:flex-end;flex-shrink:0;}
.stat-item{text-align:right;}
.stat-val{font-family:var(--font-display);font-size:1.6rem;font-weight:700;line-height:1;color:var(--gold);}
.stat-lbl{font-size:.68rem;color:var(--muted);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.08em;}

/* ── CONTENT SECTIONS ── */
.content-section{margin-bottom:1.2rem;}
.section-title{
  font-family:var(--font-mono);font-size:.65rem;letter-spacing:.15em;
  text-transform:uppercase;color:var(--muted);margin-bottom:.7rem;
  display:flex;align-items:center;gap:.6rem;
}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}

.cards-list{display:flex;flex-direction:column;gap:.55rem;}

/* Key point card */
.content-card{
  background:var(--navy2);border:1px solid var(--border);
  border-radius:var(--r);padding:.9rem 1.1rem;
  display:flex;align-items:flex-start;gap:.85rem;
  font-size:.88rem;line-height:1.6;
  transition:border-color .2s;
}
.content-card:hover{border-color:var(--navy3);}
.card-icon{font-size:1rem;flex-shrink:0;margin-top:.05rem;line-height:1.4;}

/* Equation card — special styling */
.content-card.equation{
  background:#112240;border-color:#1a3a5c;
  border-left:3px solid var(--gold);
}
.content-card.equation .card-text{font-family:var(--font-mono);font-size:.83rem;color:var(--gold2);}

/* Higher only */
.content-card.higher-only{border-left:3px solid #a78bfa;}
.content-card.higher-only .card-text{color:var(--white);}
.ht-tag{
  font-family:var(--font-mono);font-size:.58rem;
  background:#7c3aed22;color:#c4b5fd;border-radius:3px;
  padding:.1rem .4rem;letter-spacing:.08em;text-transform:uppercase;
  flex-shrink:0;margin-top:.15rem;
}

/* Required practical */
.content-card.practical{border-left:3px solid #2dd4bf;}
.content-card.practical .card-text{color:var(--white);}

/* Misconception */
.content-card.misconception{border-left:3px solid #f87171;}

/* Exam tip */
.content-card.examtip{border-left:3px solid var(--gold);}

/* ── QUIZ CTA ── */
.quiz-cta{
  background:var(--navy2);border:1px solid var(--border);
  border-radius:var(--r);padding:1.8rem 2rem;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;
  gap:1.5rem;flex-wrap:wrap;
  margin-top:2rem;
}
.quiz-cta-left{}
.quiz-cta-title{font-family:var(--font-display);font-size:1.2rem;font-weight:700;margin-bottom:.3rem;}
.quiz-cta-sub{font-size:.84rem;color:var(--muted);}
.quiz-cta-meta{display:flex;gap:.5rem;margin-top:.6rem;flex-wrap:wrap;}

.btn-start{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  background:var(--gold);color:var(--navy);
  padding:.85rem 2rem;border-radius:var(--r);
  font-size:1rem;font-weight:700;transition:all .2s;
  white-space:nowrap;flex-shrink:0;
  width:100%;
}
.btn-start:hover{background:var(--gold2);transform:translateY(-1px);}

.no-quiz-msg{
  background:var(--navy2);border:1px solid var(--border);
  border-radius:var(--r);padding:2rem;text-align:center;
  color:var(--muted);font-size:.88rem;margin-top:2rem;
}

/* ── EMPTY STATE ── */
.empty-content{
  background:var(--navy2);border:1px solid var(--border);
  border-radius:var(--r);padding:2.5rem;text-align:center;
  color:var(--muted);
}
.empty-content .ei{font-size:2rem;margin-bottom:.7rem;}

/* ── SKELETON ── */
.skeleton{background:linear-gradient(90deg,var(--navy2) 25%,var(--navy3) 50%,var(--navy2) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:var(--r);}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

/* ── Mobile Bottom Navigation ──────────────────────────────────── */
.mobile-nav{
  display:block;
  position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:var(--navy2);border-top:1px solid var(--border);
  padding:.5rem 0 env(safe-area-inset-bottom,.5rem);
}
.mobile-nav-inner{
  display:flex;justify-content:space-around;align-items:center;
  max-width:600px;margin:0 auto;
}
.mob-nav-btn{
  display:flex;flex-direction:column;align-items:center;gap:.2rem;
  background:none;border:none;color:var(--muted);
  font-size:.62rem;font-family:var(--font-body);font-weight:600;
  padding:.5rem .75rem;border-radius:8px;cursor:pointer;transition:color .2s;
  min-width:44px;min-height:44px;justify-content:center;
  text-transform:uppercase;letter-spacing:.05em;
}
.mob-nav-btn .mob-icon{font-size:1.25rem;line-height:1;}
.mob-nav-btn.active{color:var(--gold);}
.mob-nav-btn:hover{color:var(--white);}

/* ── Mobile-first: base above is the phone layout; restore
   the desktop top nav and roomier spacing here. ── */
@media(min-width:769px){
  .topnav{padding:.9rem 2rem;gap:1.5rem;}
  .nav-links{display:flex;}
  main{padding:2rem 1.5rem;}
  .topic-header{padding:1.8rem 2rem;}
  .topic-name{font-size:1.7rem;}
  .topic-stats{display:flex;}
  .quiz-cta{flex-direction:row;align-items:center;}
  .btn-start{width:auto;}
  .mobile-nav{display:none;}
}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPA_URL='https://ygtsrdwoikqnrbexjrtl.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlndHNyZHdvaWtxbnJiZXhqcnRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMjY1NDYsImV4cCI6MjA5MDkwMjU0Nn0.K0NMpMtD1-Ajv2kFoVy7CIjf2JHJ4vXM0BLiPqvZslo';
const supa=supabase.createClient(SUPA_URL,SUPA_KEY);

const params=new URLSearchParams(window.location.search);
const topicId=parseInt(params.get('id'));

const subjectMeta={
  1:{cls:'maths',   color:'#3b82f6'},
  2:{cls:'physics', color:'#a78bfa'},
  3:{cls:'chemistry',color:'#2dd4bf'},
  4:{cls:'biology', color:'#4ade80'},
};

const masteryColors={
  not_started:'var(--border)',learning:'#f87171',
  developing:'#fb923c',secure:'#facc15',mastered:'#4ade80'
};

function toast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='show '+type;
  setTimeout(()=>t.className='',3500);
}

function masteryLabel(m){
  return{not_started:'Not Started',learning:'Learning',developing:'Developing',secure:'Secure',mastered:'Mastered'}[m]||'Not Started';
}

async function signOut(){await supa.auth.signOut();window.location.href='/index.html';}

function goBackToSubjects(){
  // Go back to subjects page — pass the subject id if we know it
  const url=new URL(window.location);
  const subId=url.searchParams.get('subject');
  window.location.href=subId?`/subjects.html?subject=${subId}`:'/subjects.html';
}

// Icons per content type
const typeIcons={
  key_point:'💡',
  equation:'⚡',
  required_practical:'🔬',
  higher_only:'🎯',
  common_misconception:'⚠️',
  exam_tip:'📝',
};

const typeLabels={
  key_point:'Key Points',
  equation:'Equations',
  required_practical:'Required Practicals',
  higher_only:'Higher Tier Only',
  common_misconception:'Common Misconceptions',
  exam_tip:'Exam Tips',
};

// Content type → card class
const typeClass={
  key_point:'',
  equation:'equation',
  required_practical:'practical',
  higher_only:'higher-only',
  common_misconception:'misconception',
  exam_tip:'examtip',
};

(async()=>{
  // Auth
  const {data:{user}}=await supa.auth.getUser();
  if(!user){window.location.href='/index.html';return;}
  const {data:profile}=await supa.from('profiles').select('*').eq('id',user.id).single();
  const studentBoard=(profile?.exam_board||'aqa').toUpperCase(); // 'AQA' or 'EDEXCEL'

  // Nav
  document.getElementById('nav-name').textContent=profile.full_name.split(' ')[0];
  const av=document.getElementById('nav-avatar');
  av.textContent=profile.full_name[0].toUpperCase();
  av.style.background=profile.avatar_color||'var(--gold)';
  av.style.color='var(--navy)';

  if(!topicId){
    document.getElementById('content-wrap').innerHTML='<div class="empty-content"><div class="ei">🔍</div><p>No topic selected.</p></div>';
    return;
  }

  // Load topic + subject + progress + quiz + content in parallel
  const [topicRes,contentRes,progressRes,quizzesRes]=await Promise.all([
    supa.from('topics').select('*,subjects(id,name,slug,icon,color)').eq('id',topicId).single(),
    supa.from('topic_content').select('*').eq('topic_id',topicId).eq('exam_board',studentBoard).order('order_idx'),
    supa.from('topic_progress').select('*').eq('student_id',user.id).eq('topic_id',topicId).single(),
    supa.from('quizzes').select('id,title,description,difficulty,time_limit,pass_mark').eq('topic_id',topicId).eq('is_published',true).limit(1),
  ]);

  const topic=topicRes.data;
  const content=contentRes.data||[];
  const progress=progressRes.data;
  const quiz=quizzesRes.data?.[0]||null;

  if(!topic){
    document.getElementById('content-wrap').innerHTML='<div class="empty-content"><div class="ei">❌</div><p>Topic not found.</p></div>';
    return;
  }

  const subject=topic.subjects;
  const meta=subjectMeta[subject?.id]||{cls:'biology',color:'#4ade80'};
  const mastery=progress?.mastery_level||'not_started';
  const bestScore=progress?.best_score?parseFloat(progress.best_score).toFixed(0):null;
  const attempts=progress?.attempts_count||0;

  // Update breadcrumb
  document.getElementById('bc-subject').textContent=subject?.name||'Subjects';
  // Pass subject id to back button
  const url=new URL(window.location);
  url.searchParams.set('subject',subject?.id||'');
  window.history.replaceState({},'',url);
  document.getElementById('bc-topic').textContent=topic.name;
  document.title=`${topic.name} — Inspire Science`;

  // ── RENDER HEADER ──
  document.getElementById('topic-header-wrap').innerHTML=`
    <div class="topic-header subject-${meta.cls} fade-in">
      <div class="topic-header-inner">
        <div>
          <div class="topic-name">${topic.name}</div>
          <div class="topic-desc-text">${topic.description||subject?.name+' · '+studentBoard}</div>
          <div class="topic-meta-row">
            <span class="badge badge-gold">${subject?.name||''}</span>
            <span class="badge" style="background:#1a3a5c;color:var(--muted);">${studentBoard}</span>
            <div class="mastery-pill">
              <div class="mastery-dot-sm" style="background:${masteryColors[mastery]}"></div>
              <span class="mastery-${mastery}">${masteryLabel(mastery)}</span>
            </div>
            ${bestScore?`<span class="badge badge-green">Best: ${bestScore}%</span>`:''}
          </div>
        </div>
        <div class="topic-stats">
          ${attempts>0?`
          <div class="stat-item">
            <div class="stat-val">${bestScore}%</div>
            <div class="stat-lbl">Best Score</div>
          </div>
          <div class="stat-item" style="margin-top:.5rem">
            <div class="stat-val" style="font-size:1.1rem;color:var(--muted)">${attempts}</div>
            <div class="stat-lbl">Attempts</div>
          </div>`:`
          <div class="stat-item">
            <div class="stat-val" style="color:var(--muted)">—</div>
            <div class="stat-lbl">Not attempted</div>
          </div>`}
        </div>
      </div>
    </div>`;

  // ── RENDER CONTENT ──
  if(content.length===0){
    document.getElementById('content-wrap').innerHTML=`
      <div class="empty-content fade-in">
        <div class="ei">📋</div>
        <p>Lesson notes for this topic are coming soon.<br>You can still take the quiz below!</p>
      </div>`;
  } else {
    // Group by content_type in display order
    const order=['key_point','equation','required_practical','higher_only','common_misconception','exam_tip'];
    const grouped={};
    content.forEach(c=>{
      if(!grouped[c.content_type]) grouped[c.content_type]=[];
      grouped[c.content_type].push(c);
    });

    let html='<div class="fade-in">';
    order.forEach(type=>{
      const items=grouped[type];
      if(!items||items.length===0) return;
      html+=`
        <div class="content-section">
          <div class="section-title">${typeIcons[type]||'•'} ${typeLabels[type]||type}</div>
          <div class="cards-list">`;
      items.forEach(item=>{
        const cls=typeClass[type]||'';
        const isHT=type==='higher_only';
        html+=`
          <div class="content-card ${cls}">
            <div class="card-icon">${typeIcons[type]||'•'}</div>
            <div class="card-text" style="flex:1">${item.content_text}</div>
            ${isHT?'<div class="ht-tag">HT</div>':''}
          </div>`;
      });
      html+=`</div></div>`;
    });
    html+='</div>';
    document.getElementById('content-wrap').innerHTML=html;
  }

  // ── RENDER QUIZ CTA ──
  const diffLabel={foundation:'Foundation',medium:'Medium',higher:'Higher',challenge:'Challenge'};
  const diffColor={foundation:'badge-blue',medium:'badge-gold',higher:'badge-purple',challenge:'badge-orange'};

  if(quiz){
    document.getElementById('quiz-cta-wrap').innerHTML=`
      <div class="quiz-cta fade-in">
        <div class="quiz-cta-left">
          <div class="quiz-cta-title">Ready to test yourself?</div>
          <div class="quiz-cta-sub">${quiz.description||'Put your knowledge to the test.'}</div>
          <div class="quiz-cta-meta">
            <span class="badge ${diffColor[quiz.difficulty]||'badge-gold'}">${diffLabel[quiz.difficulty]||quiz.difficulty}</span>
            <span class="badge badge-gold">${quiz.time_limit?Math.ceil(quiz.time_limit/60)+' min':' Untimed'}</span>
            <span class="badge" style="background:#1a3a5c;color:var(--muted)">Pass: ${quiz.pass_mark}%</span>
            ${attempts>0?`<span class="badge badge-green">Attempted ${attempts}×</span>`:''}
          </div>
        </div>
        <button class="btn-start" onclick="location.href='/student/quiz.html?id=${quiz.id}'">
          ${attempts>0?'Retake Quiz ↺':'Start Quiz →'}
        </button>
      </div>`;
  } else {
    document.getElementById('quiz-cta-wrap').innerHTML=`
      <div class="no-quiz-msg fade-in">
        <div style="font-size:1.5rem;margin-bottom:.5rem">🚧</div>
        <div>Quiz for this topic coming soon.</div>
        <div style="margin-top:.5rem"><button onclick="goBackToSubjects()" style="color:var(--gold);background:none;cursor:pointer;font-size:.85rem;text-decoration:underline">← Back to topics</button></div>
      </div>`;
  }

})();
</script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js");
      }
    </script>
</body>
</html>
