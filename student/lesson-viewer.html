<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson — Inspire Academic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="/assets/css/tokens.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
<style>
:root{--navy:#0b1628;--navy2:#112240;--navy3:#1a3a5c;--gold:#d4a017;--gold2:#f0c040;--white:#ffffff;--border:#1e3a5f;--muted:#7a8fa6;--green:#16803c;--red:#b92b1a;--r:6px;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:var(--font-body);background:var(--navy);color:var(--white);}

/* ── HEADER (56px fixed) ── */
.viewer-header{
  height:56px;background:var(--navy2);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:.75rem;padding:0 1.25rem;
  position:fixed;top:0;left:0;right:0;z-index:100;
  flex-shrink:0;overflow:hidden;
}
.back-btn{
  background:none;border:1px solid var(--border);color:var(--muted);
  padding:.35rem .75rem;border-radius:var(--r);font-size:.8rem;
  transition:all .2s;white-space:nowrap;flex-shrink:0;
}
.back-btn:hover{border-color:var(--gold);color:var(--gold);}
.header-title{
  font-family:var(--font-display);font-weight:700;font-size:.95rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;
}
.header-badges{display:flex;align-items:center;gap:.4rem;flex-shrink:0;}
.badge{display:inline-block;font-family:var(--font-mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;padding:.2rem .55rem;border-radius:3px;white-space:nowrap;}
.badge-subject-physics {background:rgba(129,140,248,.15);color:#818cf8;}
.badge-subject-chemistry{background:rgba(251,146,60,.15);color:#fb923c;}
.badge-subject-biology {background:rgba(74,222,128,.15);color:#4ade80;}
.badge-subject-maths   {background:rgba(96,165,250,.15);color:#60a5fa;}
.badge-subject-default {background:rgba(212,160,23,.15);color:var(--gold);}
.badge-board{background:rgba(96,165,250,.12);color:#60a5fa;}
.badge-tier {background:rgba(167,139,250,.12);color:#a78bfa;}
.badge-dur  {background:rgba(122,143,166,.1);color:var(--muted);}
.badge-started  {background:rgba(251,191,36,.12);color:#fbbf24;}
.badge-complete {background:rgba(74,222,128,.15);color:#4ade80;}
/* Mobile-first: the header is a tight single row (back + title +
   badges + complete button) with no wrap, so on narrow screens the
   least essential pieces give way first to keep the lesson title
   readable — restored once there's room, see min-width below. */
.badge-dur{display:none;}
.complete-btn-text{display:none;}

/* ── MARK COMPLETE BUTTON ── */
.complete-btn{
  background:var(--gold);color:var(--navy);border:none;
  padding:.45rem 1.1rem;border-radius:var(--r);font-size:.82rem;font-weight:700;
  transition:all .25s;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:.4rem;
}
.complete-btn:hover{background:var(--gold2);}
.complete-btn.done{background:var(--green);color:#fff;}
.complete-btn.done:hover{opacity:.9;}

/* ── CONTENT AREA ── */
.viewer-content{
  position:fixed;top:56px;left:0;right:0;bottom:0;
  background:var(--navy);
  overflow:hidden;
}

/* iframe pins to all four edges — avoids height:100% quirks in fixed parents */
.content-iframe{
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  border:none;margin:0;padding:0;
}

/* Video embed (16:9, centred) */
.video-wrap{
  width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:#000;
}
.video-inner{
  position:relative;width:100%;max-width:1280px;
  padding-bottom:min(56.25%, 720px);height:0;
}
.video-inner iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;}

/* Loading overlay */
.loading-overlay{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--navy);z-index:10;gap:1rem;transition:opacity .4s;
}
.loading-overlay.hidden{opacity:0;pointer-events:none;}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:.85rem;color:var(--muted);}

/* Error state */
.error-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:1rem;color:var(--muted);
}
.error-icon{font-size:3rem;}
.error-title{font-family:var(--font-display);font-size:1.25rem;color:var(--white);}
.error-sub{font-size:.88rem;max-width:400px;text-align:center;}

/* ── TOAST ── */
#toast{position:fixed;bottom:2rem;right:2rem;background:var(--navy2);border:1px solid var(--border);padding:.8rem 1.2rem;border-radius:var(--r);font-size:.85rem;transform:translateY(100px);opacity:0;transition:all .3s;z-index:9999;max-width:320px;}
#toast.show{transform:translateY(0);opacity:1;}
#toast.success{border-color:var(--green);}
#toast.error{border-color:var(--red);}

@media (min-width: 480px) {
  .badge-dur{display:inline-block;}
  .complete-btn-text{display:inline;}
}
</style>
</head>
<body>

<!-- FIXED HEADER -->
<header class="viewer-header" id="viewer-header">
  <button class="back-btn" onclick="history.back()">← Back</button>
  <div class="header-title" id="header-title">Loading…</div>
  <div class="header-badges" id="header-badges"></div>
  <button class="complete-btn" id="complete-btn" onclick="markComplete()" style="display:none;">
    ✓ <span class="complete-btn-text">Mark Complete</span>
  </button>
</header>

<!-- CONTENT AREA -->
<div class="viewer-content" id="viewer-content">
  <div class="loading-overlay" id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-text">Loading lesson…</div>
  </div>
</div>

<div id="toast"></div>

<script>
const SUPA_URL = 'https://ygtsrdwoikqnrbexjrtl.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlndHNyZHdvaWtxbnJiZXhqcnRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMjY1NDYsImV4cCI6MjA5MDkwMjU0Nn0.K0NMpMtD1-Ajv2kFoVy7CIjf2JHJ4vXM0BLiPqvZslo';
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

let currentUser = null;
let currentLesson = null;
let progressId = null;
let isCompleted = false;

function toast(msg, type='success'){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show ' + type;
  setTimeout(() => t.className = '', 3000);
}

function subjectBadgeClass(name){
  const n = (name||'').toLowerCase();
  if(n.includes('physics'))  return 'badge-subject-physics';
  if(n.includes('chem'))     return 'badge-subject-chemistry';
  if(n.includes('bio'))      return 'badge-subject-biology';
  if(n.includes('math'))     return 'badge-subject-maths';
  return 'badge-subject-default';
}

// Convert any YouTube or Vimeo URL to an embed URL
function getEmbedUrl(url){
  if(!url) return '';
  // YouTube
  const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if(yt) return `https://www.youtube.com/embed/${yt[1]}?rel=0&modestbranding=1&autoplay=0`;
  // Vimeo
  const vm = url.match(/vimeo\.com\/(\d+)/);
  if(vm) return `https://player.vimeo.com/video/${vm[1]}?title=0&byline=0&portrait=0`;
  return url;
}

function showError(title, sub){
  const content = document.getElementById('viewer-content');
  content.innerHTML = `
    <div class="error-state">
      <div class="error-icon">📭</div>
      <div class="error-title">${title}</div>
      <div class="error-sub">${sub}</div>
    </div>`;
}

async function renderContent(lesson){
  const content = document.getElementById('viewer-content');

  if(lesson.lesson_type === 'video'){
    const embedUrl = getEmbedUrl(lesson.content_url);
    content.innerHTML = `
      <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div><div class="loading-text">Loading video…</div>
      </div>
      <div class="video-wrap">
        <div class="video-inner">
          <iframe src="${embedUrl}"
            allowfullscreen
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            onload="document.getElementById('loading-overlay').classList.add('hidden')">
          </iframe>
        </div>
      </div>`;
    return;
  }

  if(lesson.lesson_type === 'html'){
    // Supabase Storage serves .html as text/plain, which makes browsers render
    // raw source. Fetch the content and re-serve it via a Blob URL typed as
    // text/html so the browser renders it correctly.
    content.innerHTML = `
      <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div><div class="loading-text">Loading lesson…</div>
      </div>
      <iframe
        id="html-iframe"
        class="content-iframe"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>`;

    const response = await fetch(lesson.content_url);
    let html = await response.text();

    // Override internal masterclass layout constraints so content fills the iframe
    const overrideStyle = `<style>
.app{grid-template-columns:260px 1fr!important;}
.main{max-width:100%!important;padding:32px 40px!important;}
body{overflow-x:hidden!important;}
</style>`;
    html = html.replace('</head>', overrideStyle + '</head>');

    const blob = new Blob([html], { type: 'text/html' });
    const blobUrl = URL.createObjectURL(blob);

    const iframe = document.getElementById('html-iframe');
    iframe.onload = () => document.getElementById('loading-overlay')?.classList.add('hidden');
    iframe.src = blobUrl;
    return;
  }

  let iframeSrc = lesson.content_url || '';

  if(lesson.lesson_type === 'doc'){
    iframeSrc = `https://docs.google.com/viewer?url=${encodeURIComponent(lesson.content_url)}&embedded=true`;
  }

  content.innerHTML = `
    <div class="loading-overlay" id="loading-overlay">
      <div class="spinner"></div><div class="loading-text">Loading lesson…</div>
    </div>
    <iframe
      class="content-iframe"
      src="${iframeSrc}"
      allowfullscreen
      onload="document.getElementById('loading-overlay').classList.add('hidden')">
    </iframe>`;
}

function renderHeader(lesson, progress){
  document.title = lesson.title + ' — Inspire Academic';
  document.getElementById('header-title').textContent = lesson.title;

  const subjectName = lesson.subjects?.name || '';
  const topicName   = lesson.topics?.name || '';
  isCompleted = !!progress?.completed_at;

  const badges = [
    subjectName ? `<span class="badge ${subjectBadgeClass(subjectName)}">${subjectName}</span>` : '',
    topicName   ? `<span class="badge badge-dur">${topicName}</span>` : '',
    lesson.exam_board ? `<span class="badge badge-board">${lesson.exam_board}</span>` : '',
    lesson.tier       ? `<span class="badge badge-tier">${lesson.tier}</span>` : '',
    lesson.duration_minutes ? `<span class="badge badge-dur">~${lesson.duration_minutes} min</span>` : '',
    isCompleted ? '<span class="badge badge-complete">✓ Completed</span>' : (progress ? '<span class="badge badge-started">In Progress</span>' : ''),
  ].filter(Boolean).join('');

  document.getElementById('header-badges').innerHTML = badges;

  const btn = document.getElementById('complete-btn');
  btn.style.display = 'flex';
  if(isCompleted){
    btn.textContent = '✓ Completed';
    btn.classList.add('done');
  }
}

async function markComplete(){
  if(!currentUser || !currentLesson) return;
  if(isCompleted){ toast('Already marked complete!'); return; }

  const { error } = await supa.from('lesson_progress')
    .update({ completed_at: new Date().toISOString() })
    .eq('student_id', currentUser.id)
    .eq('lesson_id', currentLesson.id);

  if(error){ toast('Could not save progress: ' + error.message, 'error'); return; }

  isCompleted = true;
  const btn = document.getElementById('complete-btn');
  btn.textContent = '✓ Completed';
  btn.classList.add('done');

  // Update badge
  const badgesEl = document.getElementById('header-badges');
  const inProg = badgesEl.querySelector('.badge-started');
  if(inProg) inProg.outerHTML = '<span class="badge badge-complete">✓ Completed</span>';
  else badgesEl.innerHTML += '<span class="badge badge-complete">✓ Completed</span>';

  toast('Lesson marked complete!', 'success');
}

async function trackStart(lessonId){
  if(!currentUser) return;
  await supa.from('lesson_progress').upsert({
    student_id: currentUser.id,
    lesson_id: lessonId
  }, { onConflict: 'student_id,lesson_id', ignoreDuplicates: true });
}

async function init(){
  const params = new URLSearchParams(window.location.search);
  const lessonId = params.get('id');

  if(!lessonId){ showError('No lesson specified', 'Please return to the lesson library and try again.'); return; }

  // Auth
  const { data:{ user } } = await supa.auth.getUser();
  if(!user){ window.location.href = '/index.html'; return; }
  currentUser = user;

  // Fetch lesson
  const { data: lesson, error } = await supa
    .from('lessons')
    .select('*, subjects(name), topics(name)')
    .eq('id', lessonId)
    .single();

  if(error || !lesson){ showError('Lesson not found', 'This lesson may have been removed or is not yet published.'); return; }
  currentLesson = lesson;

  // Fetch existing progress
  const { data: progress } = await supa.from('lesson_progress')
    .select('*')
    .eq('student_id', user.id)
    .eq('lesson_id', lessonId)
    .single();

  // Track start (upsert, won't overwrite started_at if already exists)
  await trackStart(lessonId);

  renderHeader(lesson, progress);
  await renderContent(lesson);
}

init();
</script>
</body>
</html>
