<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Dashboard - Inspire Academic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="assets/css/tokens.css">
<style>
    :root {
      --navy: #0b1628;
      --gold: #c9a84c;
      --bg: #f8f9fa;
      --border: rgba(11,22,40,.1);
    }
    
    * { margin:0; padding:0; box-sizing:border-box; }
    
    body {
      font-family:var(--font-body);
      background: var(--bg);
      color: var(--navy);
      min-height: 100vh;
    }
    
    /* HEADER */
    .header {
      background: var(--navy);
      color: white;
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
    }
    
    .logo {
      font-family:var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
    }
    
    .logo .gold { color: var(--gold); }
    
    .header-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    
    .parent-name {
      font-weight: 500;
    }
    
    .logout-btn {
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2);
      color: white;
      padding: .5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-family:var(--font-body);
      font-size: .9rem;
      transition: all .2s;
    }
    
    .logout-btn:hover {
      background: rgba(255,255,255,.15);
    }
    
    /* MAIN CONTAINER */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    .page-title {
      font-family:var(--font-display);
      font-size: 2rem;
      margin-bottom: .5rem;
    }
    
    .page-subtitle {
      color: #666;
      margin-bottom: 2rem;
    }
    
    /* CHILDREN GRID */
    .children-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }
    
    .child-card {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      transition: all .2s;
      cursor: pointer;
    }
    
    .child-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,.12);
    }
    
    .child-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    
    .child-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--navy);
    }
    
    .child-year {
      font-size: .85rem;
      color: #666;
      margin-top: .25rem;
    }
    
    .last-active {
      font-size: .8rem;
      color: #999;
    }
    
    .stats-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin-bottom: 1rem;
    }
    
    .stat {
      text-align: center;
    }
    
    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--navy);
    }
    
    .stat-label {
      font-size: .8rem;
      color: #666;
      margin-top: .25rem;
    }
    
    .progress-bar {
      background: #e0e0e0;
      border-radius: 8px;
      height: 8px;
      overflow: hidden;
      margin-top: 1rem;
    }
    
    .progress-fill {
      background: linear-gradient(90deg, var(--gold) 0%, #b8964a 100%);
      height: 100%;
      transition: width .3s;
    }
    
    .view-details-btn {
      width: 100%;
      padding: .75rem;
      background: linear-gradient(135deg, var(--gold) 0%, #b8964a 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-family:var(--font-body);
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      transition: all .2s;
    }
    
    .view-details-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(201,168,76,.3);
    }
    
    /* EMPTY STATE */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    
    .empty-icon {
      font-size: 4rem;
      margin-bottom: 1rem;
    }
    
    .empty-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: .5rem;
    }
    
    .empty-text {
      color: #666;
      margin-bottom: 1.5rem;
    }
    
    /* LOADING */
    .loading {
      text-align: center;
      padding: 4rem 2rem;
    }
    
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--gold);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    /* STREAK BADGE */
    .streak-badge {
      display: inline-flex;
      align-items: center;
      gap: .25rem;
      background: rgba(255,107,0,.1);
      color: #ff6b00;
      padding: .25rem .5rem;
      border-radius: 4px;
      font-size: .8rem;
      font-weight: 600;
    }
    
    @media (max-width: 768px) {
      .container { padding: 1rem; }
      .header { padding: 1rem; }
      .children-grid { grid-template-columns: 1fr; }
      .stats-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="header">
  <div class="logo"><span class="gold">Inspire</span> Academic</div>
  <div class="header-right">
    <div class="parent-name" id="parent-name">Loading...</div>
    <button class="logout-btn" onclick="logout()">Sign Out</button>
  </div>
</div>

<div class="container">
  <h1 class="page-title">My Children</h1>
  <p class="page-subtitle">Track your children's GCSE revision progress</p>
  
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Loading your children's progress...</p>
  </div>
  
  <div id="children-container" class="children-grid" style="display:none;"></div>
  
  <div id="empty-state" class="empty-state" style="display:none;">
    <div class="empty-icon">📚</div>
    <h2 class="empty-title">No Students Linked</h2>
    <p class="empty-text">
      No students are currently linked to your parent account.<br>
      When your child registers with your email, they'll appear here automatically.
    </p>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://ygtsrdwoikqnrbexjrtl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlndHNyZHdvaWtxbnJiZXhqcnRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMjY1NDYsImV4cCI6MjA5MDkwMjU0Nn0.K0NMpMtD1-Ajv2kFoVy7CIjf2JHJ4vXM0BLiPqvZslo';
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function init() {
  try {
    // Check auth
    const { data: { user } } = await supa.auth.getUser();
    if (!user) {
      window.location.href = 'parent-login.html';
      return;
    }
    
    // Get parent profile
    const { data: parentProfile } = await supa
      .from('parent_profiles')
      .select('*')
      .eq('user_id', user.id)
      .single();
    
    if (!parentProfile) {
      window.location.href = 'parent-login.html';
      return;
    }
    
    // Display parent name
    document.getElementById('parent-name').textContent = `${parentProfile.first_name} ${parentProfile.last_name}`;
    
    // Load children
    await loadChildren(user.id);
    
  } catch (error) {
    console.error('Init error:', error);
    alert('Error loading dashboard. Please try again.');
  }
}

async function loadChildren(parentUserId) {
  try {
    // Call Supabase function to get children stats
    const { data, error } = await supa.rpc('get_parent_children_stats', {
      parent_user_id: parentUserId
    });
    
    if (error) throw error;
    
    document.getElementById('loading').style.display = 'none';
    
    if (!data || data.length === 0) {
      document.getElementById('empty-state').style.display = 'block';
      return;
    }
    
    // Display children
    const container = document.getElementById('children-container');
    container.style.display = 'grid';
    
    data.forEach(child => {
      const card = createChildCard(child);
      container.appendChild(card);
    });
    
  } catch (error) {
    console.error('Load children error:', error);
    document.getElementById('loading').innerHTML = '<p style="color:#c62828;">Error loading children. Please refresh the page.</p>';
  }
}

function createChildCard(child) {
  const card = document.createElement('div');
  card.className = 'child-card';
  card.onclick = () => viewChildDetails(child.student_id);
  
  const lastActive = child.last_active 
    ? new Date(child.last_active).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })
    : 'Never';
  
  const accuracy = child.avg_accuracy || 0;
  
  card.innerHTML = `
    <div class="child-header">
      <div>
        <div class="child-name">${child.student_name || 'Student'}</div>
        <div class="child-year">${child.year_group || 'N/A'} • ${child.exam_board || 'N/A'}</div>
      </div>
      ${child.current_streak > 0 ? `<div class="streak-badge">🔥 ${child.current_streak} day${child.current_streak > 1 ? 's' : ''}</div>` : ''}
    </div>
    
    <div class="stats-row">
      <div class="stat">
        <div class="stat-value">${child.total_quizzes || 0}</div>
        <div class="stat-label">Quizzes Taken</div>
      </div>
      <div class="stat">
        <div class="stat-value">${Math.round(accuracy)}%</div>
        <div class="stat-label">Avg Accuracy</div>
      </div>
    </div>
    
    <div class="stats-row">
      <div class="stat">
        <div class="stat-value">${child.topics_mastered || 0}</div>
        <div class="stat-label">Topics Mastered</div>
      </div>
      <div class="stat">
        <div class="stat-value" style="font-size:1.25rem;color:#666;">${lastActive}</div>
        <div class="stat-label">Last Active</div>
      </div>
    </div>
    
    <div class="progress-bar">
      <div class="progress-fill" style="width:${accuracy}%"></div>
    </div>
    
    <button class="view-details-btn" onclick="event.stopPropagation(); viewChildDetails('${child.student_id}')">
      View Detailed Progress →
    </button>
  `;
  
  return card;
}

function viewChildDetails(studentId) {
  // For now, just show alert - we'll build detailed view later
  window.location.href = `parent-child-details.html?student=${studentId}`;
}

async function logout() {
  await supa.auth.signOut();
  window.location.href = 'parent-login.html';
}

// Initialize
init();
</script>

</body>
</html>
