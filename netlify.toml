[build]
publish = "."
functions = "netlify/functions"
edge_functions = "netlify/edge-functions"

[[edge_functions]]
path = "/api/generate-question"
function = "generate-question"

[[edge_functions]]
path = "/api/assessment-center"
function = "assessment-center"

[[edge_functions]]
path = "/api/mileiq-distance"
function = "mileiq-distance"

[[edge_functions]]
path = "/api/create-teacher"
function = "create-teacher"

[[edge_functions]]
path = "/api/mark-exam-response"
function = "mark-exam-response"

[[edge_functions]]
path = "/api/protege-ai"
function = "protege-ai"

# Legacy path — revision-pack.html calls this directly
[[edge_functions]]
path = "/.netlify/functions/mark-exam-response"
function = "mark-exam-response"

[functions]
  [functions."*"]
  node_bundler = "esbuild"

# Workaround for Netlify Projects platform edge function routing bug
# Forces /api/* requests to resolve through the edge function layer
[[redirects]]
  from = "/api/*"
  to = "/.netlify/edge-functions/:splat"
  status = 200
  force = true
