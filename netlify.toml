# ── Phase 2A — Programme Recruitment Platform (Year 6 Science Bridging) ──
# Short URL: never printed/QR'd as the long canonical path. 302 (temporary)
# during the launch window; flip to 301 once the landing page URL is
# confirmed stable. Query params (?source=&campaign=) pass through
# automatically since no query string is set on the "to" target.
[[redirects]]
  from = "/bridge"
  to = "/programmes/year-6-science-bridge"
  status = 302

# General Inspire Academic registration-of-interest, replacing the old
# Google Form. Same short-URL/302 rationale as /bridge above. Points
# straight at the form (not the /programmes/inspire-academic landing
# page) — the landing page's own "Register Interest" CTA was an
# unnecessary extra click for visitors arriving via this link.
[[redirects]]
  from = "/interest"
  to = "/programmes/inspire-academic/register/"
  status = 302

# Free AI diagnostic assessment — marketing-campaign entry point. Works
# fully as a guest (no login required, see assessment-engine.html's
# "Guest mode" fallback); logged-in students who reach it get their
# attempt saved. Same short-URL/302 rationale as /bridge above.
[[redirects]]
  from = "/diagnostic"
  to = "/assessment-engine/assessment-engine.html"
  status = 302

# API-first route for lead capture, following the /api/v1/resource/action
# convention (CLAUDE.md principle 3) — kept separate from the older,
# unversioned /api/* functions above.
[[redirects]]
  from = "/api/v1/leads/create"
  to = "/.netlify/functions/leads-create"
  status = 200
  force = true

# Emails the diagnostic assessment report PDF (assessment-report.html) to
# a parent-supplied address. Same /api/v1/resource/action convention.
[[redirects]]
  from = "/api/v1/assessment/report/email"
  to = "/.netlify/functions/assessment-report-email"
  status = 200
  force = true
