[build]
publish = "."
functions = "netlify/functions"
edge_functions = "netlify/edge-functions"

[[edge_functions]]
path = "/api/generate-question"
function = "generate-question"

[[edge_functions]]
path = "/api/assessment-center"
function = "assessment-center"

[[edge_functions]]
path = "/api/mileiq-distance"
function = "mileiq-distance"

[[edge_functions]]
path = "/api/create-teacher"
function = "create-teacher"

[functions]
  [functions."*"]
  node_bundler = "esbuild"
