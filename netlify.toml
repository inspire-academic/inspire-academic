[build]
publish = "."
functions = "netlify/functions"
edge_functions = "netlify/edge-functions"

# Long-lived cache for immutable assets (images, fonts, JS)
[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[context.production]
  branch = "main"

[context.staging]
  branch = "staging"

# Edge functions kept for reference but routing via [[redirects]] below
[[edge_functions]]
path = "/api/generate-question"
function = "generate-question"

[[edge_functions]]
path = "/api/assessment-center"
function = "assessment-center"

[[edge_functions]]
path = "/api/mileiq-distance"
function = "mileiq-distance"

[[edge_functions]]
path = "/api/create-teacher"
function = "create-teacher"

[[edge_functions]]
path = "/api/mark-exam-response"
function = "mark-exam-response"

[[edge_functions]]
path = "/api/protege-ai"
function = "protege-ai"

[[edge_functions]]
path = "/.netlify/functions/mark-exam-response"
function = "mark-exam-response"

[functions]
  [functions."*"]
  node_bundler = "esbuild"

# Route /api/* to Netlify Functions (Node.js) — reliable on Projects platform
[[redirects]]
  from = "/api/generate-question"
  to = "/.netlify/functions/generate-question"
  status = 200
  force = true

[[redirects]]
  from = "/api/assessment-center"
  to = "/.netlify/functions/assessment-center"
  status = 200
  force = true

[[redirects]]
  from = "/api/mark-exam-response"
  to = "/.netlify/functions/mark-exam-response"
  status = 200
  force = true

[[redirects]]
  from = "/api/protege-ai"
  to = "/.netlify/functions/protege-ai"
  status = 200
  force = true
