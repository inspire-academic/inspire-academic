<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inspire Science · Interactive Periodic Table</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

:root {
  --navy: #0b1628;
  --navy2: #0f1e36;
  --navy3: #162540;
  --gold: #d4a843;
  --gold2: #f0c96a;
  --gold-dim: rgba(212,168,67,0.15);
  --text: #e8edf5;
  --text-dim: rgba(232,237,245,0.55);
  --border: rgba(212,168,67,0.18);

  /* category colours */
  --alkali:     #e74c3c;
  --alkaline:   #e67e22;
  --transition: #3498db;
  --post-trans: #27ae60;
  --metalloid:  #16a085;
  --nonmetal:   #8e44ad;
  --halogen:    #d35400;
  --noble:      #2980b9;
  --lanthanide: #c0392b;
  --actinide:   #7f8c8d;
}

*{margin:0;padding:0;box-sizing:border-box;}

body {
  background: var(--navy);
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
  /* iOS scroll fix */
  -webkit-text-size-adjust: 100%;
}

/* ─── HEADER ─── */
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 2rem;
  border-bottom: 1px solid var(--border);
  background: var(--navy2);
  flex-wrap: wrap;
  gap: 0.8rem;
}
.logo {
  display: flex;
  align-items: center;
}
.logo-img {
  height: 42px;
  width: auto;
  border-radius: 8px;
  background: #fff;
  padding: 4px 8px;
  object-fit: contain;
  display: block;
}

/* mode toggle */
.mode-wrap {
  display: flex;
  align-items: center;
  gap: 0.6rem;
}
.mode-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 0.08em;
  color: var(--text-dim);
}
.mode-labels {
  display: flex;
  gap: 0.4rem;
  font-family: 'DM Mono', monospace;
  font-size: 0.72rem;
}
.mode-labels span {
  padding: 0.3rem 0.9rem;
  border-radius: 5px;
  border: 1px solid var(--border);
  color: var(--text-dim);
  transition: all 0.2s;
  cursor: pointer;
  user-select: none;
}
.mode-labels span:hover { border-color: rgba(212,168,67,0.4); color: var(--text); }
.mode-labels span.active {
  background: var(--gold-dim);
  border-color: var(--gold);
  color: var(--gold);
  font-weight: 600;
}

/* nav tabs */
.nav-tabs {
  display: flex;
  gap: 0.4rem;
  padding: 0.8rem 2rem;
  border-bottom: 1px solid var(--border);
  background: var(--navy2);
}
.tab-btn {
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  font-weight: 500;
  padding: 0.45rem 1.1rem;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  transition: all 0.2s;
}
.tab-btn:hover { color: var(--text); border-color: rgba(212,168,67,0.4); }
.tab-btn.active {
  background: var(--gold-dim);
  border-color: var(--gold);
  color: var(--gold);
}

/* ─── MAIN CONTENT ─── */
.tab-panel { display: none; }
.tab-panel.active {
  display: block;
  overflow-x: hidden; /* prevent whole page scroll */
}

/* ─── PERIODIC TABLE ─── */
.pt-section {
  padding: 1rem 1rem 2rem;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.pt-scroll-wrapper {
  /* On desktop: fill viewport. On mobile: fixed width with scroll */
  min-width: 860px;
  width: 100%;
}
.pt-title {
  font-family: 'Playfair Display', serif;
  font-size: 1rem;
  color: var(--gold);
  margin-bottom: 0.6rem;
  letter-spacing: 0.05em;
}
.pt-subtitle {
  font-size: 0.7rem;
  color: var(--text-dim);
  margin-bottom: 1rem;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.06em;
}

.pt-grid {
  display: grid;
  /* On desktop: fill available width. min 46px per cell for readability */
  grid-template-columns: repeat(18, minmax(0, 1fr));
  gap: 3px;
  width: 100%;
}

.elem-btn {
  aspect-ratio: 1;
  min-width: 0; /* grid controls width */
  border-radius: 5px;
  -webkit-tap-highlight-color: transparent;
  border: 1px solid rgba(255,255,255,0.08);
  background: var(--navy3);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2px;
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  position: relative;
  overflow: hidden;
}
.elem-btn::before {
  content: '';
  position: absolute; inset: 0;
  opacity: 0.12;
  transition: opacity 0.2s;
}
.elem-btn:hover {
  transform: scale(1.18);
  z-index: 10;
  box-shadow: 0 0 16px rgba(212,168,67,0.4);
  border-color: var(--gold);
}
.elem-btn .an {
  font-family: 'DM Mono', monospace;
  font-size: 0.52rem;
  color: rgba(255,255,255,0.5);
  line-height: 1;
}
.elem-btn .sym {
  font-family: 'Playfair Display', serif;
  font-size: 1rem;
  font-weight: 700;
  line-height: 1;
  margin: 1px 0;
}
.elem-btn .nm {
  font-size: 0.42rem;
  color: rgba(255,255,255,0.55);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
  line-height: 1;
}

/* category colours */
.cat-alkali    { border-left: 3px solid var(--alkali);    } .cat-alkali    .sym { color: var(--alkali); }
.cat-alkaline  { border-left: 3px solid var(--alkaline);  } .cat-alkaline  .sym { color: var(--alkaline); }
.cat-transition{ border-left: 3px solid var(--transition);} .cat-transition .sym { color: var(--transition); }
.cat-post      { border-left: 3px solid var(--post-trans);} .cat-post      .sym { color: var(--post-trans); }
.cat-metalloid { border-left: 3px solid var(--metalloid); } .cat-metalloid .sym { color: var(--metalloid); }
.cat-nonmetal  { border-left: 3px solid var(--nonmetal);  } .cat-nonmetal  .sym { color: var(--nonmetal); }
.cat-halogen   { border-left: 3px solid var(--halogen);   } .cat-halogen   .sym { color: var(--halogen); }
.cat-noble     { border-left: 3px solid var(--noble);     } .cat-noble     .sym { color: var(--noble); }
.cat-lanthanide{ border-left: 3px solid var(--lanthanide);} .cat-lanthanide .sym { color: var(--lanthanide); }
.cat-actinide  { border-left: 3px solid var(--actinide);  } .cat-actinide  .sym { color: var(--actinide); }

/* spacers */
.pt-spacer { /* empty grid cell */ }
.pt-gap-row { grid-column: 1 / -1; height: 6px; }
.lanthanide-label, .actinide-label {
  grid-column: 1 / 3;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 4px;
  font-family: 'DM Mono', monospace;
  font-size: 0.5rem;
  color: var(--text-dim);
  letter-spacing: 0.05em;
}

/* legend */
.pt-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  margin-top: 1rem;
}
.leg-item {
  display: flex;
  align-items: center;
  gap: 0.3rem;
  font-size: 0.63rem;
  color: var(--text-dim);
}
.leg-dot {
  width: 8px; height: 8px; border-radius: 2px;
}

/* ─── MODAL ─── */
.modal-bg {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(4px);
  z-index: 100;
  align-items: center;
  justify-content: center;
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--navy2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2rem;
  width: min(680px, 95vw);
  max-height: 90vh;
  overflow-y: auto;
  position: relative;
  box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  animation: modalIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes modalIn {
  from { transform: scale(0.85); opacity: 0; }
  to   { transform: scale(1);    opacity: 1; }
}
.modal-close {
  position: absolute; top: 1rem; right: 1rem;
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
}
.modal-close:hover { border-color: var(--gold); color: var(--gold); }

.modal-header {
  display: flex;
  gap: 1.5rem;
  align-items: flex-start;
  margin-bottom: 1.5rem;
}
.modal-periodic-box {
  border: 2px solid var(--gold);
  border-radius: 8px;
  padding: 0.5rem 0.8rem;
  text-align: center;
  background: var(--gold-dim);
  min-width: 72px;
  flex-shrink: 0;
}
.modal-an { font-family:'DM Mono',monospace; font-size:0.7rem; color: var(--gold); }
.modal-sym { font-family:'Playfair Display',serif; font-size:2.2rem; font-weight:900; color: var(--gold); line-height:1; }
.modal-mass { font-family:'DM Mono',monospace; font-size:0.62rem; color: var(--text-dim); }
.modal-info h2 { font-family:'Playfair Display',serif; font-size:1.4rem; color: var(--text); }
.modal-info .modal-cat { font-size:0.68rem; color: var(--text-dim); margin-top:0.2rem; letter-spacing:0.06em; text-transform:uppercase; }
.modal-info .modal-config {
  font-family:'DM Mono',monospace;
  font-size:0.75rem;
  color: var(--gold2);
  margin-top:0.5rem;
  background: rgba(212,168,67,0.08);
  padding: 0.3rem 0.6rem;
  border-radius: 5px;
  border: 1px solid var(--border);
  display: inline-block;
}
.modal-info .modal-config-label {
  font-size:0.6rem; color: var(--text-dim); margin-top:0.6rem; letter-spacing:0.06em; text-transform:uppercase;
}

.modal-canvas-wrap {
  text-align: center;
  margin: 0.5rem 0 1rem;
}
#atomCanvas {
  border-radius: 12px;
  background: var(--navy);
  border: 1px solid var(--border);
}

.modal-facts {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
  gap: 0.7rem;
  margin-top: 1rem;
}
.fact-box {
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 8px;
  padding: 0.6rem 0.8rem;
}
.fact-box .fv { font-size:1rem; font-weight:600; color: var(--gold2); line-height:1; }
.fact-box .fk { font-family:'DM Mono',monospace; font-size:0.58rem; color: var(--text-dim); text-transform:uppercase; letter-spacing:0.06em; margin-top:0.2rem; }

/* ─── BONDING SECTION ─── */
.bonding-section {
  padding: 1.5rem 2rem 3rem;
  max-width: 860px;
  margin: 0 auto; /* centre on desktop */
  width: 100%;
}
.bond-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.2rem;
  color: var(--gold);
  margin-bottom: 0.3rem;
}
.bond-subtitle { font-size:0.72rem; color: var(--text-dim); margin-bottom: 1.5rem; font-family:'DM Mono',monospace; letter-spacing:0.06em; }

.bond-controls {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  margin-bottom: 1.5rem;
  align-items: flex-end;
}
.bond-ctrl-group { display:flex; flex-direction:column; gap:0.4rem; }
.bond-ctrl-group label {
  font-family:'DM Mono',monospace; font-size:0.65rem; color: var(--text-dim); letter-spacing:0.07em; text-transform:uppercase;
}
/* elem-search replaced by select-wrap */
.select-wrap {
  position: relative;
}
.select-wrap::after {
  content: '▾';
  position: absolute;
  right: 0.6rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--gold);
  font-size: 0.75rem;
  pointer-events: none;
}
.bond-type-select {
  background: var(--navy3);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family:'DM Mono',monospace;
  font-size:0.8rem;
  padding: 0.5rem 2rem 0.5rem 0.8rem;
  outline: none;
  cursor: pointer;
  transition: border-color 0.2s;
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
  width: 100%;
  min-width: 120px;
}
.bond-type-select:focus { border-color: var(--gold); }
.bond-type-select option { background: #162540; color: #e8edf5; } /* iOS option colour */
.elem-select { min-width: 140px; }
/* Ensure select has proper height on iOS */
@supports (-webkit-touch-callout: none) {
  .bond-type-select { min-height: 44px; font-size: 16px; } /* 16px prevents iOS zoom */
}
.bond-go-btn {
  background: var(--gold-dim);
  border: 1px solid var(--gold);
  color: var(--gold);
  font-family:'DM Sans',sans-serif;
  font-weight:600;
  font-size:0.85rem;
  padding: 0.6rem 1.4rem;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.2s;
  letter-spacing:0.04em;
  min-height: 44px; /* iOS minimum tap target */
  -webkit-tap-highlight-color: transparent;
}
.bond-go-btn:hover { background: rgba(212,168,67,0.3); box-shadow: 0 0 16px rgba(212,168,67,0.3); }

#bondCanvas {
  border-radius: 12px;
  background: var(--navy);
  border: 1px solid var(--border);
  display: block;
  width: 100%;
  max-width: 100%; /* fill bonding-section width */
}
.bond-description {
  margin-top: 1rem;
  padding: 1rem 1.2rem;
  background: rgba(212,168,67,0.06);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 0.8rem;
  line-height: 1.7;
  color: var(--text);
  max-width: 100%;
}
.bond-description strong { color: var(--gold); }

/* Responsive: on narrow screens, lock to min 46px per element with scroll */
@media (max-width: 900px) {
  .pt-scroll-wrapper { min-width: 860px; }
  .elem-btn { min-width: 44px; }
  .pt-section { padding: 0.8rem 0.8rem 2rem; }
}
/* ─── PT HEADER ROW ─── */
.pt-header-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
  margin-bottom: 1rem;
  flex-wrap: wrap;
}
.pt-header-left { flex: 1; min-width: 0; }

/* ─── COLOUR PICKER ─── */
.colour-picker-wrap {
  position: relative;
  flex-shrink: 0;
}
.colour-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 8px;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  font-size: 0.68rem;
  letter-spacing: 0.06em;
  padding: 5px 10px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  min-height: 34px;
}
.colour-btn:hover {
  background: rgba(255,255,255,0.12);
  border-color: var(--gold);
}
.colour-btn svg path { stroke: currentColor; stroke-width: 1.5; fill: none; }

/* The dropdown panel */
.colour-panel {
  display: none;
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  z-index: 1000;
  background: #0f1e36;
  border: 1px solid rgba(212,168,67,0.3);
  border-radius: 10px;
  padding: 10px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  width: 210px;
  animation: fadeIn 0.12s ease;
}
.colour-panel.open { display: block; }
@keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }

.colour-panel-section { margin-bottom: 4px; }
.colour-panel-label {
  font-family: 'DM Mono', monospace;
  font-size: 0.58rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(212,168,67,0.7);
  margin-bottom: 6px;
}
.colour-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 4px;
}
.colour-cell {
  width: 100%;
  aspect-ratio: 1;
  border-radius: 4px;
  border: 2px solid transparent;
  cursor: pointer;
  transition: transform 0.12s, border-color 0.12s;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  min-height: 28px;
}
.colour-cell:hover { transform: scale(1.18); border-color: rgba(255,255,255,0.5); }
.colour-cell.active { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }

/* Light cells need a border to show against white bg */
.colour-cell[data-mode="light"] { outline: 1px solid rgba(0,0,0,0.12); outline-offset: -1px; }

.colour-panel-divider {
  height: 1px;
  background: rgba(255,255,255,0.08);
  margin: 8px 0;
}
.colour-custom-row { }
.colour-custom-input {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 4px;
}
.colour-custom-input input[type="color"] {
  width: 32px;
  height: 28px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 4px;
  background: none;
  cursor: pointer;
  padding: 2px;
}
.colour-custom-hex {
  font-family: 'DM Mono', monospace;
  font-size: 0.7rem;
  color: var(--text-dim);
  letter-spacing: 0.05em;
}

/* scrollbar */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:var(--navy); }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
</style>
</head>

// ── Electronic configuration functions ──────────────────────────────

// GCSE: 2,8,8,18,18,32,... simplified as 2,8,8,2 rule for first 20
// We implement the real 2,8,18,32... pattern for higher elements
function gcseConfig(Z) {
  const shells = [2,8,8,18,18,32,32];
  const caps = [2,8,18,18,32,32,32];
  let rem = Z;
  const result = [];
  // GCSE spec: period 1=2, period 2=8, period 3=8, period 4=18...
  const gcseCaps = [2,8,8,18,18,32,32];
  for(let i=0;i<gcseCaps.length && rem>0;i++){
    const n = Math.min(rem, gcseCaps[i]);
    result.push(n);
    rem -= n;
  }
  return result.join(',');
}

// A-Level: full Aufbau subshell notation
const AUFBAU_ORDER = [
  [1,0],[2,0],[2,1],[3,0],[3,1],[4,0],[3,2],[4,1],[5,0],
  [4,2],[5,1],[6,0],[4,3],[5,2],[6,1],[7,0],[5,3],[6,2],[7,1]
];
const SUBSHELL_LABELS = ['s','p','d','f'];
const SUBSHELL_MAX = [2,6,10,14];
// Exceptions for A-level (Cr, Cu, Mo, Ag, Au, etc.)
const EXCEPTIONS = {
  24:'[Ar] 3d⁵ 4s¹', 29:'[Ar] 3d¹⁰ 4s¹',
  42:'[Kr] 4d⁵ 5s¹', 47:'[Kr] 4d¹⁰ 5s¹',
  79:'[Xe] 4f¹⁴ 5d¹⁰ 6s¹',
};
const NOBLE_CONFIGS = {2:'[He]',10:'[Ne]',18:'[Ar]',36:'[Kr]',54:'[Xe]',86:'[Rn]'};

function aLevelConfig(Z) {
  if(EXCEPTIONS[Z]) return EXCEPTIONS[Z];
  let rem = Z;
  const filled = [];
  // find noble gas core
  let core = ''; let coreZ = 0;
  [2,10,18,36,54,86].forEach(nz => { if(Z > nz){ core = NOBLE_CONFIGS[nz]; coreZ = nz; }});
  rem = Z - coreZ;
  const parts = [];
  for(const [n,l] of AUFBAU_ORDER){
    if(rem <= 0) break;
    const max = SUBSHELL_MAX[l];
    const fill = Math.min(rem, max);
    if(fill > 0){
      parts.push(`${n}${SUBSHELL_LABELS[l]}${toSuperscript(fill)}`);
      rem -= fill;
    }
  }
  return (core ? core + ' ' : '') + parts.join(' ');
}

function toSuperscript(n){
  const sup = '⁰¹²³⁴⁵⁶⁷⁸⁹¹⁰';
  if(n===10) return '¹⁰'; if(n===14) return '¹⁴';
  return '⁰¹²³⁴⁵⁶⁷⁸⁹'[n] || n;
}

// Shell radii and electrons for canvas animation
function getShellData(Z, mode) {
  if(mode === 'gcse'){
    const cfg = gcseConfig(Z).split(',').map(Number);
    return cfg;
  } else {
    // Convert a-level to shell counts for animation
    const shells = [0,0,0,0,0,0,0];
    let rem = Z;
    for(const [n,l] of AUFBAU_ORDER){
      if(rem<=0) break;
      const max = SUBSHELL_MAX[l];
      const fill = Math.min(rem, max);
      shells[n-1] += fill;
      rem -= fill;
    }
    return shells.filter(s => s > 0);
  }
}

function buildTable(){
  const grid = document.getElementById('ptGrid');
  grid.innerHTML = '';

  // Grid positions: [atomicNum, col, row]
  // row 1 = period 1, col 1-18
  // We'll build a position map
  const positions = {}; // atomicNum -> {col, row}

  // Rows 1-7 (periods), lanthanides row 9, actinides row 10
  ELEMENTS.forEach(e => {
    const [Z,sym,name,grp,per,cat] = e;
    if(grp === null) return; // lanthanides/actinides handled separately
    positions[Z] = { col: grp, row: per };
  });

  // Lanthanides: La-Lu → row 9, col 3-17
  const lants = ELEMENTS.filter(e => e[5]==='lanthanide');
  lants.forEach((e,i) => { positions[e[0]] = { col: i+4, row: 9 }; });
  // Actinides: Ac-Lr → row 10, col 3-17
  const acts = ELEMENTS.filter(e => e[5]==='actinide');
  acts.forEach((e,i) => { positions[e[0]] = { col: i+4, row: 10 }; });

  // Build 10-row grid (rows 1-7, spacer, 9-10)
  const totalRows = 10;
  const totalCols = 18;
  // flat grid array [row][col]
  const cells = Array.from({length: totalRows+1}, () => Array(totalCols+1).fill(null));
  ELEMENTS.forEach(e => {
    const p = positions[e[0]];
    if(p) cells[p.row][p.col] = e;
  });

  // Build DOM
  for(let row=1; row<=totalRows; row++){
    if(row === 8){
      // spacer row + lanthanide/actinide labels
      const spacer = document.createElement('div');
      spacer.className = 'pt-gap-row';
      grid.appendChild(spacer);
      continue;
    }
    for(let col=1; col<=totalCols; col++){
      const e = cells[row][col];
      if(!e){
        const sp = document.createElement('div');
        sp.className = 'pt-spacer';
        grid.appendChild(sp);
      } else {
        const btn = document.createElement('button');
        btn.className = `elem-btn ${CAT_CLASS[e[5]]}`;
        btn.innerHTML = `<span class="an">${e[0]}</span><span class="sym">${e[1]}</span><span class="nm">${e[2]}</span>`;
        btn.title = `${e[2]} (${e[0]})`;
        btn.onclick = () => openModal(e[0]);
        grid.appendChild(btn);
      }
    }
    // newline handled by grid
  }

  // Legend
  const legend = document.getElementById('ptLegend');
  legend.innerHTML = '';
  Object.entries(CAT_LABEL).forEach(([k,v]) => {
    const item = document.createElement('div');
    item.className = 'leg-item';
    item.innerHTML = `<span class="leg-dot" style="background:${CAT_COLOR[k]}"></span>${v}`;
    legend.appendChild(item);
  });

  
  // Populate element select dropdowns (works on iOS, unlike datalist)
  ['bondEl1','bondEl2'].forEach(id => {
    const sel = document.getElementById(id);
    if(!sel) return;
    // Clear and repopulate
    sel.innerHTML = '<option value="">— Select element —</option>';
    // Group by category for readability
    const cats = ['nonmetal','halogen','noble','alkali','alkaline','transition','post','metalloid','lanthanide','actinide'];
    const catLabels = {'nonmetal':'Non-metals','halogen':'Halogens','noble':'Noble Gases',
      'alkali':'Alkali Metals','alkaline':'Alkaline Earth','transition':'Transition Metals',
      'post':'Post-Transition','metalloid':'Metalloids','lanthanide':'Lanthanides','actinide':'Actinides'};
    cats.forEach(cat => {
      const els = ELEMENTS.filter(e => e[5]===cat);
      if(!els.length) return;
      const og = document.createElement('optgroup');
      og.label = catLabels[cat];
      els.forEach(e => {
        const opt = document.createElement('option');
        opt.value = e[1];
        opt.textContent = e[1] + ' — ' + e[2];
        og.appendChild(opt);
      });
      sel.appendChild(og);
    });
  });
}

const SHELL_COLS = ['#00d4ff','#a78bfa','#00ff9d','#ffb347','#ff6b9d','#4ecdc4','#ffe66d'];

function startAtomAnimation(Z, sym, cat){
  const canvas = document.getElementById('atomCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  const shells = getShellData(Z, currentMode);

  // Nucleus radius based on Z
  const nucR = Math.min(8 + Math.sqrt(Z) * 1.8, 32);

  // Shell radii - fit within canvas
  const maxShells = shells.length;
  const maxR = Math.min(cx, cy) - 20;
  const shellRadii = shells.map((_,i) => 30 + (i/(Math.max(maxShells-1,1))) * (maxR - 30));
  if(maxShells === 1) shellRadii[0] = 55;

  // Build electrons
  const electrons = [];
  shells.forEach((count, si) => {
    for(let i=0; i<count; i++){
      electrons.push({
        shell: si,
        angle: (2*Math.PI/count)*i,
        speed: 0.9 / (si+1),
        r: shellRadii[si],
        trail: [],
      });
    }
  });

  // Nucleons
  const nProtons = Z, nNeutrons = Z + (Z <= 1 ? 0 : Math.round(Z*0.55));
  const nucleons = [];
  for(let i=0; i<Math.min(nProtons+nNeutrons, 30); i++){
    const ang = Math.random()*Math.PI*2;
    const dist = Math.random()*(nucR-4);
    nucleons.push({
      x: Math.cos(ang)*dist, y: Math.sin(ang)*dist,
      r: 3 + Math.random()*1.5,
      type: i < nProtons ? 'p' : 'n',
      wa: Math.random()*Math.PI*2,
      ws: 0.5+Math.random()*0.8
    });
  }

  let t = 0, last = null;
  function frame(ts){
    if(!last) last = ts;
    const dt = Math.min((ts-last)/1000, 0.05); last=ts; t+=dt;
    ctx.clearRect(0,0,W,H);

    // orbits
    shells.forEach((_,si) => {
      ctx.beginPath();
      ctx.arc(cx, cy, shellRadii[si], 0, Math.PI*2);
      ctx.strokeStyle = SHELL_COLS[si]+'30';
      ctx.lineWidth = 1;
      ctx.stroke();
      // shell label
      ctx.font = `500 8px 'DM Mono', monospace`;
      ctx.fillStyle = SHELL_COLS[si]+'80';
      ctx.textAlign = 'center';
      ctx.fillText(`n=${si+1}`, cx, cy - shellRadii[si] - 6);
    });

    // electron trails + dots
    electrons.forEach(e => {
      e.angle += e.speed * dt;
      const ex = cx + Math.cos(e.angle)*e.r;
      const ey = cy + Math.sin(e.angle)*e.r;
      e.trail.unshift({x:ex,y:ey});
      if(e.trail.length > 14) e.trail.pop();
      e.trail.forEach((pt,i) => {
        const a = (1 - i/e.trail.length)*0.4;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, 2.5*(1-i/e.trail.length), 0, Math.PI*2);
        const col = SHELL_COLS[e.shell];
        ctx.fillStyle = col.replace('#','') ? col + Math.round(a*255).toString(16).padStart(2,'0') : col;
        ctx.fill();
      });
      // glow
      const g = ctx.createRadialGradient(ex,ey,0,ex,ey,12);
      g.addColorStop(0, SHELL_COLS[e.shell]+'88');
      g.addColorStop(1,'transparent');
      ctx.beginPath(); ctx.arc(ex,ey,12,0,Math.PI*2);
      ctx.fillStyle=g; ctx.fill();
      // dot
      ctx.beginPath(); ctx.arc(ex,ey,4,0,Math.PI*2);
      ctx.fillStyle=SHELL_COLS[e.shell]; ctx.fill();
      ctx.beginPath(); ctx.arc(ex-1,ey-1,1.5,0,Math.PI*2);
      ctx.fillStyle='rgba(255,255,255,0.8)'; ctx.fill();
    });

    // nucleus glow
    const p2 = 1+0.07*Math.sin(t*2.5);
    const ng = ctx.createRadialGradient(cx,cy,0,cx,cy,nucR*2.5*p2);
    const nucCol = cat==='alkali'?'255,77,77': cat==='noble'?'41,128,185':
                   cat==='halogen'?'211,84,0': cat==='nonmetal'?'142,68,173':
                   cat==='transition'?'52,152,219':'255,107,53';
    ng.addColorStop(0,`rgba(${nucCol},0.5)`);
    ng.addColorStop(1,'transparent');
    ctx.beginPath(); ctx.arc(cx,cy,nucR*2.5*p2,0,Math.PI*2);
    ctx.fillStyle=ng; ctx.fill();

    // nucleons
    nucleons.forEach(n => {
      const wx = n.x + Math.sin(t*n.ws+n.wa)*1;
      const wy = n.y + Math.cos(t*n.ws+n.wa)*1;
      const nx=cx+wx, ny=cy+wy;
      const col = n.type==='p' ? '#ff6b35' : '#fbbf24';
      const light = n.type==='p' ? '#ffaa80' : '#fde68a';
      const gr = ctx.createRadialGradient(nx-n.r*0.3,ny-n.r*0.3,0,nx,ny,n.r);
      gr.addColorStop(0,light); gr.addColorStop(1,col);
      ctx.beginPath(); ctx.arc(nx,ny,n.r,0,Math.PI*2);
      ctx.fillStyle=gr; ctx.fill();
    });

    // symbol
    ctx.font = `bold ${Math.max(10, Math.min(16, 30-sym.length*2))}px 'Playfair Display', serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle='rgba(255,255,255,0.95)';
    ctx.fillText(sym, cx, cy);

    atomAnim = requestAnimationFrame(frame);
  }
  atomAnim = requestAnimationFrame(frame);
}

// ══════════════════════════════════════════════════════════════════════
// BONDING ENGINE — Scientifically accurate, GCSE & A-Level spec
// ══════════════════════════════════════════════════════════════════════

function onBondTypeChange(){}

let bondAnim = null;
let bondT    = 0;

/* ── Bond order calculator ────────────────────────────────────────────
   Uses outer-electron counts to determine the number of shared pairs
   needed so BOTH atoms achieve an octet (or duet for H/He).
   Works for homonuclear and heteronuclear diatomics.
   Special cases: H needs 2, He/noble gases need 8 (inert).
   Formula: bondOrder = (needed1 + needed2) / 2  when needs are equal
            For hetero: bondOrder = min(needed1, needed2) if one set
            covers the other — we use the Lewis algorithm.
*/
function calcBondOrder(outer1, outer2, Z1, Z2){
  // duet rule for H (Z=1)
  const target1 = (Z1===1||Z1===3) ? 2 : 8;
  const target2 = (Z2===1||Z2===3) ? 2 : 8;
  const need1 = Math.max(0, target1 - outer1);
  const need2 = Math.max(0, target2 - outer2);
  // Bond order = electrons each atom must share = min of both needs
  // (they share the same pairs)
  const order = Math.min(need1, need2);
  return Math.max(1, order); // at least 1 if we're asked to bond
}

/* ── Lone-pair calculator ──────────────────────────────────────────────
   After bonding, remaining outer electrons sit as lone pairs on each atom.
   lone_pairs_on_atom = (outer_electrons - bond_order) / 2  pairs
   (We store as individual electrons for dot-and-cross)
*/
function loneElectrons(outerEl, bondOrder){
  return Math.max(0, outerEl - bondOrder);
}

/* ── Bond description generator ─────────────────────────────────────── */
function showBondDescription(e1, e2, type){
  const desc = document.getElementById('bondDesc');
  desc.style.display = 'block';
  const shells1 = getShellData(e1[0], currentMode);
  const shells2 = getShellData(e2[0], currentMode);
  const outer1  = shells1[shells1.length-1];
  const outer2  = shells2[shells2.length-1];
  const need1   = Math.max(0, (e1[0]===1?2:8) - outer1);
  const need2   = Math.max(0, (e2[0]===1?2:8) - outer2);

  let text = '';

  if(type === 'ionic'){
    // Donor loses outer electrons, acceptor gains
    const lost  = outer1;  // donor loses all outer electrons
    const gained= need2;   // acceptor gains what it needs
    const cation= lost===1 ? '⁺' : lost===2 ? '²⁺' : '³⁺';
    const anion = gained===1 ? '⁻' : gained===2 ? '²⁻' : '³⁻';
    text = `
<strong>Ionic Bond: ${e1[2]} → ${e2[2]}</strong><br>
<strong>Step 1 — Electron loss:</strong> ${e1[2]} has <strong>${outer1}</strong> outer electron(s) in its highest energy shell.
Because it has fewer electrons than the nearest noble gas configuration, it is energetically favourable to <em>lose</em> these electrons entirely,
forming the cation <strong>${e1[1]}${cation}</strong> with a full outer shell.<br>
<strong>Step 2 — Electron gain:</strong> ${e2[2]} has <strong>${outer2}</strong> outer electrons and needs <strong>${need2}</strong> more to achieve a full outer shell (octet).
It gains these electrons, forming the anion <strong>${e2[1]}${anion}</strong>.<br>
<strong>Step 3 — Electrostatic attraction:</strong> The oppositely charged ions attract one another.
This <em>ionic bond</em> is non-directional and results in a giant ionic lattice.<br>
<strong>Electron accounting:</strong> ${e1[1]}: ${outer1}e⁻ lost → 0 outer electrons (noble gas config ✓) &nbsp;|&nbsp;
${e2[1]}: ${outer2} + ${gained} = ${outer2+gained} outer electrons (noble gas config ✓)`;

  } else if(type === 'covalent'){
    const order = calcBondOrder(outer1, outer2, e1[0], e2[0]);
    const lone1 = loneElectrons(outer1, order);
    const lone2 = loneElectrons(outer2, order);
    const bondName = order===1 ? 'single bond (σ)' : order===2 ? 'double bond (σ + π)' : 'triple bond (σ + 2π)';
    const formula  = order===1 ? '—' : order===2 ? '=' : '≡';
    const EN1 = e1[8] ?? '?', EN2 = e2[8] ?? '?';
    const ENdiff = (EN1!=='?' && EN2!=='?') ? Math.abs(EN1-EN2).toFixed(2) : '?';
    const polarity = ENdiff==='?' ? 'unknown' : ENdiff<0.4 ? 'non-polar covalent' : ENdiff<1.7 ? 'polar covalent' : 'ionic character';

    text = `
<strong>Covalent Bond: ${e1[2]} ${formula} ${e2[2]}</strong><br>
<strong>Bond order = ${order} (${bondName})</strong><br>
<strong>Why ${order} bond(s)?</strong><br>
${e1[2]} has <strong>${outer1}</strong> outer electrons → needs <strong>${need1}</strong> more to complete its octet.<br>
${e2[2]} has <strong>${outer2}</strong> outer electrons → needs <strong>${need2}</strong> more to complete its octet.<br>
Both needs are satisfied by sharing <strong>${order} pair(s)</strong> of electrons — each shared pair counts toward both atoms' octets simultaneously.<br>
<strong>Electron accounting after bonding:</strong><br>
${e1[1]}: ${outer1} own + ${order} shared = <strong>${outer1+order} electrons "available"</strong> → octet ${outer1+order>=8||e1[0]===1?'✓':'⚠'} &nbsp;|&nbsp; ${lone1} lone electron(s) remaining<br>
${e2[1]}: ${outer2} own + ${order} shared = <strong>${outer2+order} electrons "available"</strong> → octet ${outer2+order>=8||e2[0]===1?'✓':'⚠'} &nbsp;|&nbsp; ${lone2} lone electron(s) remaining<br>
<strong>Polarity:</strong> χ(${e1[1]})=${EN1}, χ(${e2[1]})=${EN2} → ΔEN=${ENdiff} → <em>${polarity}</em>`;

  } else {
    const outer1str = outer1;
    text = `
<strong>Metallic Bond: ${e1[2]}${e1[1]!==e2[1]?' / '+e2[2]:''}</strong><br>
<strong>Step 1 — Delocalisation:</strong> Each ${e1[2]} atom releases its <strong>${outer1}</strong> outer electron(s) into a shared 'sea' of delocalised electrons.
The remaining ion (${e1[1]}${outer1===1?'⁺':outer1===2?'²⁺':'³⁺'}) has a stable, full outer shell.<br>
<strong>Step 2 — Electrostatic attraction:</strong> The positive metal cations are held in a regular lattice by their attraction to the surrounding sea of delocalised electrons.
This bond is non-directional, which explains metals' <em>malleability</em> and <em>ductility</em>.<br>
<strong>Properties explained:</strong> Delocalised electrons carry charge → high electrical conductivity.
Electrons also carry kinetic energy → high thermal conductivity.
Layers of cations can slide over each other without breaking bonds → malleable.`;
  }
  desc.innerHTML = text;
}

/* ══════════════════════════════════════════════════════════════════════
   CHEMICAL INTELLIGENCE ENGINE
   Validates whether a given bond combination is chemically real.
   Returns: { valid: bool, errorTitle, explanation, suggestions[] }
   ══════════════════════════════════════════════════════════════════════ */

// Element categories for chemical logic
function isMetal(e){
  return ['alkali','alkaline','transition','post','lanthanide','actinide'].includes(e[5]);
}
function isNonmetal(e){ return ['nonmetal','halogen'].includes(e[5]); }
function isNobleGas(e){ return e[5]==='noble'; }
function isMetalloid(e){ return e[5]==='metalloid'; }
function isHydrogen(e){ return e[0]===1; }

// Known good covalent pairs (for suggestions)
const GOOD_COVALENT_EXAMPLES = [
  'H + H (H₂)', 'H + Cl (HCl)', 'H + O → H₂O', 'O + O (O₂, double bond)',
  'N + N (N₂, triple bond)', 'C + O (CO₂)', 'H + N → NH₃', 'H + F (HF)',
  'Cl + Cl (Cl₂)', 'C + H → CH₄'
];
const GOOD_IONIC_EXAMPLES = [
  'Na + Cl (NaCl — table salt)', 'K + Br (KBr)', 'Ca + O (CaO)',
  'Mg + Cl (MgCl₂)', 'Li + F (LiF)', 'Na + F (NaF)', 'K + I (KI)'
];
const GOOD_METALLIC_EXAMPLES = [
  'Na + Na', 'Fe + Fe', 'Cu + Cu', 'Al + Al', 'Na + K (alloy)', 'Cu + Zn (brass alloy)'
];

function validateBond(e1, e2, bondType){
  const n1=e1[2], n2=e2[2], s1=e1[1], s2=e2[1];
  const shells1=getShellData(e1[0],currentMode);
  const shells2=getShellData(e2[0],currentMode);
  const outer1=shells1[shells1.length-1];
  const outer2=shells2[shells2.length-1];
  const Z1=e1[0], Z2=e2[0];

  // ── NOBLE GAS rules ──────────────────────────────────────────────
  if(isNobleGas(e1)||isNobleGas(e2)){
    const nobleEl = isNobleGas(e1)?e1:e2;
    const otherEl = isNobleGas(e1)?e2:e1;
    return { valid:false,
      errorTitle: `${nobleEl[2]} does not form bonds`,
      explanation: `
<strong>Why this doesn't work:</strong> ${nobleEl[2]} is a <strong>noble gas</strong> (Group 18). It has a completely full outer shell — <strong>${outer1 || outer2} electrons</strong> — which is the maximum stable configuration (the octet). There is <strong>no energetic driving force</strong> for it to share, gain, or lose electrons.<br><br>
Noble gases have <strong>exceptionally high ionisation energies</strong> and <strong>zero electron affinity</strong>, meaning it costs enormous energy to remove electrons and they gain nothing by accepting them. This is why Group 18 elements are called <em>inert</em> or <em>noble</em> gases — they are chemically unreactive under normal conditions.<br><br>
<strong>Did you know?</strong> Under extreme laboratory conditions, a few heavy noble gases (Xe, Kr) can be forced to bond with very electronegative elements like fluorine, forming compounds like XeF₂ — but this is A-level+ chemistry and not relevant at GCSE.`,
      suggestions: bondType==='covalent' ? GOOD_COVALENT_EXAMPLES.slice(0,4) : GOOD_IONIC_EXAMPLES.slice(0,4)
    };
  }

  // ── COVALENT bond rules ──────────────────────────────────────────
  if(bondType==='covalent'){

    // Two metals trying to covalent bond
    if(isMetal(e1) && isMetal(e2)){
      const suggestion = (e1[1]===e2[1]) ? 'metallic' : 'metallic (alloy)';
      return { valid:false,
        errorTitle: `${n1} and ${n2} do not form covalent bonds`,
        explanation: `
<strong>Why this doesn't work:</strong> Both ${n1} and ${n2} are <strong>metals</strong>. Covalent bonding requires atoms to <em>share</em> electrons by overlapping half-filled atomic orbitals. Metals have very <strong>low ionisation energies</strong> — they hold their outer electrons very loosely, making it energetically unfavourable to keep electrons in a localised shared bond.<br><br>
Instead, metal atoms <strong>release their outer electrons entirely</strong> into a delocalised sea, forming a <strong>metallic bond</strong>. This is why metals conduct electricity (free electrons) and are malleable (non-directional bonds).<br><br>
<strong>The correct bond type here is: Metallic</strong><br>
Try changing the bond type to <em>Metallic</em> to see how ${n1} atoms actually bond together.`,
        suggestions: GOOD_METALLIC_EXAMPLES.slice(0,4),
        suggestSwitch: 'metallic'
      };
    }

    // Single metal trying to covalent bond with nonmetal (should be ionic)
    if(isMetal(e1) && (isNonmetal(e2)||isHydrogen(e2))){
      // Exception: H-metal can sometimes be covalent (metal hydrides at A-level)
      // But at GCSE, metal+nonmetal = ionic
      return { valid:false,
        errorTitle: `${n1} + ${n2} forms an ionic bond, not covalent`,
        explanation: `
<strong>Why this doesn't work as covalent:</strong> ${n1} is a <strong>metal</strong> with only <strong>${outer1}</strong> outer electron(s) that it holds loosely (low ionisation energy). ${n2} is a <strong>non-metal</strong> that strongly attracts electrons (high electronegativity = ${e2[8]??'—'}).<br><br>
The difference in electron-attracting power (electronegativity) is too large for genuine <em>sharing</em> — ${n1} completely <strong>transfers</strong> its outer electron(s) to ${n2} rather than sharing them. This produces oppositely charged ions held by electrostatic attraction: an <strong>ionic bond</strong>.<br><br>
<strong>Rule of thumb:</strong> ΔEN > 1.7 → ionic bond &nbsp;|&nbsp; ΔEN 0.4–1.7 → polar covalent &nbsp;|&nbsp; ΔEN < 0.4 → non-polar covalent<br><br>
<strong>The correct bond type here is: Ionic</strong><br>
Try changing the bond type to <em>Ionic</em> to see ${n1}${e1[3]===1?'⁺':e1[3]===2?'²⁺':'³⁺'} and ${n2}⁻ forming correctly.`,
        suggestions: GOOD_IONIC_EXAMPLES.slice(0,4),
        suggestSwitch: 'ionic'
      };
    }

    // Nonmetal + metal (reversed)
    if(isMetal(e2) && (isNonmetal(e1)||isHydrogen(e1))){
      return { valid:false,
        errorTitle: `${n2} + ${n1} forms an ionic bond, not covalent`,
        explanation: `
<strong>Why this doesn't work as covalent:</strong> ${n2} is a <strong>metal</strong> — it will <strong>donate</strong> its outer electrons to ${n1} (a non-metal), not share them. The large electronegativity difference means complete electron transfer occurs, producing <strong>ionic bonding</strong>.<br><br>
<strong>The correct bond type here is: Ionic</strong>`,
        suggestions: GOOD_IONIC_EXAMPLES.slice(0,4),
        suggestSwitch: 'ionic'
      };
    }

    // Bond order > 3 is not stable for simple molecules (except CO, edge cases)
    const order = calcBondOrder(outer1, outer2, Z1, Z2);
    if(order > 3){
      return { valid:false,
        errorTitle: `${n1}–${n2} covalent bond would require bond order ${order} — not stable`,
        explanation: `
<strong>Why this doesn't work:</strong> ${n1} has <strong>${outer1}</strong> outer electrons and needs <strong>${8-outer1}</strong> more for an octet. ${n2} also has <strong>${outer2}</strong> outer electrons and needs <strong>${8-outer2}</strong> more. Satisfying both would require sharing <strong>${order} pairs</strong> of electrons.<br><br>
In practice, simple covalent bonds are limited to <strong>bond order 3 (triple bond)</strong> — e.g. N≡N. Higher bond orders are only seen in exotic transition metal chemistry, not simple molecular bonding.<br><br>
This combination doesn't form a stable simple covalent molecule. Consider whether an <strong>ionic bond</strong> might be more appropriate, or choose elements that need fewer electrons to complete their octets.`,
        suggestions: GOOD_COVALENT_EXAMPLES.slice(0,5)
      };
    }

    // Full outer shell + nonmetal (already 8 electrons)
    if(outer1===8 || outer2===8){
      const full = outer1===8 ? e1 : e2;
      return { valid:false,
        errorTitle: `${full[2]} already has a full outer shell`,
        explanation: `
<strong>Why this doesn't work:</strong> ${full[2]} already has <strong>8 outer electrons</strong> — a complete octet. It has <strong>no unfilled orbitals</strong> to share electrons into, and no need to gain more electrons.<br><br>
Covalent bonding requires each atom to have at least one <em>unpaired electron</em> available for sharing. With a full outer shell, ${full[2]} simply has nothing to contribute and nothing to gain from bonding.`,
        suggestions: GOOD_COVALENT_EXAMPLES.slice(0,4)
      };
    }
  }

  // ── IONIC bond rules ─────────────────────────────────────────────
  if(bondType==='ionic'){

    // Two nonmetals trying to form ionic bond
    if((isNonmetal(e1)||isHydrogen(e1)) && (isNonmetal(e2)||isHydrogen(e2))){
      return { valid:false,
        errorTitle: `${n1} and ${n2} do not form ionic bonds`,
        explanation: `
<strong>Why this doesn't work:</strong> Ionic bonds require one atom to <strong>completely lose</strong> electrons (forming a cation) and another to <strong>completely gain</strong> them (forming an anion). This works when one atom has a very low ionisation energy (metals) and the other has a high electron affinity (non-metals).<br><br>
Both ${n1} and ${n2} are <strong>non-metals</strong> with <strong>high ionisation energies</strong> — neither will give up its electrons willingly. Instead, both elements prefer to <em>share</em> electrons, forming a <strong>covalent bond</strong>.<br><br>
<strong>The correct bond type here is: Covalent</strong><br>
Try changing the bond type to <em>Covalent</em>.`,
        suggestions: GOOD_COVALENT_EXAMPLES.slice(0,4),
        suggestSwitch: 'covalent'
      };
    }

    // Two metals trying to form ionic bond
    if(isMetal(e1) && isMetal(e2)){
      return { valid:false,
        errorTitle: `${n1} and ${n2} do not form ionic bonds with each other`,
        explanation: `
<strong>Why this doesn't work:</strong> Ionic bonding requires a significant difference in ionisation energy — a metal that readily <em>loses</em> electrons and a non-metal that readily <em>gains</em> them. Both ${n1} and ${n2} are metals, so both would want to <em>lose</em> electrons — but neither wants to <em>gain</em> them.<br><br>
When two metals bond together, they form <strong>metallic bonds</strong> or <strong>alloys</strong>, sharing electrons delocalised across the whole structure.<br><br>
<strong>The correct bond type here is: Metallic</strong>`,
        suggestions: GOOD_METALLIC_EXAMPLES.slice(0,4),
        suggestSwitch: 'metallic'
      };
    }

    // Same element ionic (e.g. Na + Na ionic) — nonsense
    if(e1[0]===e2[0]){
      return { valid:false,
        errorTitle: `${n1} cannot form an ionic bond with itself`,
        explanation: `
<strong>Why this doesn't work:</strong> Ionic bonds form between atoms with <strong>very different electronegativities</strong>. ${n1} and ${n2} are the same element — they have <em>identical</em> electronegativities (χ = ${e1[8]??'—'}).<br><br>
Neither atom has any more "pull" on electrons than the other, so complete electron transfer is impossible. Same-element pairs either form <strong>covalent bonds</strong> (if non-metals) or <strong>metallic bonds</strong> (if metals).`,
        suggestions: isMetal(e1) ? GOOD_METALLIC_EXAMPLES.slice(0,3) : GOOD_COVALENT_EXAMPLES.slice(0,3),
        suggestSwitch: isMetal(e1) ? 'metallic' : 'covalent'
      };
    }
  }

  // ── METALLIC bond rules ──────────────────────────────────────────
  if(bondType==='metallic'){
    if(isNonmetal(e1) || isNonmetal(e2) || isNobleGas(e1) || isNobleGas(e2)){
      const nonM = (isNonmetal(e1)||isNobleGas(e1)) ? e1 : e2;
      return { valid:false,
        errorTitle: `${nonM[2]} cannot participate in metallic bonding`,
        explanation: `
<strong>Why this doesn't work:</strong> Metallic bonding requires atoms that can <strong>freely release outer electrons</strong> into a delocalised sea. This only works for <strong>metals</strong>, which have low ionisation energies.<br><br>
${nonM[2]} is a <strong>${nonM[5]}</strong> — it has a <strong>high ionisation energy</strong> and holds its electrons tightly. It will not release electrons into a sea; instead it tends to gain or share electrons.<br><br>
<strong>Try instead:</strong> Use two metal elements for metallic bonding, or use ${nonM[2]} in a covalent bond with another non-metal.`,
        suggestions: GOOD_METALLIC_EXAMPLES.slice(0,4)
      };
    }
  }

  // All checks passed — bond is chemically valid
  return { valid: true };
}

/* ── Error display renderer ──────────────────────────────────────────
   Shows a rich teaching panel instead of an animation when bond is invalid
*/
function showChemicalError(result, e1, e2, bondType, W, H, ctx){
  // Draw error state on canvas
  drawGridBg(ctx, W, H);

  // Red X symbol
  const cx=W/2, cy=H/2-30;
  ctx.beginPath(); ctx.arc(cx, cy, 48, 0, Math.PI*2);
  const eg=ctx.createRadialGradient(cx,cy,0,cx,cy,48);
  eg.addColorStop(0,'rgba(231,76,60,0.25)'); eg.addColorStop(1,'transparent');
  ctx.fillStyle=eg; ctx.fill();
  ctx.strokeStyle='rgba(231,76,60,0.6)'; ctx.lineWidth=2; ctx.stroke();

  // X mark
  ctx.strokeStyle='#e74c3c'; ctx.lineWidth=4;
  ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(cx-18,cy-18); ctx.lineTo(cx+18,cy+18); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx+18,cy-18); ctx.lineTo(cx-18,cy+18); ctx.stroke();

  // Element symbols flanking X
  drawAtomCircle(ctx, cx-110, cy, 38, e1[1], e1[5], e1[1], '#e74c3c');
  drawAtomCircle(ctx, cx+110, cy, 38, e2[1], e2[5], e2[1], '#e74c3c');

  // Bond type label (crossed out)
  ctx.font="500 10px 'DM Mono',monospace";
  ctx.fillStyle='rgba(231,76,60,0.7)'; ctx.textAlign='center';
  const bondLabel = bondType==='covalent'?'covalent bond':bondType==='ionic'?'ionic bond':'metallic bond';
  ctx.fillText(`✗  ${e1[1]} ${bondLabel} ${e2[1]}  ✗`, cx, cy+68);

  // Suggestion strip if switching bond type
  if(result.suggestSwitch){
    ctx.font="600 9px 'DM Sans',monospace";
    ctx.fillStyle='rgba(212,168,67,0.8)';
    ctx.fillText(`→ Try: ${result.suggestSwitch} bond instead`, cx, cy+84);
  }

  // Description panel
  const desc = document.getElementById('bondDesc');
  desc.style.display='block';
  const suggHTML = result.suggestions
    ? `<br><strong>Try these instead:</strong> ${result.suggestions.map(s=>`<em>${s}</em>`).join(' &nbsp;·&nbsp; ')}`
    : '';
  const switchBtn = result.suggestSwitch
    ? `<br><button onclick="switchBondType('${result.suggestSwitch}')" style="margin-top:0.6rem;background:rgba(212,168,67,0.15);border:1px solid #d4a843;color:#d4a843;font-family:'DM Mono',monospace;font-size:0.75rem;padding:0.4rem 1rem;border-radius:5px;cursor:pointer;">Switch to ${result.suggestSwitch} bond →</button>`
    : '';
  desc.innerHTML = `
<div style="display:flex;align-items:flex-start;gap:0.8rem;margin-bottom:0.6rem;">
  <span style="font-size:1.5rem;flex-shrink:0;">🚫</span>
  <strong style="color:#e74c3c;font-size:1rem;">${result.errorTitle}</strong>
</div>
${result.explanation}
${suggHTML}
${switchBtn}`;
}

function switchBondType(type){
  document.getElementById('bondType').value = type;
  animateBond();
}

/* ── Main bond dispatcher ─────────────────────────────────────────── */
function animateBond(){
  const sym1 = (document.getElementById('bondEl1').value||'').trim();
  const sym2 = (document.getElementById('bondEl2').value||'').trim();
  const bondType = document.getElementById('bondType').value;

  const e1 = ELEM_MAP[sym1.toUpperCase()] || ELEM_MAP[sym1.charAt(0).toUpperCase()+sym1.slice(1).toLowerCase()];
  const e2 = ELEM_MAP[sym2.toUpperCase()] || ELEM_MAP[sym2.charAt(0).toUpperCase()+sym2.slice(1).toLowerCase()];

  if(!e1||!e2){ 
    document.getElementById('bondDesc').style.display='block';
    document.getElementById('bondDesc').innerHTML=`<strong style="color:#e74c3c;">⚠ Unrecognised element symbol.</strong> Please enter a valid symbol from the periodic table (e.g. H, Na, O, Cl, Ca, Fe).`;
    return; 
  }

  const canvas = document.getElementById('bondCanvas');
  // Subtract 8px each side of container padding so nothing clips at canvas edge
  const W = Math.max((canvas.getBoundingClientRect().width||canvas.offsetWidth||600) - 16, 280);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = W * dpr;
  const H = 460;
  canvas.height = H * dpr;
  canvas.style.height = H+'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0); // reset any previous scale
  ctx.scale(dpr, dpr);

  if(bondAnim) cancelAnimationFrame(bondAnim);
  bondT = 0;

  // ── CHEMICAL VALIDATION ──────────────────────────────────────────
  const validation = validateBond(e1, e2, bondType);
  if(!validation.valid){
    showChemicalError(validation, e1, e2, bondType, W, H, ctx);
    return; // Don't animate — show the teaching panel instead
  }

  // Valid — proceed with animation
  showBondDescription(e1, e2, bondType);

  if(bondType==='ionic')         animateIonic(ctx, e1, e2, W, H);
  else if(bondType==='covalent') animateCovalent(ctx, e1, e2, W, H);
  else                           animateMetallic(ctx, e1, e2, W, H);
}

// ── IONIC ANIMATION ─────────────────────────────────────────────────
// Ground-up rewrite. Principles:
//  • GCSE dot-and-cross layout: electrons on 4 faces (N, S, E, W),
//    paired at each face, max 8 electrons displayed in standard positions
//  • All electron positions computed from atom CENTRE + dotR offset
//    so they move correctly with the atom during approach
//  • dotR sized so electrons sit just outside atom edge with clear gap
//  • Atoms drawn AFTER electrons (electrons behind atoms)
//  • Flying electron travels from donor's right-face dot to acceptor
//    landing position in a clean arc ABOVE the atoms
//  • All labels positioned below the shell ring, never overlapping electrons
//  • No electron is ever placed in the bond gap between atoms
// ─────────────────────────────────────────────────────────────────────
function animateIonic(ctx, e1, e2, W, H){
  const cx = W/2;
  const cy = H/2 - 35;  // shift scene up for more label space below

  // E-face electrons sit at x2 + dotR — must stay < W - 12px margin.
  // x2 = W/2 + r + dotR + 4, so: W/2 + r + 2*dotR + 4 < W - 12
  // With dotR = r+12: 3r < W/2 - 44  →  r < (W/2 - 44) / 3
  const rMax = Math.floor((W/2 - 44) / 3);
  const r    = Math.min(38, Math.max(22, rMax));
  const dotR = r + 12;
  const ES   = 5;

  let last = null;
  const shells1 = getShellData(e1[0], currentMode);
  const shells2 = getShellData(e2[0], currentMode);
  const outer1  = shells1[shells1.length-1];
  const outer2  = shells2[shells2.length-1];
  const need2   = Math.max(0, 8 - outer2);

  // ── GCSE Dot-and-Cross Electron Positions ───────────────────────
  //
  // DONOR (left atom, e.g. Na):
  //   Electrons on E-face (facing acceptor) so donation is visually clear.
  //   Face order: E, N, S, W (right→top→bottom→left)
  //
  // ACCEPTOR (right atom, e.g. Cl):
  //   Face order: N, S, E*, W — where W-face is LAST.
  //   This ensures the W-face (left side, facing donor) holds the "lonely"
  //   unpaired electron for Cl's 7th electron.
  //   The donated dot then completes the W-face pair: cross+dot side by side.
  //   *E-face electrons are clamped to within canvas bounds.
  //
  // PERP_OFFSET: how far apart the two electrons in a face-pair are spaced.

  const PERP_OFFSET = 6;  // tight pair spacing — electrons touch visually

  // pos(ang, perpAng, offset) helper
  function P(a, o) {
    return { ang: a, perpAng: a + Math.PI/2, offset: o };
  }

  // DONOR positions — E face first (faces acceptor), then N, S, W
  function donorPositions(n) {
    // E=0, N=π*1.5, S=π*0.5, W=π
    const faces = [0, Math.PI*1.5, Math.PI*0.5, Math.PI];
    const pos = [];
    for (let i = 0; i < Math.min(n, 8); i++) {
      const f = Math.floor(i/2);
      pos.push(P(faces[f], i%2===0 ? -PERP_OFFSET : PERP_OFFSET));
    }
    return pos;
  }

  // ACCEPTOR OWN positions — NO E-face (right side) to avoid off-canvas on mobile.
  // For Cl (7e): N×2, S×2, W×1(lone), NW-diag×1, SW-diag×1
  // The W lone electron is the "incomplete pair" — the gold dot will join it.
  // For other acceptors, same N/S/W/diagonals layout scales naturally.
  function acceptorPositions(n) {
    const N=Math.PI*1.5, S=Math.PI*0.5, W=Math.PI, E=0;
    // Perfect GCSE dot-and-cross symmetry:
    // N pair (12), S pair (6), E pair (3) — all 3 complete lone pairs on outer side
    // W lone (9, facing Na) + gold dot = the bond-side pair
    // This gives 4-fold symmetry matching every GCSE textbook layout.
    const slots = [
      P(N, -PERP_OFFSET), P(N, PERP_OFFSET),   // 0,1: N pair  (12 o'clock)
      P(S, -PERP_OFFSET), P(S, PERP_OFFSET),   // 2,3: S pair  (6 o'clock)
      { ang: W, perpAng: W - Math.PI/2, offset: -PERP_OFFSET }, // 4: W lone (upper)
      P(E, -PERP_OFFSET),                       // 5:   E upper (3 o'clock)
      P(E,  PERP_OFFSET),                       // 6:   E lower (3 o'clock)
      P(W,  PERP_OFFSET),                       // 7:   W second (completes W pair if 8e)
    ];
    return slots.slice(0, Math.min(n, 8));
  }

  // LANDING positions for transferred electrons.
  // Design: each gold dot completes an incomplete pair on the acceptor.
  // Acceptor's slot[4] = W-lone (offset -PERP) → gold dot 1 = W-face +PERP (completes pair)
  // Acceptor's slot[5] = E-lone (offset -PERP) → gold dot 2 = E-face +PERP (completes pair)
  // This works for any transfer of 1–4 electrons and always gives a balanced layout.
  // NaCl (1e): 1 gold dot on W-face completing the W-pair ✓
  // CaO  (2e): gold dot 1 on W, gold dot 2 on E — both pairs completed ✓
  function landPositions(n) {
    const pos = [];
    if (n >= 1) pos.push({ ang: Math.PI, perpAng: Math.PI - Math.PI/2, offset: PERP_OFFSET }); // W-face lower (gold arrives below cross)
    if (n >= 2) pos.push(P(0,             PERP_OFFSET));   // E-face: completes E-lone pair
    if (n >= 3) pos.push(P(Math.PI*1.5,   PERP_OFFSET));   // N-face: adds to N-pair
    if (n >= 4) pos.push(P(Math.PI*0.5,   PERP_OFFSET));   // S-face: adds to S-pair
    return pos;
  }

  // Compute (x,y) of electron on atom at (ax,ay) using dotR
  function electronXY(ax, ay, pos) {
    return {
      x: ax + Math.cos(pos.ang) * dotR + Math.cos(pos.perpAng) * pos.offset,
      y: ay + Math.sin(pos.ang) * dotR + Math.sin(pos.perpAng) * pos.offset
    };
  }

  const donorPos  = donorPositions(outer1);
  const acceptPos = acceptorPositions(outer2);
  const landPos   = landPositions(outer1);

  // Transfer only as many electrons as the acceptor needs (min of donor's outer and acceptor's gap)
  // e.g. Al(3) + O(needs 2) → only 2 electrons transfer; Al still forms Al³⁺ in real compound
  const transferCount = Math.min(outer1, need2);
  const transferEls = [];
  for (let i = 0; i < transferCount; i++)
    transferEls.push({ progress: 0, started: false, done: false, idx: i });

  // ── Local draw helpers ───────────────────────────────────────────
  function dot(x, y, col) {
    ctx.beginPath(); ctx.arc(x, y, ES, 0, Math.PI*2);
    ctx.fillStyle = col; ctx.fill();
    ctx.beginPath(); ctx.arc(x - 1.5, y - 1.5, ES * 0.38, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
  }
  function cross(x, y, col, lw) {
    const s = ES + 1;
    ctx.save();
    ctx.strokeStyle = col; ctx.lineWidth = lw || 2.2; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x-s, y-s); ctx.lineTo(x+s, y+s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+s, y-s); ctx.lineTo(x-s, y+s); ctx.stroke();
    ctx.restore();
  }

  function frame(ts) {
    if (!last) last = ts;
    const dt = Math.min((ts - last) / 1000, 0.05); last = ts; bondT += dt;
    ctx.clearRect(0, 0, W, H); drawGridBg(ctx, W, H);

    // ── Approach ──
    // Scene offset left (cx - W*0.06) so Cl's E-face electrons have more right margin
    const sceneX  = cx - W * 0.04;  // slight left offset for Cl E-face clearance
    const bondDist = r * 2 + dotR * 2 + 8;
    const startDist = Math.min(W * 0.55, bondDist + (W - bondDist) * 0.55);
    const t2   = Math.min(bondT / 1.6, 1);
    const ease = t2 < 0.5 ? 2*t2*t2 : 1 - Math.pow(-2*t2+2, 2)/2;
    const dist = startDist - (startDist - bondDist) * ease;
    const x1 = sceneX - dist/2;  // Na centre
    const x2 = sceneX + dist/2;  // Cl centre

    // ── Progress transfers ──
    transferEls.forEach((te, i) => {
      if (bondT > 1.6 + i * 0.35) te.started = true;
      if (te.started && !te.done) {
        te.progress = Math.min(1, te.progress + dt * 0.9);
        if (te.progress >= 1) te.done = true;
      }
    });
    const allDone = transferEls.every(te => te.done);

    // ════════════════════════════════════════════════════════════════
    // DRAW LAYER 1: electrostatic lines (behind everything)
    // ════════════════════════════════════════════════════════════════
    if (allDone) {
      const lx1 = x1 + r + 4, lx2 = x2 - r - 4;
      if (lx2 > lx1) { // only draw if there's a real gap
        for (let i = -1; i <= 1; i++) {
          const ly = cy + i * 12;
          const grd = ctx.createLinearGradient(lx1, ly, lx2, ly);
          grd.addColorStop(0,   'rgba(255,107,53,0.65)');
          grd.addColorStop(0.5, 'rgba(255,255,255,0.3)');
          grd.addColorStop(1,   'rgba(52,152,219,0.65)');
          ctx.beginPath(); ctx.moveTo(lx1, ly); ctx.lineTo(lx2, ly);
          ctx.strokeStyle = grd; ctx.lineWidth = i === 0 ? 2.5 : 1.2; ctx.stroke();
        }
      }
    }

    // ════════════════════════════════════════════════════════════════
    // DRAW LAYER 2: static electron markers (behind atoms)
    // ════════════════════════════════════════════════════════════════

    // 2a. Donor dots still on Na (only those not yet departed)
    transferEls.filter(te => !te.started).forEach(te => {
      const pos = donorPos[te.idx];
      const { x, y } = electronXY(x1, cy, pos);
      dot(x, y, '#ff9f43');
    });

    // 2b. Acceptor's own electrons (always present, cyan crosses)
    acceptPos.forEach(pos => {
      const { x, y } = electronXY(x2, cy, pos);
      cross(x, y, '#00cfff', 2.2);
    });

    // 2c. Transferred electrons that have landed — drawn as DOTS (gold)
    // Na electrons are always dots in GCSE dot-and-cross notation,
    // even after they transfer to Cl's shell.
    transferEls.filter(te => te.done).forEach(te => {
      const pos = landPos[te.idx];
      const { x, y } = electronXY(x2, cy, pos);
      dot(x, y, '#ffd166');   // gold dot — retains Na's dot identity
    });

    // ════════════════════════════════════════════════════════════════
    // DRAW LAYER 3: atom circles (over static electrons)
    // ════════════════════════════════════════════════════════════════
    const donorLabel    = allDone ? `${e1[1]}${outer1===1?'⁺':outer1===2?'²⁺':'³⁺'}` : e1[1];
    const acceptorLabel = allDone ? `${e2[1]}${need2===1?'⁻':need2===2?'²⁻':'³⁻'}`  : e2[1];
    drawAtomCircle(ctx, x1, cy, r, e1[1], e1[5], donorLabel,    '#ff6b35');
    drawAtomCircle(ctx, x2, cy, r, e2[1], e2[5], acceptorLabel, '#3498db');

    // ════════════════════════════════════════════════════════════════
    // DRAW LAYER 4: flying electron (on top of atoms)
    // ════════════════════════════════════════════════════════════════
    transferEls.forEach(te => {
      if (!te.started || te.done) return;
      const p = te.progress;
      const sp = donorPos[te.idx];
      const ep = landPos[te.idx];
      const sx = x1 + Math.cos(sp.ang)*dotR + Math.cos(sp.perpAng)*sp.offset;
      const sy = cy + Math.sin(sp.ang)*dotR + Math.sin(sp.perpAng)*sp.offset;
      const ex = x2 + Math.cos(ep.ang)*dotR + Math.cos(ep.perpAng)*ep.offset;
      const ey = cy + Math.sin(ep.ang)*dotR + Math.sin(ep.perpAng)*ep.offset;
      // Arc path — peak well above the atoms
      const tx = sx + (ex - sx) * p;
      const ty = sy + (ey - sy) * p - (r + dotR + 20) * Math.sin(p * Math.PI);
      // Glow
      const eg = ctx.createRadialGradient(tx, ty, 0, tx, ty, 14);
      eg.addColorStop(0, 'rgba(255,230,100,1)'); eg.addColorStop(1, 'transparent');
      ctx.beginPath(); ctx.arc(tx, ty, 14, 0, Math.PI*2); ctx.fillStyle = eg; ctx.fill();
      ctx.beginPath(); ctx.arc(tx, ty, 6,  0, Math.PI*2); ctx.fillStyle = '#ffe66d'; ctx.fill();
      ctx.save();
      ctx.font = "bold 7px 'DM Mono',monospace";
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = '#1a1a1a'; ctx.fillText('e⁻', tx, ty);
      ctx.restore();
    });

    // ════════════════════════════════════════════════════════════════
    // DRAW LAYER 5: labels (bottom of canvas, nothing overlaps)
    // ════════════════════════════════════════════════════════════════
    const labelY = cy + dotR + ES + 14;   // safely below the lowest electron

    // Element names
    ctx.save();
    ctx.font = "600 12px 'DM Sans',sans-serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText(e1[2], x1, labelY);
    ctx.fillText(e2[2], x2, labelY);
    ctx.restore();

    // Charge superscripts — tight against top of each atom circle
    if (allDone) {
      ctx.save();
      ctx.font = "bold 13px 'Playfair Display',serif";
      ctx.textBaseline = 'alphabetic';
      // Na+: right of top-right edge
      ctx.textAlign = 'left';
      ctx.fillStyle = '#ff9f43';
      ctx.fillText(outer1===1?'⁺':outer1===2?'²⁺':'³⁺', x1 + r * 0.6, cy - r * 0.6);
      // Cl-: right of top-right edge (inside N-face gap)
      ctx.fillStyle = '#7ecfff';
      ctx.fillText(need2===1?'⁻':need2===2?'²⁻':'³⁻',   x2 + r * 0.6, cy - r * 0.6);
      ctx.restore();
    }

    // Electrostatic label
    if (allDone) {
      ctx.save();
      ctx.font = "500 8px 'DM Mono',monospace";
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.fillText('electrostatic attraction', cx, labelY + 16);
      ctx.restore();
    }

    // Dot/cross key — two lines so nothing truncates on mobile
    if (allDone) {
      ctx.save();
      ctx.font = "500 7.5px 'DM Mono',monospace";
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillText('●  ' + e1[1] + ' electrons (dots)   ✕  ' + e2[1] + ' electrons (crosses)', cx, labelY + 28);
      ctx.fillStyle = 'rgba(255,209,102,0.5)';
      ctx.fillText('●  transferred electron shown in gold', cx, labelY + 40);
      ctx.restore();
    }

    // Electron accounting
    drawElectronLegend(ctx, W, H, e1, e2, outer1, outer2, 'ionic', 0, allDone);

    bondAnim = requestAnimationFrame(frame);
  }
  bondAnim = requestAnimationFrame(frame);
}

// ── COVALENT ANIMATION ──────────────────────────────────────────────
// Universal system: same sizing, 4-face GCSE dot-and-cross layout.
// Atom 1 electrons = dots (●), Atom 2 electrons = crosses (×).
// Shared pair shown as ●× at bond midpoint (one from each atom).
// Lone pairs on outer faces (away from bond), bond pairs between atoms.
// ─────────────────────────────────────────────────────────────────────
function animateCovalent(ctx, e1, e2, W, H){
  // ── Same universal sizing as ionic ──────────────────────────────
  const sceneX = W/2 - W*0.04;
  const cy     = H/2 - 35;
  const rMax   = Math.floor((W/2 - 44) / 3);
  const r      = Math.min(38, Math.max(22, rMax));
  const dotR   = r + 12;
  const ES     = 5;
  const PERP   = 6;

  let last = null;
  const shells1 = getShellData(e1[0], currentMode);
  const shells2 = getShellData(e2[0], currentMode);
  const outer1  = shells1[shells1.length-1];
  const outer2  = shells2[shells2.length-1];
  const order   = calcBondOrder(outer1, outer2, e1[0], e2[0]);

  // Lone electrons on each atom after bonding
  // Each shared bond uses 1 electron from each atom
  const lone1 = Math.max(0, outer1 - order);  // remaining on atom 1
  const lone2 = Math.max(0, outer2 - order);  // remaining on atom 2

  // ── Universal face position helper ──────────────────────────────
  // Same P() as ionic but scoped here
  function P(a, o) { return { ang: a, perpAng: a + Math.PI/2, offset: o }; }
  // W-face uses flipped perp (same as ionic fix)
  function PW(o) { return { ang: Math.PI, perpAng: Math.PI - Math.PI/2, offset: o }; }

  // Lone pair positions — 4-face layout, bond-facing face excluded
  // Atom 1 (left):  lone pairs on N, S, W faces (NOT E — that faces bond)
  // Atom 2 (right): lone pairs on N, S, E faces (NOT W — that faces bond)
  function lonePosLeft(n) {
    const N=Math.PI*1.5, S=Math.PI*0.5;
    const slots = [
      PW(-PERP), PW(PERP),                // W pair  (far left)
      P(N,-PERP), P(N,PERP),              // N pair  (top)
      P(S,-PERP), P(S,PERP),              // S pair  (bottom)
    ];
    return slots.slice(0, Math.min(n, 6));
  }
  function lonePosRight(n) {
    const N=Math.PI*1.5, S=Math.PI*0.5, E=0;
    const slots = [
      P(E,-PERP), P(E,PERP),              // E pair  (far right)
      P(N,-PERP), P(N,PERP),              // N pair  (top)
      P(S,-PERP), P(S,PERP),              // S pair  (bottom)
    ];
    return slots.slice(0, Math.min(n, 6));
  }

  function electronXY(ax, ay, pos) {
    return {
      x: ax + Math.cos(pos.ang)*dotR + Math.cos(pos.perpAng)*pos.offset,
      y: ay + Math.sin(pos.ang)*dotR + Math.sin(pos.perpAng)*pos.offset
    };
  }

  // ── Draw helpers (same as ionic) ────────────────────────────────
  function dot(x, y, col) {
    ctx.beginPath(); ctx.arc(x, y, ES, 0, Math.PI*2);
    ctx.fillStyle = col; ctx.fill();
    ctx.beginPath(); ctx.arc(x-1.5, y-1.5, ES*0.38, 0, Math.PI*2);
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fill();
  }
  function cross(x, y, col) {
    const s = ES+1;
    ctx.save();
    ctx.strokeStyle=col; ctx.lineWidth=2.2; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(x-s,y-s); ctx.lineTo(x+s,y+s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+s,y-s); ctx.lineTo(x-s,y+s); ctx.stroke();
    ctx.restore();
  }

  // Shared pair orbiting phases
  const sharedPhases = Array.from({length:order}, (_,i) => ({phase: i*(Math.PI*2/order), speed: 1.1}));

  function frame(ts) {
    if (!last) last = ts;
    const dt = Math.min((ts-last)/1000, 0.05); last=ts; bondT+=dt;
    ctx.clearRect(0,0,W,H); drawGridBg(ctx,W,H);

    // ── Approach ────────────────────────────────────────────────
    const bondDist  = r*2 + dotR*2 + 6 + (order-1)*8;
    const startDist = Math.min(W*0.55, bondDist + (W-bondDist)*0.55);
    const t2   = Math.min(bondT/1.5, 1);
    const ease = t2<0.5 ? 2*t2*t2 : 1-Math.pow(-2*t2+2,2)/2;
    const dist = startDist - (startDist-bondDist)*ease;
    const x1 = sceneX - dist/2;
    const x2 = sceneX + dist/2;
    const stable = bondT > 1.5;
    const midX = (x1+r + x2-r) / 2;

    // ── LAYER 1: lone pairs (behind atoms) ──────────────────────
    const lp1 = lonePosLeft(lone1);
    const lp2 = lonePosRight(lone2);
    lp1.forEach(pos => { const {x,y}=electronXY(x1,cy,pos); dot(x,y,'#00cfff'); });
    lp2.forEach(pos => { const {x,y}=electronXY(x2,cy,pos); cross(x,y,'#a78bfa'); });

    // ── LAYER 2: shared electron cloud glow ─────────────────────
    if (stable) {
      for (let p=0; p<order; p++) {
        const yOff = (p-(order-1)/2) * 14;
        const cg = ctx.createRadialGradient(midX,cy+yOff,0,midX,cy+yOff,24);
        cg.addColorStop(0,'rgba(255,230,100,0.22)');
        cg.addColorStop(1,'transparent');
        ctx.beginPath(); ctx.arc(midX,cy+yOff,24,0,Math.PI*2);
        ctx.fillStyle=cg; ctx.fill();
      }
    }

    // ── LAYER 3: atoms ──────────────────────────────────────────
    drawAtomCircle(ctx,x1,cy,r,e1[1],e1[5],e1[1],'#00cfff');
    drawAtomCircle(ctx,x2,cy,r,e2[1],e2[5],e2[1],'#a78bfa');

    // ── LAYER 4: shared pairs (animated ●× orbiting midpoint) ───
    if (stable) {
      sharedPhases.forEach((sp, pi) => {
        sp.phase += sp.speed * dt;
        const yOff = (pi-(order-1)/2) * 14;
        // dot from atom1 (cyan) and cross from atom2 (purple)
        // orbit midX on a small ellipse
        const dotAng   = sp.phase;
        const crossAng = sp.phase + Math.PI;
        const ox = 11, oy = 6;
        const dx = midX + Math.cos(dotAng)*ox,   dy = cy+yOff + Math.sin(dotAng)*oy;
        const cx2= midX + Math.cos(crossAng)*ox, cy2= cy+yOff + Math.sin(crossAng)*oy;
        dot(dx, dy, '#00cfff');
        cross(cx2, cy2, '#a78bfa');
      });

      // Bond label above midpoint
      const bLabel = order===1?'σ bond':order===2?'σ + π bond':'σ + 2π bond';
      ctx.save();
      ctx.font="bold 9px 'DM Mono',monospace";
      ctx.textAlign='center'; ctx.textBaseline='alphabetic';
      ctx.fillStyle='#f0c96a';
      ctx.fillText(bLabel, midX, cy - dotR - 10);
      ctx.restore();
    }

    // ── LAYER 5: labels ─────────────────────────────────────────
    const labelY = cy + dotR + ES + 14;
    ctx.save();
    ctx.font="600 12px 'DM Sans',sans-serif";
    ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.fillStyle='rgba(255,255,255,0.85)';
    ctx.fillText(e1[2], x1, labelY);
    ctx.fillText(e2[2], x2, labelY);
    ctx.restore();

    // Bond order info
    if (stable) {
      ctx.save();
      ctx.font="500 8px 'DM Mono',monospace";
      ctx.textAlign='center'; ctx.textBaseline='alphabetic';
      ctx.fillStyle='rgba(255,255,255,0.4)';
      ctx.fillText('Shared pairs: '+order+'   ●='+e1[1]+' electron   ×='+e2[1]+' electron', midX, labelY+16);
      ctx.fillStyle='rgba(255,255,255,0.28)';
      ctx.fillText(e1[1]+': '+outer1+' own + '+order+' shared = '+(outer1+order)+' (octet '+(outer1+order>=8||e1[0]===1?'✓':'·')+')', midX, labelY+28);
      ctx.fillText(e2[1]+': '+outer2+' own + '+order+' shared = '+(outer2+order)+' (octet '+(outer2+order>=8||e2[0]===1?'✓':'·')+')', midX, labelY+40);
      ctx.restore();
    }

    drawElectronLegend(ctx, W, H, e1, e2, outer1, outer2, 'covalent', order, stable);
    bondAnim = requestAnimationFrame(frame);
  }
  bondAnim = requestAnimationFrame(frame);
}

// ── METALLIC ANIMATION ──────────────────────────────────────────────
function animateMetallic(ctx, e1, e2, W, H){
  const cx=W/2 - W*0.0, cy=H/2 - 20;  // centred — lattice fills canvas
  let last=null;
  const shells1=getShellData(e1[0],currentMode);
  const outer1=shells1[shells1.length-1];
  const cation=outer1===1?'⁺':outer1===2?'²⁺':'³⁺';

  const ions=[];
  const rows=4, cols=6;
  const spacing=52;
  for(let r2=0;r2<rows;r2++) for(let c=0;c<cols;c++){
    ions.push({
      x:cx-(cols-1)*spacing/2+c*spacing,
      y:cy-60-(rows-1)*spacing/2+r2*spacing,
      wobble: Math.random()*Math.PI*2
    });
  }
  const freeEls=[];
  for(let i=0;i<18;i++){
    freeEls.push({
      x:cx-(cols-1)*spacing/2+Math.random()*((cols-1)*spacing),
      y:cy-60-(rows-1)*spacing/2+Math.random()*((rows-1)*spacing),
      vx:(Math.random()-0.5)*80, vy:(Math.random()-0.5)*80,
      trail:[]
    });
  }
  const bndX=cx-(cols-1)*spacing/2-30, bndY=cy-60-(rows-1)*spacing/2-25;
  const bndW=(cols-1)*spacing+60, bndH=(rows-1)*spacing+50;

  function frame(ts){
    if(!last) last=ts;
    const dt=Math.min((ts-last)/1000,0.05); last=ts; bondT+=dt;
    ctx.clearRect(0,0,W,H); drawGridBg(ctx,W,H);

    // lattice bg
    const seaG=ctx.createRadialGradient(cx,cy-60,0,cx,cy-60,bndW*0.7);
    seaG.addColorStop(0,'rgba(52,152,219,0.10)');
    seaG.addColorStop(1,'rgba(52,152,219,0.02)');
    // roundRect polyfill for iOS Safari < 15.4
    ctx.beginPath();
    const rr=10,rx=bndX,ry=bndY,rw=bndW,rh=bndH;
    ctx.moveTo(rx+rr,ry); ctx.lineTo(rx+rw-rr,ry);
    ctx.arcTo(rx+rw,ry,rx+rw,ry+rr,rr);
    ctx.lineTo(rx+rw,ry+rh-rr); ctx.arcTo(rx+rw,ry+rh,rx+rw-rr,ry+rh,rr);
    ctx.lineTo(rx+rr,ry+rh); ctx.arcTo(rx,ry+rh,rx,ry+rh-rr,rr);
    ctx.lineTo(rx,ry+rr); ctx.arcTo(rx,ry,rx+rr,ry,rr); ctx.closePath();
    ctx.fillStyle=seaG; ctx.fill();
    ctx.strokeStyle='rgba(212,168,67,0.15)'; ctx.lineWidth=1; ctx.stroke();

    // electron trails
    freeEls.forEach(el=>{
      el.trail.unshift({x:el.x,y:el.y});
      if(el.trail.length>8) el.trail.pop();
      el.trail.forEach((pt,i)=>{
        ctx.globalAlpha=(1-i/el.trail.length)*0.3;
        ctx.beginPath(); ctx.arc(pt.x,pt.y,3,0,Math.PI*2);
        ctx.fillStyle='#ffe66d'; ctx.fill();
      });
      ctx.globalAlpha=1;
      el.x+=el.vx*dt; el.y+=el.vy*dt;
      if(el.x<bndX+6||el.x>bndX+bndW-6) el.vx*=-1;
      if(el.y<bndY+6||el.y>bndY+bndH-6) el.vy*=-1;
      const eg=ctx.createRadialGradient(el.x,el.y,0,el.x,el.y,8);
      eg.addColorStop(0,'rgba(255,230,100,0.85)');
      eg.addColorStop(1,'transparent');
      ctx.beginPath(); ctx.arc(el.x,el.y,8,0,Math.PI*2); ctx.fillStyle=eg; ctx.fill();
      ctx.beginPath(); ctx.arc(el.x,el.y,3,0,Math.PI*2); ctx.fillStyle='#ffe66d'; ctx.fill();
      ctx.font="bold 6px 'DM Mono',monospace";
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='#222'; ctx.fillText('e⁻',el.x,el.y);
    });

    // metal ions
    ions.forEach(ion=>{
      const pulse=1+0.03*Math.sin(bondT*1.8+ion.wobble);
      const ig=ctx.createRadialGradient(ion.x,ion.y,0,ion.x,ion.y,18*pulse);
      ig.addColorStop(0,'rgba(52,152,219,0.45)');
      ig.addColorStop(1,'transparent');
      ctx.beginPath(); ctx.arc(ion.x,ion.y,18*pulse,0,Math.PI*2); ctx.fillStyle=ig; ctx.fill();
      ctx.beginPath(); ctx.arc(ion.x,ion.y,12,0,Math.PI*2);
      ctx.fillStyle='#1a6ca8'; ctx.fill();
      ctx.strokeStyle='rgba(52,152,219,0.6)'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.font=`bold ${e1[1].length>2?6:8}px 'Playfair Display',serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillStyle='white';
      ctx.fillText(e1[1]+cation, ion.x, ion.y);
      ctx.textBaseline='alphabetic';
    });

    // labels
    ctx.textBaseline='alphabetic';
    ctx.font="600 11px 'DM Sans',sans-serif";
    ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,0.75)';
    ctx.fillText('Metal Cation Lattice — '+e1[2], cx, bndY-12);
    ctx.font="500 9px 'DM Mono',monospace";
    ctx.fillStyle='rgba(255,230,100,0.7)';
    ctx.fillText('delocalised electron sea  (carries charge → electrical conductivity)', cx, bndY+bndH+16);

    const outer1label=shells1[shells1.length-1];
    ctx.font="500 9px 'DM Mono',monospace";
    ctx.fillStyle='rgba(255,255,255,0.45)'; ctx.textAlign='center';
    ctx.fillText(`Each ${e1[1]} atom releases ${outer1label} outer electron(s) into the delocalised sea`, cx, bndY+bndH+32);

    bondAnim=requestAnimationFrame(frame);
  }
  bondAnim=requestAnimationFrame(frame);
}

// ── Drawing helpers ──────────────────────────────────────────────────

function drawAtomCircle(ctx,x,y,r,sym,cat,label,col){
  const g=ctx.createRadialGradient(x-r*0.3,y-r*0.3,0,x,y,r);
  g.addColorStop(0,col+'aa'); g.addColorStop(1,col+'22');
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle=col+'99'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.font=`bold ${label.length>3?10:14}px 'Playfair Display',serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='white'; ctx.fillText(label,x,y);
  ctx.textBaseline='alphabetic'; // always reset after use
}

/* Draws electrons as dots (ionic donor) or crosses (ionic acceptor)
   arranged around an atom at radius r, on the specified half-side */
function drawDotCrossElectrons(ctx,x,y,r,count,total,style,col,alpha,side){
  if(count<=0) return;
  const positions = getElectronPositions(total, side);
  for(let i=0;i<count;i++){
    if(i>=positions.length) break;
    const [ang] = positions[i];
    const ex=x+Math.cos(ang)*r, ey=y+Math.sin(ang)*r;
    ctx.globalAlpha=alpha;
    if(style==='dot'){
      ctx.beginPath(); ctx.arc(ex,ey,4.5,0,Math.PI*2);
      ctx.fillStyle=col; ctx.fill();
    } else {
      // cross
      ctx.strokeStyle=col; ctx.lineWidth=2;
      ctx.beginPath(); ctx.moveTo(ex-4,ey-4); ctx.lineTo(ex+4,ey+4); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ex+4,ey-4); ctx.lineTo(ex-4,ey+4); ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
}

// drawLonePairs removed — superseded by universal lonePosLeft/Right inside animateCovalent

/* Get angular positions around atom for dot-and-cross diagram */
function getElectronPositions(total, side){
  const positions=[];
  // 4 faces: top(270°), bottom(90°), outer(180° or 0°), extra spread
  const angles = side==='left'
    ? [Math.PI*1.5, Math.PI*0.5, Math.PI, Math.PI*1.75, Math.PI*1.25, Math.PI*0.25, Math.PI*0.75]
    : [Math.PI*1.5, Math.PI*0.5, 0,       Math.PI*0.25, Math.PI*1.75, Math.PI*0.75, Math.PI*1.25];
  for(let i=0;i<total;i++) positions.push([angles[i%angles.length]+i*0.15]);
  return positions;
}

/* Bottom legend showing electron accounting */
function drawElectronLegend(ctx, W, H, e1, e2, outer1, outer2, type, order, stable){
  if(!stable) return;
  const y=H-52;
  ctx.textBaseline='alphabetic';
  ctx.font="500 8.5px 'DM Mono',monospace";
  ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.fillText('─────────────────── Electron accounting ───────────────────', W/2, y);

  if(type==='covalent'){
    const lone1=loneElectrons(outer1,order);
    const lone2=loneElectrons(outer2,order);
    ctx.fillStyle='#00cfff';
    ctx.fillText(`${e1[1]}: ${outer1} own  +  ${order} shared  =  ${outer1+order} (sees ${outer1+order} → octet ${outer1+order>=8?'✓':'·'})`, W/2, y+14);
    ctx.fillStyle='#a78bfa';
    ctx.fillText(`${e2[1]}: ${outer2} own  +  ${order} shared  =  ${outer2+order} (sees ${outer2+order} → octet ${outer2+order>=8?'✓':'·'})`, W/2, y+27);
    ctx.fillStyle='#f0c96a';
    ctx.fillText(`${order===1?'Single':order===2?'Double':'Triple'} bond  ·  ${order*2} electrons shared  ·  ${order===1?'σ':order===2?'σ+π':'σ+2π'}`, W/2, y+40);
  } else if(type==='ionic'){
    const need2=Math.max(0,8-outer2);
    const tCount = Math.min(outer1, need2);
    ctx.fillStyle='#ff9f43';
    ctx.fillText(`${e1[1]}: loses ${outer1}e⁻  →  ${e1[1]}${outer1===1?'⁺':outer1===2?'²⁺':'³⁺'}  (noble gas config ✓)`, W/2, y+14);
    ctx.fillStyle='#00d4ff';
    ctx.fillText(`${e2[1]}: gains ${tCount}e⁻  →  ${e2[1]}${need2===1?'⁻':need2===2?'²⁻':'³⁻'}  (${outer2}+${tCount}=${outer2+tCount} outer electrons ✓)`, W/2, y+27);
  }
}

function drawGridBg(ctx,W,H){
  ctx.textBaseline='alphabetic'; // safety reset
  ctx.fillStyle='#0b1628'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(212,168,67,0.04)'; ctx.lineWidth=1;
  for(let x=0;x<W;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}

// ── COLOUR PICKER ─────────────────────────────────────────────────
function toggleColourPicker() {
  const panel = document.getElementById('colourPanel');
  panel.classList.toggle('open');
}

// Close panel when clicking outside
document.addEventListener('click', function(e) {
  const wrap = document.getElementById('colourPickerWrap');
  if (wrap && !wrap.contains(e.target)) {
    const panel = document.getElementById('colourPanel');
    if (panel) panel.classList.remove('open');
  }
});

function applyBg(btn) {
  const bg = btn.dataset.bg;
  const mode = btn.dataset.mode;
  _applyTheme(bg, mode);
  document.querySelectorAll('.colour-cell').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('customBgPicker').value = bg;
  document.getElementById('customHexLabel').textContent = bg;
  document.getElementById('colourPanel').classList.remove('open');
}

function applyCustomBg(hex) {
  // Determine light or dark from luminance
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  const lum = 0.2126*r + 0.7152*g + 0.0722*b;
  const mode = lum > 0.4 ? 'light' : 'dark';
  _applyTheme(hex, mode);
  document.querySelectorAll('.colour-cell').forEach(c => c.classList.remove('active'));
  document.getElementById('customHexLabel').textContent = hex;
}

function _applyTheme(bg, mode) {
  // Apply to page background and pt-section
  document.body.style.background = bg;
  const ptSection = document.querySelector('.pt-section');
  if (ptSection) ptSection.style.background = bg;

  const root = document.documentElement;
  if (mode === 'light') {
    root.style.setProperty('--content-bg', bg);
    // On light bg: elem buttons stay dark navy for contrast
    root.style.setProperty('--navy', bg);
    // Subtitle and legend text go dark
    document.querySelectorAll('.pt-subtitle,.leg-item,.lanthanide-label,.actinide-label').forEach(el => {
      el.style.color = 'rgba(0,0,0,0.55)';
    });
    document.querySelectorAll('.pt-title').forEach(el => el.style.color = '#1a4480');
    // Keep element buttons dark navy (they look great on any bg)
  } else {
    root.style.setProperty('--content-bg', bg);
    root.style.setProperty('--navy', bg);
    document.querySelectorAll('.pt-subtitle,.leg-item,.lanthanide-label,.actinide-label').forEach(el => {
      el.style.color = '';
    });
    document.querySelectorAll('.pt-title').forEach(el => el.style.color = '');
  }
}
