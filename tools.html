<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learning Tools — Inspire Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="assets/css/tokens.css">
<style>
:root {
  --navy:   #0b1628;
  --navy2:  #112240;
  --navy3:  #1a3a5c;
  --gold:   #d4a017;
  --gold2:  #f0c040;
  --orange: #e8620a;
  --white:  #ffffff;
  --border: #1e3a5f;
  --muted:  #7a8fa6;
  --green:  #16803c;
  --r: 6px;
  --transition: 0.2s ease;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family:var(--font-body); background: var(--navy); color: var(--white); min-height: 100vh; line-height: 1.6; }
a { text-decoration: none; color: inherit; }
button { cursor: pointer; font-family:var(--font-body); }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--navy2); }
::-webkit-scrollbar-thumb { background: var(--navy3); border-radius: 3px; }

/* ── TOP NAV ── */
.topnav {
  background: var(--navy2);
  border-bottom: 1px solid var(--border);
  padding: .9rem 2rem;
  display: flex; align-items: center; gap: 1.5rem;
  position: sticky; top: 0; z-index: 100;
}
.topnav-logo img { height: 36px; width: auto; border-radius: 8px; }
.topnav-title {
  font-family:var(--font-display);
  font-size: 1.1rem; font-weight: 700;
  color: var(--gold); flex: 1;
}
.nav-links { display: flex; gap: .3rem; }
.nav-link {
  padding: .45rem .9rem; border-radius: var(--r);
  font-size: .82rem; font-weight: 500;
  color: var(--muted); background: none; border: none;
  transition: all .2s;
}
.nav-link:hover, .nav-link.active { background: var(--navy3); color: var(--white); }
.nav-user {
  display: flex; align-items: center; gap: .75rem;
  padding: .4rem .8rem; border: 1px solid var(--border);
  border-radius: var(--r); font-size: .82rem;
  cursor: pointer; transition: all .2s;
}
.nav-user:hover { border-color: var(--gold); }
.avatar {
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: .82rem; flex-shrink: 0;
}

/* ── LOADING ── */
.loading-screen {
  position: fixed; inset: 0; background: var(--navy);
  display: flex; align-items: center; justify-content: center;
  z-index: 999; flex-direction: column; gap: 16px;
}
.loading-logo {
  font-family:var(--font-display);
  font-size: 28px; font-weight: 700; color: var(--gold);
}
.spinner {
  width: 32px; height: 32px;
  border: 2px solid var(--border);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin .8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── MAIN ── */
main { max-width: 1200px; margin: 0 auto; padding: 3rem 1.5rem; }

/* ── PAGE HEADER ── */
.page-header { margin-bottom: 3rem; }
.page-eyebrow {
  font-family:var(--font-mono);
  font-size: .7rem; letter-spacing: .12em;
  text-transform: uppercase; color: var(--gold);
  margin-bottom: .5rem;
}
.page-title {
  font-family:var(--font-display);
  font-size: 2.2rem; font-weight:800;
  margin-bottom: .5rem; line-height: 1.2;
}
.page-title span { color: var(--gold); }
.page-desc { color: var(--muted); font-size: .95rem; max-width: 560px; line-height: 1.7; }

/* ── CATEGORY FILTERS ── */
.filters {
  display: flex; gap: .5rem; flex-wrap: wrap;
  margin-bottom: 2.5rem;
}
.filter-btn {
  padding: .4rem 1rem; border-radius: 20px;
  font-size: .82rem; font-weight: 500;
  border: 1px solid var(--border);
  background: none; color: var(--muted);
  transition: all var(--transition);
}
.filter-btn:hover { border-color: var(--gold); color: var(--gold); }
.filter-btn.active {
  background: var(--gold); border-color: var(--gold);
  color: var(--navy); font-weight: 600;
}

/* ── TOOLS GRID ── */
.tools-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 1.5rem;
}

/* ── TOOL CARD ── */
.tool-card {
  background: var(--navy2);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: all .25s;
  position: relative;
  display: flex; flex-direction: column;
}
.tool-card:hover {
  border-color: var(--gold);
  transform: translateY(-3px);
  box-shadow: 0 12px 32px rgba(0,0,0,.3);
}
.tool-card-accent {
  height: 3px;
  width: 100%;
}
.tool-card-body {
  padding: 1.6rem;
  flex: 1; display: flex; flex-direction: column;
}
.tool-icon {
  font-size: 2.4rem; margin-bottom: 1rem;
  display: block; line-height: 1;
}
.tool-badge {
  display: inline-block;
  font-family:var(--font-mono);
  font-size: .6rem; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase;
  padding: .2rem .6rem; border-radius: 3px;
  margin-bottom: .75rem;
}
.tool-name {
  font-family:var(--font-display);
  font-size: 1.15rem; font-weight: 700;
  margin-bottom: .4rem; line-height: 1.3;
}
.tool-desc {
  font-size: .85rem; color: var(--muted);
  line-height: 1.6; flex: 1; margin-bottom: 1.2rem;
}
.tool-tags {
  display: flex; gap: .4rem; flex-wrap: wrap;
  margin-bottom: 1.2rem;
}
.tool-tag {
  font-family:var(--font-mono);
  font-size: .6rem; letter-spacing: .06em;
  text-transform: uppercase;
  padding: .15rem .5rem; border-radius: 3px;
  background: rgba(255,255,255,.06);
  color: var(--muted);
}
.tool-footer {
  display: flex; align-items: center;
  justify-content: space-between;
  padding-top: 1rem;
  border-top: 1px solid rgba(30,58,95,.6);
}
.tool-subjects {
  font-size: .75rem; color: var(--muted);
  font-family:var(--font-mono);
}
.btn-launch {
  background: var(--gold); border: none;
  color: var(--navy); padding: .5rem 1.2rem;
  border-radius: var(--r); font-size: .82rem;
  font-weight: 700; transition: all var(--transition);
  display: flex; align-items: center; gap: .4rem;
}
.btn-launch:hover { background: var(--gold2); }

/* Coming soon state */
.tool-card.coming-soon {
  opacity: .6; cursor: default;
}
.tool-card.coming-soon:hover {
  transform: none;
  box-shadow: none;
  border-color: var(--border);
}
.badge-coming {
  background: rgba(122,143,166,.15);
  color: var(--muted);
  border: 1px solid var(--border);
}

/* ── MODAL OVERLAY ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.85);
  z-index: 500;
  display: none; align-items: flex-start;
  justify-content: center;
  padding: 1rem;
  backdrop-filter: blur(4px);
}
.modal-overlay.open { display: flex; }

.modal-frame {
  background: var(--navy);
  border: 1px solid var(--border);
  border-radius: 12px;
  width: 100%; max-width: 1200px;
  height: calc(100vh - 2rem);
  display: flex; flex-direction: column;
  overflow: hidden;
  animation: modalIn .25s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(.97) translateY(8px); }
  to   { opacity: 1; transform: scale(1)  translateY(0); }
}

.modal-topbar {
  display: flex; align-items: center; gap: 1rem;
  padding: .9rem 1.2rem;
  background: var(--navy2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.modal-tool-icon { font-size: 1.4rem; flex-shrink: 0; }
.modal-tool-name {
  font-family:var(--font-display);
  font-size: 1rem; font-weight: 700; flex: 1;
}
.modal-actions { display: flex; gap: .5rem; align-items: center; }
.btn-modal-external {
  background: none; border: 1px solid var(--border);
  color: var(--muted); padding: .4rem .9rem;
  border-radius: var(--r); font-size: .78rem;
  font-weight: 500; transition: all var(--transition);
  display: flex; align-items: center; gap: .4rem;
}
.btn-modal-external:hover { border-color: var(--gold); color: var(--gold); }
.btn-modal-close {
  background: none; border: 1px solid var(--border);
  color: var(--muted); width: 32px; height: 32px;
  border-radius: var(--r); font-size: 1rem;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition);
}
.btn-modal-close:hover { border-color: var(--gold); color: var(--white); }

.modal-iframe-wrap {
  flex: 1; position: relative; overflow: hidden;
}
.modal-iframe-wrap iframe {
  width: 100%; height: 100%;
  border: none; display: block;
  background: var(--navy);
}
.iframe-loading {
  position: absolute; inset: 0;
  background: var(--navy);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 12px;
}
.iframe-loading .spinner { width: 28px; height: 28px; }
.iframe-loading p {
  font-size: .82rem; color: var(--muted);
  font-family:var(--font-mono);
}

/* ── EMPTY STATE ── */
.empty-state {
  grid-column: 1 / -1;
  text-align: center; padding: 4rem 2rem;
  color: var(--muted);
}
.empty-icon { font-size: 3rem; margin-bottom: 1rem; }
.empty-title {
  font-family:var(--font-display);
  font-size: 1.4rem; color: var(--white);
  margin-bottom: .5rem;
}

/* ── TOAST ── */
#toast {
  position: fixed; bottom: 2rem; right: 2rem;
  background: var(--navy2); border: 1px solid var(--border);
  padding: .8rem 1.2rem; border-radius: var(--r);
  font-size: .85rem;
  transform: translateY(100px); opacity: 0;
  transition: all .3s; z-index: 9999; max-width: 320px;
}
#toast.show { transform: translateY(0); opacity: 1; }

@media (max-width: 768px) {
  .topnav { padding: .8rem 1rem; gap: .8rem; }
  .nav-links { display: none; }
  main { padding: 2rem 1rem; }
  .tools-grid { grid-template-columns: 1fr; }
  .modal-frame { height: calc(100vh - 1rem); }
}
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-logo">Inspire Science</div>
  <div class="spinner"></div>
</div>

<!-- TOP NAV -->
<nav class="topnav">
  <a href="/dashboard.html" class="topnav-logo">
    <img src="/icons/icon-192.png" alt="Inspire Science" onerror="this.style.display='none'">
  </a>
  <span class="topnav-title">Student Portal</span>
  <div class="nav-links">
    <button class="nav-link" onclick="location.href='/dashboard.html'">Dashboard</button>
    <button class="nav-link" onclick="location.href='/subjects.html'">Subjects</button>
    <button class="nav-link" onclick="location.href='/progress.html'">My Progress</button>
    <button class="nav-link" onclick="location.href='/revision.html'">Personalised Learning</button>
    <button class="nav-link" onclick="location.href='/assessment.html'">Assessments</button>
    <button class="nav-link active">Tools</button>
  </div>
  <div class="nav-user" onclick="location.href='/dashboard.html'">
    <div class="avatar" id="nav-avatar" style="background:var(--gold);color:var(--navy);">?</div>
    <span id="nav-name">Student</span>
  </div>
</nav>

<!-- MAIN -->
<main>

  <div class="page-header">
    <div class="page-eyebrow">Interactive Learning</div>
    <h1 class="page-title">Learning <span>Tools</span></h1>
    <p class="page-desc">Interactive resources to support your revision. Click any tool to launch it directly — no downloads needed.</p>
  </div>

  <!-- CATEGORY FILTERS -->
  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all" onclick="filterTools('all', this)">All tools</button>
    <button class="filter-btn" data-filter="chemistry" onclick="filterTools('chemistry', this)">Chemistry</button>
    <button class="filter-btn" data-filter="physics" onclick="filterTools('physics', this)">Physics</button>
    <button class="filter-btn" data-filter="biology" onclick="filterTools('biology', this)">Biology</button>
    <button class="filter-btn" data-filter="maths" onclick="filterTools('maths', this)">Maths</button>
    <button class="filter-btn" data-filter="calculator" onclick="filterTools('calculator', this)">Calculators</button>
    <button class="filter-btn" data-filter="practical" onclick="filterTools('practical', this)">Practicals</button>
  </div>

  <!-- TOOLS GRID -->
  <div class="tools-grid" id="tools-grid">
    <!-- populated by JS -->
  </div>

</main>

<!-- MODAL OVERLAY -->
<div class="modal-overlay" id="toolModal">
  <div class="modal-frame">
    <div class="modal-topbar">
      <span class="modal-tool-icon" id="modal-icon">🔬</span>
      <span class="modal-tool-name" id="modal-name">Tool</span>
      <div class="modal-actions">
        <button class="btn-modal-external" id="modal-external" onclick="openExternal()">
          ↗ Open full screen
        </button>
        <button class="btn-modal-close" onclick="closeModal()" title="Close">✕</button>
      </div>
    </div>
    <div class="modal-iframe-wrap">
      <div class="iframe-loading" id="iframe-loading">
        <div class="spinner"></div>
        <p>Loading tool...</p>
      </div>
      <iframe id="tool-iframe" src="" onload="iframeLoaded()" title="Learning Tool"></iframe>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ─────────────────────────────────────────────
// SUPABASE
// ─────────────────────────────────────────────
const SUPABASE_URL     = 'https://ygtsrdwoikqnrbexjrtl.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_XxmrO4J18iyQ1Srub73BhQ_FBhd8mXR'
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

// ─────────────────────────────────────────────
// TOOLS REGISTRY
// Add new tools here — that's all you ever need to do
// ─────────────────────────────────────────────
const TOOLS = [
  {
    id: 'periodic-table',
    name: 'Interactive Periodic Table',
    icon: '⚗️',
    desc: 'Explore all 118 elements with detailed properties, electron configurations, trends and interactive visualisations.',
    file: '/periodic-table.html',
    accent: 'linear-gradient(90deg,#0b6e6d,#2dd4bf)',
    badge: 'Chemistry',
    badgeColor: 'rgba(13,110,109,.25)',
    badgeText: '#2dd4bf',
    subjects: ['Chemistry'],
    tags: ['elements', 'atomic structure', 'periodic trends'],
    category: ['chemistry'],
    available: true
  },
  {
    id: 'required-practicals',
    name: 'Required Practicals Guide',
    icon: '🧪',
    desc: 'Step-by-step interactive guides for all required practicals across Physics, Chemistry and Biology. Includes method, apparatus, variables and analysis.',
    file: '/required-practicals.html',
    accent: 'linear-gradient(90deg,#16803c,#4ade80)',
    badge: 'All Sciences',
    badgeColor: 'rgba(22,128,60,.25)',
    badgeText: '#4ade80',
    subjects: ['Physics', 'Chemistry', 'Biology'],
    tags: ['practicals', 'method', 'apparatus', 'variables'],
    category: ['physics', 'chemistry', 'biology', 'practical'],
    available: true
  },
  {
    id: 'calculator',
    name: 'Scientific & Graphing Calculator',
    icon: '🧮',
    desc: 'Full scientific calculator with graphing capability. Supports all GCSE equations, unit conversions and formula rearrangement.',
    file: '/calculator.html',
    accent: 'linear-gradient(90deg,#1c4f8a,#3b82f6)',
    badge: 'All Subjects',
    badgeColor: 'rgba(28,79,138,.25)',
    badgeText: '#60a5fa',
    subjects: ['Physics', 'Chemistry', 'Maths'],
    tags: ['calculator', 'equations', 'graphs', 'units'],
    category: ['physics', 'chemistry', 'maths', 'calculator'],
    available: true
  },
  {
    id: 'atom-builder',
    name: 'Atom Builder',
    icon: '⚛️',
    desc: 'Build atoms and explore ionic, covalent and metallic bonding with animated electron shells. Covers all GCSE bonding topics.',
    file: '/atom-builder.html',
    accent: 'linear-gradient(90deg,#7c3aed,#a78bfa)',
    badge: 'Chemistry',
    badgeColor: 'rgba(124,58,237,.25)',
    badgeText: '#a78bfa',
    subjects: ['Chemistry'],
    tags: ['atomic structure', 'bonding', 'electrons', 'ionic', 'covalent'],
    category: ['chemistry'],
    available: true
  },
  {
    id: 'equation-sheet',
    name: 'Equation Reference Sheet',
    icon: '📐',
    desc: 'Every GCSE equation organised by subject, topic and exam board. Includes formula triangles and worked examples.',
    file: '/equation-sheet.html',
    accent: 'linear-gradient(90deg,#b45309,#f59e0b)',
    badge: 'Physics · Maths',
    badgeColor: 'rgba(180,83,9,.25)',
    badgeText: '#f59e0b',
    subjects: ['Physics', 'Maths'],
    tags: ['equations', 'formulas', 'reference'],
    category: ['physics', 'maths', 'calculator'],
    available: true
  },
  {
    id: 'graph-skills',
    name: 'Graph Skills Simulator',
    icon: '📊',
    desc: 'Practice drawing, reading and interpreting graphs. Covers distance-time, velocity-time, cooling curves and more.',
    file: '/graph-skills.html',
    accent: 'linear-gradient(90deg,#0e7c7b,#14b8a6)',
    badge: 'Science · Maths',
    badgeColor: 'rgba(14,124,123,.25)',
    badgeText: '#14b8a6',
    subjects: ['Physics', 'Chemistry', 'Biology', 'Maths'],
    tags: ['graphs', 'data', 'analysis', 'skills'],
    category: ['physics', 'chemistry', 'biology', 'maths'],
    available: true
  }
]

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let currentFilter  = 'all'
let currentToolUrl = ''

// ─────────────────────────────────────────────
// AUTH
// ─────────────────────────────────────────────
async function init() {
  const { data: { session } } = await supa.auth.getSession()
  if (!session) {
    window.location.href = '/index.html'
    return
  }

  const { data: profile } = await supa
    .from('profiles')
    .select('full_name, first_name')
    .eq('id', session.user.id)
    .single()

  const name = profile?.first_name || profile?.full_name?.split(' ')[0] || 'Student'
  const initial = name[0]?.toUpperCase() || '?'
  document.getElementById('nav-name').textContent   = name
  document.getElementById('nav-avatar').textContent = initial

  document.getElementById('loadingScreen').style.display = 'none'
  renderTools('all')
}

// ─────────────────────────────────────────────
// RENDER TOOLS
// ─────────────────────────────────────────────
function renderTools(filter) {
  const grid = document.getElementById('tools-grid')
  const filtered = filter === 'all'
    ? TOOLS
    : TOOLS.filter(t => t.category.includes(filter))

  if (!filtered.length) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🔍</div>
        <div class="empty-title">No tools in this category yet</div>
        <p>More tools are being added. Check back soon.</p>
      </div>`
    return
  }

  grid.innerHTML = filtered.map(tool => `
    <div class="tool-card ${tool.available ? '' : 'coming-soon'}"
         onclick="${tool.available ? `launchTool('${tool.id}')` : ''}">
      <div class="tool-card-accent" style="background:${tool.accent}"></div>
      <div class="tool-card-body">
        <span class="tool-icon">${tool.icon}</span>
        <span class="tool-badge" style="background:${tool.badgeColor};color:${tool.badgeText};">
          ${tool.available ? tool.badge : 'Coming soon'}
        </span>
        <div class="tool-name">${tool.name}</div>
        <div class="tool-desc">${tool.desc}</div>
        <div class="tool-tags">
          ${tool.tags.slice(0,3).map(t => `<span class="tool-tag">${t}</span>`).join('')}
        </div>
        <div class="tool-footer">
          <span class="tool-subjects">${tool.subjects.join(' · ')}</span>
          ${tool.available
            ? `<button class="btn-launch" onclick="event.stopPropagation();launchTool('${tool.id}')">
                Launch →
               </button>`
            : `<span style="font-size:.78rem;color:var(--muted);font-family:var(--font-mono);">In development</span>`
          }
        </div>
      </div>
    </div>`
  ).join('')
}

// ─────────────────────────────────────────────
// FILTER
// ─────────────────────────────────────────────
function filterTools(filter, btn) {
  currentFilter = filter
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'))
  btn.classList.add('active')
  renderTools(filter)
}

// ─────────────────────────────────────────────
// MODAL
// ─────────────────────────────────────────────
function launchTool(toolId) {
  const tool = TOOLS.find(t => t.id === toolId)
  if (!tool) return

  currentToolUrl = tool.file

  document.getElementById('modal-icon').textContent = tool.icon
  document.getElementById('modal-name').textContent = tool.name
  document.getElementById('iframe-loading').style.display = 'flex'

  const iframe = document.getElementById('tool-iframe')
  iframe.style.opacity = '0'
  iframe.src = tool.file

  document.getElementById('toolModal').classList.add('open')
  document.body.style.overflow = 'hidden'
}

function iframeLoaded() {
  document.getElementById('iframe-loading').style.display = 'none'
  const iframe = document.getElementById('tool-iframe')
  iframe.style.opacity = '1'
  iframe.style.transition = 'opacity .3s ease'
}

function closeModal() {
  document.getElementById('toolModal').classList.remove('open')
  document.body.style.overflow = ''
  // Clear src after close animation
  setTimeout(() => {
    document.getElementById('tool-iframe').src = ''
  }, 300)
}

function openExternal() {
  if (currentToolUrl) window.open(currentToolUrl, '_blank')
}

// Close on overlay click
document.getElementById('toolModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal()
})

// Close on Escape key
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal()
})
