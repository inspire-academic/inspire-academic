<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inspire Academic - Teacher Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0b1628;
      --gold: #c9a84c;
      --border: #374151;
      --muted: #9ca3af;
      --white: #ffffff;
      --green: #4ade80;
      --amber: #fbbf24;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--navy);
      color: var(--white);
      display: flex;
    }
    .sidebar {
      width: 175px;
      background: rgba(0,0,0,0.3);
      border-right: 1px solid var(--border);
      padding: 1.5rem 0;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .logo {
      padding: 0 1.5rem;
      margin-bottom: 2rem;
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--gold);
    }
    .nav {
      list-style: none;
    }
    .nav li {
      margin: 0;
    }
    .nav a {
      display: block;
      padding: 0.75rem 1.5rem;
      color: var(--muted);
      text-decoration: none;
      border-left: 3px solid transparent;
      transition: all 0.2s;
      font-size: 0.9rem;
    }
    .nav a:hover, .nav a.active {
      color: var(--white);
      background: rgba(201,168,76,0.1);
      border-left-color: var(--gold);
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .topbar {
      background: rgba(0,0,0,0.2);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topbar-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 600;
    }
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
    }
    .section-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .section-desc {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5rem;
      margin-bottom: 1rem;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
    }
    .card-title {
      font-weight: 600;
      font-size: 1.05rem;
    }
    .card-meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.3rem;
    }
    .card-stats {
      display: flex;
      gap: 1.5rem;
      font-size: 0.9rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }
    .stat {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .stat-value {
      font-weight: 600;
    }
    .stat-label {
      color: var(--muted);
      font-size: 0.75rem;
    }
    .stat.submitted .stat-value { color: var(--amber); }
    .stat.reviewed .stat-value { color: var(--green); }
    .empty-state {
      text-align: center;
      padding: 3rem 2rem;
      color: var(--muted);
    }
    .empty-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .loading {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
    }
    .error {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: #fca5a5;
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="logo">Inspire Science</div>
    <ul class="nav">
      <li><a href="/" class="nav-link">Overview</a></li>
      <li><a href="#" class="nav-link active">Assessments</a></li>
      <li><a href="/teaching-cockpit.html" class="nav-link">Teaching Cockpit</a></li>
    </ul>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-title">Teacher Dashboard</div>
      <button onclick="location.href='/'" style="background: var(--gold); color: var(--navy); border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: 500;">← Home</button>
    </div>
    
    <div class="content">
      <div class="section-title">Assessments</div>
      <div class="section-desc">Manage assigned assessments and review student submissions</div>
      
      <div id="assessments-panel" class="loading">Loading assignments...</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://ygtsrdwoikqnrbexjrtl.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlndHNyZHdvaWtxbnJiZXhqcnRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUzMjY1NDYsImV4cCI6MjA5MDkwMjU0Nn0.K0NMpMtD1-Ajv2kFoVy7CIjf2JHJ4vXM0BLiPqvZslo';
    
    const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadAssessmentsPanel() {
      const panel = document.getElementById('assessments-panel');
      
      try {
        // Get assignments
        const { data: assignments, error: assignError } = await supa
          .from('revision_assignments')
          .select('id, pack_id, assigned_to, due_date, message, status, assigned_at')
          .order('assigned_at', { ascending: false });

        if (assignError) throw assignError;

        if (!assignments?.length) {
          panel.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">📋</div>
              <div style="font-weight: 600; margin-bottom: 0.5rem;">No assignments yet</div>
              <div>Assignments appear when you assign revision packs to students.</div>
            </div>
          `;
          return;
        }

        // Get pack details
        const packIds = [...new Set(assignments.map(a => a.pack_id))];
        const { data: packs } = await supa
          .from('revision_packs')
          .select('id, title, subject, exam_board, difficulty_tier')
          .in('id', packIds);

        const packsMap = {};
        (packs || []).forEach(p => { packsMap[p.id] = p; });

        // Get submission counts
        const { data: submissions } = await supa
          .from('revision_pack_submissions')
          .select('id, assignment_id, status');

        const counts = {};
        (submissions || []).forEach(sub => {
          if (!counts[sub.assignment_id]) {
            counts[sub.assignment_id] = { total: 0, submitted: 0, reviewed: 0 };
          }
          counts[sub.assignment_id].total++;
          if (sub.status === 'submitted') counts[sub.assignment_id].submitted++;
          if (sub.status === 'reviewed') counts[sub.assignment_id].reviewed++;
        });

        // Render
        let html = '';
        assignments.forEach(assign => {
          const pack = packsMap[assign.pack_id];
          if (!pack) return;
          const c = counts[assign.id] || { submitted: 0, reviewed: 0, total: 0 };
          const dueDate = assign.due_date ? new Date(assign.due_date).toLocaleDateString('en-GB') : 'No due date';
          
          html += `
            <div class="card">
              <div class="card-header">
                <div>
                  <div class="card-title">${escapeHtml(pack.title)}</div>
                  <div class="card-meta">${pack.exam_board} • ${pack.subject} • ${pack.difficulty_tier}</div>
                </div>
              </div>
              <div class="card-stats">
                <div class="stat">
                  <div class="stat-label">Due</div>
                  <div class="stat-value">${dueDate}</div>
                </div>
                <div class="stat submitted">
                  <div class="stat-label">Submitted</div>
                  <div class="stat-value">✓ ${c.submitted}</div>
                </div>
                <div class="stat reviewed">
                  <div class="stat-label">Reviewed</div>
                  <div class="stat-value">✔ ${c.reviewed}</div>
                </div>
              </div>
              ${assign.message ? `
                <div style="margin-top: 1rem; padding: 0.75rem; background: rgba(201,168,76,0.1); border-left: 3px solid var(--gold); color: var(--gold); font-size: 0.85rem;">
                  ${escapeHtml(assign.message)}
                </div>
              ` : ''}
            </div>
          `;
        });

        panel.innerHTML = html || '<div class="error">No assignments found</div>';

      } catch (err) {
        console.error(err);
        panel.innerHTML = `<div class="error">Error: ${err.message}</div>`;
      }
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    // Load on page ready
    document.addEventListener('DOMContentLoaded', loadAssessmentsPanel);
  </script>
</body>
</html>
