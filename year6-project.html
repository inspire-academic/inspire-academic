<style>
:root{
  --navy:#0b1628;--navy2:#112240;--navy3:#1a3a5c;
  --gold:#d4a017;--gold2:#f0c040;
  --orange:#e8620a;
  --white:#ffffff;
  --border:#1e3a5f;
  --muted:#7a8fa6;
  --green:#16803c;--red:#b92b1a;
  --r:6px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--white);min-height:100vh;line-height:1.6;overflow-x:hidden;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;font-family:'DM Sans',sans-serif;}
input,select,textarea{font-family:'DM Sans',sans-serif;}

::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:var(--navy2);}
::-webkit-scrollbar-thumb{background:var(--navy3);border-radius:3px;}

/* Top nav */
.topnav{
  background:var(--navy2);border-bottom:1px solid var(--border);
  padding:.8rem 1.5rem;display:flex;align-items:center;gap:1rem;
  position:sticky;top:0;z-index:100;
}
.topnav-back{background:none;border:1px solid var(--border);color:var(--muted);
  padding:.4rem .8rem;border-radius:var(--r);font-size:.85rem;transition:all .2s;}
.topnav-back:hover{border-color:var(--gold);color:var(--gold);}
.topnav-title{flex:1;font-family:'Playfair Display',serif;font-size:1rem;font-weight:700;}
.topnav-title span{color:var(--gold);}
.topnav-status{font-size:.75rem;font-family:'DM Mono',monospace;text-transform:uppercase;
  letter-spacing:.08em;padding:.3rem .6rem;border-radius:4px;background:rgba(212,160,23,.15);
  color:var(--gold);border:1px solid rgba(212,160,23,.3);}
.topnav-status.saved{background:rgba(22,128,60,.15);color:#4ade80;border-color:rgba(22,128,60,.3);}

/* Split layout */
.split-container{display:flex;height:calc(100vh - 60px);}

/* Left panel - PDF viewer */
.left-panel{
  width:45%;flex-shrink:0;background:var(--navy2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;
}
.pdf-header{
  padding:1rem 1.5rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.pdf-header h3{font-size:.95rem;font-weight:600;}
.pdf-nav{display:flex;gap:.5rem;}
.pdf-nav button{background:transparent;border:1px solid var(--border);color:var(--muted);
  padding:.4rem .8rem;border-radius:var(--r);font-size:.8rem;transition:all .2s;}
.pdf-nav button:hover:not(:disabled){border-color:var(--gold);color:var(--gold);}
.pdf-nav button:disabled{opacity:.4;cursor:not-allowed;}

.pdf-viewer{flex:1;overflow:auto;padding:1rem;background:var(--navy);}
.pdf-viewer iframe{width:100%;height:100%;border:none;border-radius:var(--r);}

/* Right panel - Form */
.right-panel{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
}
.form-header{
  padding:1rem 1.5rem;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.form-header h3{font-size:.95rem;font-weight:600;}
.section-nav{display:flex;gap:.3rem;flex-wrap:wrap;}
.section-tab{
  padding:.35rem .7rem;border-radius:4px;font-size:.75rem;
  background:var(--navy2);border:1px solid var(--border);color:var(--muted);
  transition:all .2s;
}
.section-tab:hover{border-color:var(--gold);color:var(--gold);}
.section-tab.active{background:var(--gold);color:var(--navy);border-color:var(--gold);}
.section-tab.completed{border-color:var(--green);color:var(--green);}

.form-content{flex:1;overflow:auto;padding:2rem;}
.form-section{display:none;}
.form-section.active{display:block;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.section-title{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:700;margin-bottom:.5rem;}
.section-subtitle{font-size:.9rem;color:var(--muted);margin-bottom:2rem;line-height:1.6;}

.field{margin-bottom:1.5rem;}
.field-label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);
  margin-bottom:.5rem;text-transform:uppercase;letter-spacing:.05em;}
.field-input,.field-textarea,.field-select{
  width:100%;padding:.8rem 1rem;border-radius:var(--r);
  background:var(--navy2);border:1.5px solid var(--border);
  color:var(--white);font-size:.9rem;outline:none;transition:border-color .2s;
}
.field-input:focus,.field-textarea:focus,.field-select:focus{border-color:var(--gold);}
.field-textarea{min-height:120px;resize:vertical;line-height:1.6;}
.field-input::placeholder,.field-textarea::placeholder{color:var(--muted);}

.checkbox-group{display:flex;flex-direction:column;gap:.7rem;}
.checkbox-item{display:flex;align-items:center;gap:.7rem;}
.checkbox-item input[type="checkbox"]{
  width:18px;height:18px;cursor:pointer;
  accent-color:var(--gold);
}
.checkbox-item label{font-size:.9rem;cursor:pointer;}

.photo-upload{
  border:2px dashed var(--border);border-radius:var(--r);
  padding:2rem;text-align:center;cursor:pointer;transition:all .2s;
  background:var(--navy2);
}
.photo-upload:hover{border-color:var(--gold);background:rgba(212,160,23,.05);}
.photo-upload-icon{font-size:2rem;margin-bottom:.5rem;}
.photo-upload-text{font-size:.9rem;color:var(--muted);}
.photo-upload-text strong{color:var(--white);display:block;margin-bottom:.2rem;}

.photo-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:1rem;margin-top:1rem;}
.photo-item{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:1;}
.photo-item img{width:100%;height:100%;object-fit:cover;}
.photo-remove{
  position:absolute;top:.3rem;right:.3rem;
  width:24px;height:24px;border-radius:50%;
  background:var(--red);color:white;border:none;
  font-size:.7rem;cursor:pointer;
}

.table-builder{
  border:1px solid var(--border);border-radius:var(--r);overflow:hidden;
}
.table-builder table{width:100%;border-collapse:collapse;}
.table-builder th{
  background:var(--navy2);padding:.7rem;text-align:left;
  font-size:.8rem;font-weight:600;border-bottom:1px solid var(--border);
}
.table-builder td{padding:.6rem;}
.table-builder td input{
  width:100%;padding:.5rem;background:var(--navy2);border:1px solid var(--border);
  border-radius:4px;color:var(--white);font-size:.85rem;
}

.form-actions{
  position:sticky;bottom:0;background:var(--navy2);
  border-top:1px solid var(--border);padding:1rem 1.5rem;
  display:flex;gap:.8rem;justify-content:space-between;
}
.btn{
  padding:.7rem 1.5rem;border-radius:var(--r);font-size:.9rem;font-weight:600;
  transition:all .2s;border:none;cursor:pointer;
}
.btn-primary{background:var(--gold);color:var(--navy);}
.btn-primary:hover{background:var(--gold2);}
.btn-secondary{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-secondary:hover{border-color:var(--gold);color:var(--gold);}
.btn-success{background:var(--green);color:white;}
.btn-success:hover{opacity:.9;}

#toast{
  position:fixed;bottom:2rem;right:2rem;background:var(--navy2);
  border:1px solid var(--border);padding:.8rem 1.2rem;border-radius:var(--r);
  font-size:.85rem;transform:translateY(100px);opacity:0;transition:all .3s;
  z-index:9999;max-width:320px;
}
#toast.show{transform:translateY(0);opacity:1;}
#toast.success{border-color:var(--green);}
#toast.error{border-color:var(--red);}

.spinner{
  width:16px;height:16px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;
  animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg);}}

@media(max-width:1024px){

  .left-panel{width:100%;height:400px;border-right:none;border-bottom:1px solid var(--border);}
  .right-panel{height:auto;}
  .section-nav{display:none;}
}
</style>

// Render form sections
function renderSections(){
  const container = document.getElementById('form-sections');
  const navContainer = document.getElementById('section-nav');
  
  container.innerHTML = project1Sections.map((section, idx) => `
    <div class="form-section ${idx === 0 ? 'active' : ''}" id="${section.id}">
      <h2 class="section-title">${section.title}</h2>
      <p class="section-subtitle">${section.subtitle}</p>
      ${section.fields.map(field => renderField(field)).join('')}
    </div>
  `).join('');
  
  navContainer.innerHTML = project1Sections.map((section, idx) => `
    <button class="section-tab ${idx === 0 ? 'active' : ''}" 
            data-section="${idx}" 
            onclick="goToSection(${idx})">
      S${idx + 1}
    </button>
  `).join('');
}

// Render individual fields
function renderField(field){
  switch(field.type){
    case 'text':
      return `
        <div class="field">
          <label class="field-label">${field.label}</label>
          <input type="text" class="field-input" 
                 name="${field.name}" 
                 placeholder="${field.placeholder || ''}"
                 onchange="onFieldChange()">
        </div>
      `;
    case 'textarea':
      return `
        <div class="field">
          <label class="field-label">${field.label}</label>
          <textarea class="field-textarea" 
                    name="${field.name}" 
                    placeholder="${field.placeholder || ''}"
                    rows="${field.rows || 5}"
                    maxlength="${field.maxlength || 5000}"
                    onchange="onFieldChange()"></textarea>
        </div>
      `;
    case 'checkbox-group':
      return `
        <div class="field">
          <label class="field-label">${field.label}</label>
          <div class="checkbox-group">
            ${field.options.map((opt, i) => `
              <div class="checkbox-item">
                <input type="checkbox" id="${field.name}_${i}" 
                       name="${field.name}" value="${opt}"
                       onchange="onFieldChange()">
                <label for="${field.name}_${i}">${opt}</label>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    case 'table':
      return `
        <div class="field">
          <label class="field-label">${field.label}</label>
          <div class="table-builder">
            <table>
              <thead>
                <tr>${field.columns.map(col => `<th>${col}</th>`).join('')}</tr>
              </thead>
              <tbody>
                ${field.rows.map((row, ri) => `
                  <tr>
                    ${row.map((cell, ci) => ci === 0 ? 
                      `<td>${cell}</td>` : 
                      `<td><input type="text" data-table="${field.name}" data-row="${ri}" data-col="${ci}" value="${cell}" onchange="onFieldChange()"></td>`
                    ).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    case 'photo-upload':
      return `
        <div class="field">
          <label class="field-label">${field.label}</label>
          <div class="photo-upload" onclick="document.getElementById('photo-${field.section}').click()">
            <div class="photo-upload-icon">📸</div>
            <div class="photo-upload-text">
              <strong>Click to upload photos</strong>
              <span>JPG, PNG, or HEIC (max 5MB each)</span>
            </div>
          </div>
          <input type="file" id="photo-${field.section}" 
                 accept="image/*" multiple style="display:none"
                 onchange="handlePhotoUpload(event, '${field.section}')">
          <div class="photo-preview" id="preview-${field.section}"></div>
        </div>
      `;
    default:
      return '';
  }
}

// Navigation
function goToSection(idx){
  currentSection = idx;
  document.querySelectorAll('.form-section').forEach((s, i) => {
    s.classList.toggle('active', i === idx);
  });
  document.querySelectorAll('.section-tab').forEach((t, i) => {
    t.classList.toggle('active', i === idx);
  });
  document.querySelector('.form-content').scrollTop = 0;
}

function nextSection(){
  if(currentSection < project1Sections.length - 1){
    goToSection(currentSection + 1);
  }
}

function prevSection(){

    goToSection(currentSection - 1);
  }
}

// Form data handling
function onFieldChange(){
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => saveDraft(true), 3000); // Auto-save after 3s of inactivity
}

function collectFormData(){
  const data = {};
  
  // Text and textarea inputs
  document.querySelectorAll('.field-input, .field-textarea').forEach(input => {
    if(input.name) data[input.name] = input.value;
  });
  
  // Checkboxes
  document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
    if(!data[cb.name]) data[cb.name] = [];
    if(cb.checked) data[cb.name].push(cb.value);
  });
  
  // Tables
  const tables = {};
  document.querySelectorAll('[data-table]').forEach(input => {
    const tableName = input.dataset.table;
    if(!tables[tableName]) tables[tableName] = [];
    if(!tables[tableName][input.dataset.row]) tables[tableName][input.dataset.row] = [];
    tables[tableName][input.dataset.row][input.dataset.col] = input.value;
  });
  Object.keys(tables).forEach(key => data[key] = tables[key]);
  
  return data;
}

function populateForm(data){
  if(!data) return;
  
  // Text inputs
  Object.keys(data).forEach(key => {
    const input = document.querySelector(`[name="${key}"]`);
    if(input && (input.tagName === 'INPUT' || input.tagName === 'TEXTAREA')){
      input.value = data[key];
    }
  });
  
  // Checkboxes
  Object.keys(data).forEach(key => {
    if(Array.isArray(data[key])){
      document.querySelectorAll(`input[name="${key}"]`).forEach(cb => {
        cb.checked = data[key].includes(cb.value);
      });
    }
  });
  
  // Tables
  Object.keys(data).forEach(key => {
    if(Array.isArray(data[key]) && data[key].length > 0 && Array.isArray(data[key][0])){
      data[key].forEach((row, ri) => {
        row.forEach((cell, ci) => {
          const input = document.querySelector(`[data-table="${key}"][data-row="${ri}"][data-col="${ci}"]`);
          if(input) input.value = cell;
        });
      });
    }
  });
}

// Photo upload
async function handlePhotoUpload(event, section){
  const files = event.target.files;
  if(!files.length) return;
  
  const preview = document.getElementById(`preview-${section}`);
  
  for(let file of files){
    if(file.size > 5 * 1024 * 1024){
      toast('File too large. Max 5MB per photo.', 'error');
      continue;
    }
    
    // Upload to Supabase storage
    const fileExt = file.name.split('.').pop();
    const fileName = `${currentUser.id}/${section}/${Date.now()}.${fileExt}`;
    
    const {data, error} = await supa.storage
      .from('project-photos')
      .upload(fileName, file);
    
    if(error){
      toast('Upload failed: ' + error.message, 'error');
      continue;
    }
    
    // Get public URL
    const {data: {publicUrl}} = supa.storage
      .from('project-photos')
      .getPublicUrl(fileName);
    
    // Save to database
    await supa.from('submission_photos').insert({
      submission_id: currentSubmission.id,
      section_name: section,
      photo_url: publicUrl
    });
    
    // Add preview
    const div = document.createElement('div');
    div.className = 'photo-item';
    div.innerHTML = `
      <img src="${publicUrl}" alt="Uploaded photo">
      <button class="photo-remove" onclick="removePhoto('${fileName}', this.parentElement)">×</button>
    `;
    preview.appendChild(div);
  }
  
  toast('Photos uploaded successfully!');
}

async function removePhoto(fileName, element){
  await supa.storage.from('project-photos').remove([fileName]);
  element.remove();
  toast('Photo removed');
}

// Save draft
async function saveDraft(silent = false){
  if(!currentSubmission) return;
  
  const data = collectFormData();
  
  const {error} = await supa.from('student_submissions')
    .update({
      submission_data: data,
      updated_at: new Date().toISOString()
    })
    .eq('id', currentSubmission.id);
  
  if(error){
    if(!silent) toast('Save failed: ' + error.message, 'error');
    return;
  }
  
  document.getElementById('save-status').textContent = 'Saved ✓';
  document.getElementById('save-status').classList.add('saved');
  
  if(!silent) toast('Draft saved successfully!');
  
  setTimeout(() => {
    document.getElementById('save-status').classList.remove('saved');
    document.getElementById('save-status').textContent = 'Draft';
  }, 2000);
}

// Preview PDF
function previewPDF(){
  saveDraft(true);
  toast('Opening PDF preview...');
  window.open(`year6-pdf-preview.html?submission=${currentSubmission.id}`, '_blank');
}

// Submit project
async function submitProject(){
  if(!confirm('Are you ready to submit? You can still edit after submission, but your tutor will be notified.')) return;
  
  const data = collectFormData();
  
  const {error} = await supa.from('student_submissions')
    .update({
      submission_data: data,
      status: 'submitted',
      submitted_at: new Date().toISOString()
    })
    .eq('id', currentSubmission.id);
  
  if(error){
    toast('Submission failed: ' + error.message, 'error');
    return;
  }
  
  toast('Project submitted successfully! 🎉');
  setTimeout(() => window.location.href = 'year6-dashboard.html', 2000);
}

// Init
(async()=>{
  // Get project ID from URL
  const params = new URLSearchParams(window.location.search);
  const projectId = parseInt(params.get('id'));
  
  if(!projectId){
    toast('Invalid project ID', 'error');
    window.location.href = 'year6-dashboard.html';
    return;
  }
  
  // Auth
  currentUser = await getUser();
  if(!currentUser){
    window.location.href = 'index.html';
    return;
  }
  
  currentProfile = await getProfile(currentUser.id);
  if(currentProfile?.programme !== 'year6_bridging'){
    toast('Access denied', 'error');
    window.location.href = 'dashboard.html';
    return;
  }
  
  // Load project
  const {data: project} = await supa.from('projects')
    .select('*')
    .eq('id', projectId)
    .single();
  
  if(!project){
    toast('Project not found', 'error');
    window.location.href = 'year6-dashboard.html';
    return;
  }
  
  currentProject = project;
  document.getElementById('project-title').textContent = project.title;
  document.getElementById('pdf-iframe').src = project.booklet_pdf_url;
  
  // Load or create submission
  let {data: submissions} = await supa.from('student_submissions')
    .select('*')
    .eq('user_id', currentUser.id)
    .eq('project_id', projectId);
  
  if(!submissions || submissions.length === 0){
    // Create new submission
    const {data: newSub, error} = await supa.from('student_submissions')
      .insert({
        user_id: currentUser.id,
        project_id: projectId,
        status: 'draft',
        submission_data: {}
      })
      .select()
      .single();
    
    if(error){
      toast('Failed to create submission: ' + error.message, 'error');
      return;
    }
    
    currentSubmission = newSub;
  } else {
    currentSubmission = submissions[0];
  }
  
  // Render form
  renderSections();
  
  // Populate with existing data
  if(currentSubmission.submission_data){
    populateForm(currentSubmission.submission_data);
  }
  
  // Load photos
  const {data: photos} = await supa.from('submission_photos')
    .select('*')
    .eq('submission_id', currentSubmission.id);
  
  if(photos){
    photos.forEach(photo => {
      const preview = document.getElementById(`preview-${photo.section_name}`);
      if(preview){
        const div = document.createElement('div');
        div.className = 'photo-item';
        div.innerHTML = `
          <img src="${photo.photo_url}" alt="Uploaded photo">
          <button class="photo-remove" onclick="removePhoto('${photo.photo_url.split('/').pop()}', this.parentElement)">×</button>
        `;
        preview.appendChild(div);
      }
    });
  }
  
  // Update submit button if already submitted
  if(currentSubmission.status === 'submitted'){
    document.getElementById('submit-btn').textContent = '✓ Submitted';
    document.getElementById('submit-btn').classList.add('btn-secondary');
    document.getElementById('submit-btn').classList.remove('btn-success');
    toast('This project has been submitted. You can still make changes.', 'success');
  }
})();

// Download booklet PDF
function downloadBooklet(){
  if(!currentProject || !currentProject.booklet_pdf_url){
    toast('Booklet not available', 'error');
    return;
  }
  window.open(currentProject.booklet_pdf_url, '_blank');
}
