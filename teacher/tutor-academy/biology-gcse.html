<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biology GCSE Tutor Pathway — Inspire Tutor Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/app-shared.css">
<link rel="stylesheet" href="/assets/css/tutor-academy.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--navy); color: var(--white); min-height: 100vh; font-size: 15px; line-height: 1.6; }
  .auth-loading { position: fixed; inset: 0; background: var(--navy); display: flex; align-items: center; justify-content: center; z-index: 999; flex-direction: column; gap: 16px; }
  .auth-loading-logo { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--gold); }
  .auth-loading-sub { font-size: 13px; color: var(--muted); font-family: var(--font-mono); }
  .topbar { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: rgba(11,22,40,0.95); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 16px; z-index: 100; backdrop-filter: blur(8px); }
  .topbar-logo { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--gold); letter-spacing: 0.02em; text-decoration: none; }
  .topbar-divider { width: 1px; height: 20px; background: var(--border); }
  .topbar-title { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .btn-ghost { background: none; border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; border-radius: 7px; font-family: var(--font-body); font-size: 13px; cursor: pointer; }
  .btn-ghost:hover { border-color: var(--muted); color: var(--white); }

  .wrap { max-width: 720px; margin: 0 auto; padding: 96px 20px 64px; }
  .path-head { text-align: center; margin-bottom: 2rem; }
  .path-head h1 { font-family: var(--font-display); font-size: 1.7rem; margin-bottom: .5rem; }
  .path-head p { color: var(--muted); font-size: .9rem; }
  .overall-progress { margin: 1.2rem auto 0; max-width: 340px; }

  .stage-list { display: flex; flex-direction: column; gap: .9rem; }
</style>
</head>
<body>

<div class="auth-loading" id="authLoading">
  <div class="auth-loading-logo">Inspire</div>
  <div class="auth-loading-sub">Verifying access...</div>
</div>

<header class="topbar">
  <a href="/teacher/teacher.html" class="topbar-logo">Inspire</a>
  <div class="topbar-divider"></div>
  <span class="topbar-title">Tutor Academy</span>
  <div class="topbar-right">
    <span class="topbar-user" id="topbar-user"></span>
    <button class="btn-ghost" onclick="window.location.href='/teacher/tutor-academy/index.html'">← Academy home</button>
  </div>
</header>

<div class="wrap">
  <div class="path-head">
    <h1>GCSE Biology Tutor Pathway</h1>
    <p id="cert-status"></p>
    <div class="overall-progress" id="overall-progress"></div>
  </div>

  <div class="stage-list" id="stage-list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
<script src="/assets/js/tutor-academy-ui.js"></script>
<script src="/assets/js/tutor-academy-biology-content.js"></script>
<script>
const SUPABASE_URL      = 'https://ygtsrdwoikqnrbexjrtl.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_XxmrO4J18iyQ1Srub73BhQ_FBhd8mXR'
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

const PROGRAMME_ID = 'biology-gcse'
const STAGE_IDS = ['biology-gcse-stage-1', 'biology-gcse-stage-2', 'biology-gcse-stage-3', 'biology-gcse-stage-4']

function sectionsForStage(stageId) {
  const c = window.TutorAcademyContent[stageId]
  if (!c || c.comingSoon) return []
  return (c.sections || []).map(s => s.id)
}

async function checkAuth() {
  const { data: { session } } = await supa.auth.getSession()
  if (!session) { window.location.href = '/index.html'; return null }
  const { data: profile, error } = await supa.from('profiles').select('role, full_name').eq('id', session.user.id).single()
  if (error || !profile || !['teacher','admin'].includes(profile.role)) {
    window.location.href = '/dashboard.html'
    return null
  }
  if (profile.full_name) document.getElementById('topbar-user').textContent = profile.full_name
  document.getElementById('authLoading').style.display = 'none'
  return session
}

async function ensureEnrolled(session) {
  const { data: existing } = await supa.from('tutor_academy_enrollments')
    .select('*').eq('profile_id', session.user.id).eq('programme_id', PROGRAMME_ID).maybeSingle()
  if (existing) return existing
  await fetch('/api/v1/tutor-academy/enroll', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
    body: JSON.stringify({ programmeId: PROGRAMME_ID, firstStageId: STAGE_IDS[0] })
  })
  const { data: created } = await supa.from('tutor_academy_enrollments')
    .select('*').eq('profile_id', session.user.id).eq('programme_id', PROGRAMME_ID).maybeSingle()
  return created
}

async function loadPathway(session) {
  const enrollment = await ensureEnrolled(session)
  const { data: progressRows } = await supa.from('tutor_academy_progress')
    .select('stage_id, section_id, status').eq('profile_id', session.user.id)

  const completeByStage = {}
  ;(progressRows || []).forEach(r => {
    if (r.status !== 'complete') return
    completeByStage[r.stage_id] = (completeByStage[r.stage_id] || new Set())
    completeByStage[r.stage_id].add(r.section_id)
  })

  document.getElementById('cert-status').innerHTML = window.TutorAcademyUI.renderCertificationStatus(enrollment ? enrollment.status : 'in_training')

  let totalSections = 0, totalComplete = 0
  let firstIncompleteIdx = 0
  const stagePcts = STAGE_IDS.map((stageId, idx) => {
    const secs = sectionsForStage(stageId)
    const done = completeByStage[stageId] ? secs.filter(s => completeByStage[stageId].has(s)).length : 0
    totalSections += secs.length || 1
    totalComplete += done
    const pct = secs.length ? Math.round((done / secs.length) * 100) : 0
    if (pct === 100 && idx === firstIncompleteIdx) firstIncompleteIdx = idx + 1
    return pct
  })

  document.getElementById('overall-progress').innerHTML = window.TutorAcademyUI.renderProgressBar(
    totalSections ? Math.round((totalComplete / totalSections) * 100) : 0, { showLabel: true }
  )

  document.getElementById('stage-list').innerHTML = STAGE_IDS.map((stageId, idx) => {
    const content = window.TutorAcademyContent[stageId]
    const pct = stagePcts[idx]
    let status
    if (idx > firstIncompleteIdx) status = 'locked'
    else if (pct === 100) status = 'complete'
    else status = 'active'
    if (content && content.comingSoon) status = idx <= firstIncompleteIdx ? status : 'locked'
    return window.TutorAcademyUI.renderStageCard(stageId, status, pct)
  }).join('')
}

;(async () => {
  const session = await checkAuth()
  if (session) loadPathway(session)
})()
</script>
</body>
</html>
