<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage 1 — Entry Diagnostic & Week 1 — Inspire Tutor Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/app-shared.css">
<link rel="stylesheet" href="/assets/css/tutor-academy.css?v=20260831">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--navy); color: var(--white); min-height: 100vh; font-size: 15px; line-height: 1.6; }
  .auth-loading { position: fixed; inset: 0; background: var(--navy); display: flex; align-items: center; justify-content: center; z-index: 999; flex-direction: column; gap: 16px; }
  .auth-loading-logo { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--gold); }
  .auth-loading-sub { font-size: 13px; color: var(--muted); font-family: var(--font-mono); }
  .topbar { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: rgba(11,22,40,0.95); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 16px; z-index: 100; backdrop-filter: blur(8px); }
  .topbar-logo { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--gold); letter-spacing: 0.02em; text-decoration: none; }
  .topbar-divider { width: 1px; height: 20px; background: var(--border); }
  .topbar-title { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .btn-ghost { background: none; border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; border-radius: 7px; font-family: var(--font-body); font-size: 13px; cursor: pointer; }
  .btn-ghost:hover { border-color: var(--muted); color: var(--white); }

  .ta-stage-head { margin-bottom: 1.2rem; }
  .ta-stage-head h1 { font-family: var(--font-display); font-size: 1.6rem; margin-bottom: .3rem; }
  .ta-stage-head .ta-sub { color: var(--muted); font-size: .9rem; }
  .ta-download-link { display: inline-flex; align-items: center; gap: .35rem; margin-top: .6rem; font-size: .82rem; color: var(--gold); text-decoration: none; }
  .ta-save-note { font-size: .78rem; color: var(--muted); margin-top: .5rem; font-family: var(--font-mono); min-height: 1.1em; }
</style>
</head>
<body>

<div class="auth-loading" id="authLoading">
  <div class="auth-loading-logo">Inspire</div>
  <div class="auth-loading-sub">Verifying access...</div>
</div>

<header class="topbar">
  <a href="/teacher/teacher.html" class="topbar-logo">Inspire</a>
  <div class="topbar-divider"></div>
  <span class="topbar-title">Tutor Academy</span>
  <div class="topbar-right">
    <span class="topbar-user" id="topbar-user"></span>
    <button class="btn-ghost" onclick="window.location.href='/teacher/tutor-academy/biology-gcse.html'">← Pathway</button>
  </div>
</header>

<div class="ta-shell">
  <div class="ta-stage-head">
    <h1 id="stageTitle"></h1>
    <div class="ta-sub" id="stageSubtitle"></div>
    <a class="ta-download-link" href="/resources/tutor-academy/biology-gcse/01_IBTAEP_Pack_01_Entry_Diagnostic_and_Week_1.docx" target="_blank" rel="noopener">⬇ Download original workbook (Pack 01)</a>
  </div>

  <div class="ta-section-nav-wrap">
    <div class="ta-section-nav-label"><span>Stage sections</span><span class="ta-section-nav-hint">Swipe to explore →</span></div>
    <nav class="ta-section-nav" id="sectionNav" aria-label="Stage 1 sections"></nav>
  </div>
  <div id="panels"></div>
  <div class="ta-nav-buttons">
    <button class="btn btn-outline" id="prevBtn" onclick="goStep(-1)">← Previous</button>
    <button class="btn btn-gold" id="nextBtn" onclick="completeAndAdvance()">Mark complete &amp; continue →</button>
  </div>
  <p class="ta-section-note">Completing a section records your progress; it does not constitute assessor approval.</p>
  <div class="ta-validation-summary" id="validationSummary" role="alert"></div>
  <div class="ta-save-note" id="saveNote" role="status" aria-live="polite"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
<script src="/assets/js/tutor-academy-ui.js?v=20260831"></script>
<script src="/assets/js/tutor-academy-biology-content.js?v=20260831"></script>
<script>
const SUPABASE_URL      = 'https://ygtsrdwoikqnrbexjrtl.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_XxmrO4J18iyQ1Srub73BhQ_FBhd8mXR'
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

const STAGE_ID = 'biology-gcse-stage-1'
const PROGRAMME_ID = 'biology-gcse'
const STAGE_CONTENT = window.TutorAcademyContent[STAGE_ID]
const U = window.TutorAcademyUI

let session = null
let currentIdx = 0
let completedSections = new Set()
const draftKey = sid => `ia-tutor-academy-draft-${STAGE_ID}-${sid}`

function escHtml(s) { return U.escHtml(s) }

function loadDraft(sectionId) {
  try { return JSON.parse(localStorage.getItem(draftKey(sectionId)) || '{}') } catch (e) { return {} }
}
function saveDraft(sectionId, data) {
  try { localStorage.setItem(draftKey(sectionId), JSON.stringify(data)) } catch (e) {}
}

function renderSectionBody(section) {
  const draft = loadDraft(section.id)
  switch (section.type) {
    case 'orientation':
      return `
        <p class="ta-lede">${escHtml(section.intro)}</p>
        <div class="ta-group-heading">Non-negotiable competencies</div>
        <ul style="margin-left:1.2rem;color:var(--muted);font-size:.88rem;line-height:1.8;">
          ${section.competencies.map(c => `<li>${escHtml(c)}</li>`).join('')}
        </ul>
        <div class="ta-group-heading">Candidate integrity declaration</div>
        <p style="color:var(--muted);font-size:.88rem;margin-bottom:.8rem;">${escHtml(section.declaration)}</p>
        <label style="display:flex;align-items:center;gap:.6rem;font-size:.88rem;">
          <input type="checkbox" class="ta-evidence-check" id="ta-declare-check" ${draft.declared ? 'checked' : ''} onchange="onOrientationDeclare(this.checked)">
          I confirm I have read and agree to this.
        </label>`

    case 'diagnostic':
      return `
        <p class="ta-lede">${escHtml(section.instructions)} <strong>Total: ${section.totalMarks} marks.</strong></p>
        ${section.groups.map(g => `
          <div class="ta-group-heading">${escHtml(g.heading)}</div>
          ${g.questions.map(q => `
            <div class="ta-q-block">
              <div class="ta-q-head">
                <span class="ta-q-text">${escHtml(q.text)}</span>
                <span class="ta-q-marks">[${q.marks} mark${q.marks !== 1 ? 's' : ''}]</span>
              </div>
              <textarea class="ta-q-answer" data-key="${q.id}" oninput="onFieldInput('${section.id}','${q.id}', this.value)">${escHtml(draft[q.id] || '')}</textarea>
            </div>`).join('')}
        `).join('')}`

    case 'boundary':
      return `
        <p class="ta-lede">${escHtml(section.instructions)}</p>
        ${section.statements.map((s, i) => `
          <div class="ta-boundary-row">
            <span class="ta-boundary-text">${i + 1}. ${escHtml(s)}</span>
            <select class="ta-boundary-select" data-key="s${i+1}" onchange="onFieldInput('${section.id}','s${i+1}', this.value)">
              <option value="">—</option>
              ${['C','B','A','H','O'].map(v => `<option value="${v}" ${draft['s'+(i+1)] === v ? 'selected' : ''}>${v}</option>`).join('')}
            </select>
          </div>`).join('')}`

    case 'calibration':
      return `
        <p class="ta-lede">${escHtml(section.instructions)}</p>
        <div class="ta-group-heading">Mini mark-scheme principles</div>
        <ul style="margin-left:1.2rem;color:var(--muted);font-size:.85rem;line-height:1.7;margin-bottom:1.2rem;">
          ${section.principles.map(p => `<li>${escHtml(p)}</li>`).join('')}
        </ul>
        ${section.items.map(it => `
          <div class="ta-q-block">
            <div class="ta-q-head">
              <span class="ta-q-text"><strong>${it.id.toUpperCase()}.</strong> ${escHtml(it.question)}</span>
              <span class="ta-q-marks">[${it.maxMarks}]</span>
            </div>
            <p style="font-size:.85rem;color:var(--muted);font-style:italic;margin-bottom:.6rem;">Student response: ${escHtml(it.response)}</p>
            <div style="display:flex;gap:.7rem;align-items:center;margin-bottom:.5rem;">
              <label style="font-size:.82rem;color:var(--muted);">Your mark:</label>
              <input type="text" class="ta-evidence-input" style="width:90px;" data-key="${it.id}-mark" placeholder="_/${it.maxMarks}" value="${escHtml(draft[it.id+'-mark'] || '')}" oninput="onFieldInput('${section.id}','${it.id}-mark', this.value)">
            </div>
            <textarea class="ta-q-answer" placeholder="Rationale" data-key="${it.id}-rationale" oninput="onFieldInput('${section.id}','${it.id}-rationale', this.value)">${escHtml(draft[it.id+'-rationale'] || '')}</textarea>
          </div>`).join('')}`

    case 'audition':
      return `
        <p class="ta-lede">${escHtml(section.purpose)}</p>
        ${section.lessons.map((l, li) => `
          <div class="ta-group-heading">${escHtml(l.label)}</div>
          <p style="font-size:.88rem;color:var(--muted);margin-bottom:.6rem;">${escHtml(l.brief)}</p>
          <ul style="margin-left:1.2rem;color:var(--muted);font-size:.85rem;line-height:1.7;margin-bottom:.8rem;">
            ${l.requirements.map(r => `<li>${escHtml(r)}</li>`).join('')}
          </ul>
          <input type="text" class="ta-evidence-input" placeholder="Recording link" data-key="lesson${li}-link" value="${escHtml(draft['lesson'+li+'-link'] || '')}" oninput="onFieldInput('${section.id}','lesson${li}-link', this.value)" style="margin-bottom:1rem;">
        `).join('')}
        <div class="ta-group-heading">Reflection</div>
        ${section.reflectionPrompts.map((p, pi) => `
          <div class="ta-q-block">
            <div class="ta-q-text" style="margin-bottom:.5rem;">${escHtml(p)}</div>
            <textarea class="ta-q-answer" data-key="reflect${pi}" oninput="onFieldInput('${section.id}','reflect${pi}', this.value)">${escHtml(draft['reflect'+pi] || '')}</textarea>
          </div>`).join('')}`

    case 'programme':
      return `
        <p class="ta-lede">${escHtml(section.outcome)}</p>
        ${section.sessions.map(s => `
          <div class="ta-session-card">
            <div class="ta-session-title">Session ${s.number} — ${escHtml(s.title)}</div>
            <div class="ta-session-time">${escHtml(s.time)}</div>
            <ul class="ta-session-list">${s.outcomes.map(o => `<li>${escHtml(o)}</li>`).join('')}</ul>
            <div style="margin-top:.6rem;font-size:.85rem;"><strong style="color:var(--gold);">Task:</strong> <span style="color:var(--muted);">${escHtml(s.task)}</span></div>
          </div>`).join('')}`

    case 'evidence':
      return `
        ${section.items.map(it => `
          <div class="ta-evidence-row">
            <input type="checkbox" class="ta-evidence-check" data-key="${it.key}-done" ${draft[it.key+'-done'] ? 'checked' : ''} onchange="onFieldInput('${section.id}','${it.key}-done', this.checked)">
            <div style="flex:1;">
              <div class="ta-evidence-label">${escHtml(it.label)}</div>
              <div class="ta-evidence-desc">${escHtml(it.desc)}</div>
              <input type="text" class="ta-evidence-input" placeholder="Link or notes" data-key="${it.key}-link" value="${escHtml(draft[it.key+'-link'] || '')}" oninput="onFieldInput('${section.id}','${it.key}-link', this.value)">
            </div>
          </div>`).join('')}`

    case 'gate-info':
      return `
        <div class="ta-group-heading">Competency domains assessed</div>
        <ul style="margin-left:1.2rem;color:var(--muted);font-size:.88rem;line-height:1.8;margin-bottom:1rem;">
          ${section.domains.map(d => `<li>${escHtml(d)}</li>`).join('')}
        </ul>
        <div class="ta-group-heading">Traffic-light rules</div>
        ${section.trafficLightRules.map(r => `<p style="font-size:.88rem;color:var(--muted);margin-bottom:.5rem;"><strong style="color:var(--white);">${r.level}:</strong> ${escHtml(r.desc)}</p>`).join('')}
        <div class="note-box" style="background:var(--navy);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:14px 18px;font-size:13px;color:var(--muted);margin-top:1.2rem;">${escHtml(section.gateNote)}</div>`

    default:
      return '<p style="color:var(--muted);">Content coming soon.</p>'
  }
}

function onOrientationDeclare(checked) {
  const s = STAGE_CONTENT.sections[currentIdx]
  const draft = loadDraft(s.id)
  draft.declared = checked
  saveDraft(s.id, draft)
  showSaveState(`Saved on this device at ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}.`, 'success')
}

let pendingSave = null
function showSaveState(message, tone) {
  const note = document.getElementById('saveNote')
  note.textContent = message
  note.className = `ta-save-note ${tone ? `ta-save-${tone}` : ''}`
}
function onFieldInput(sectionId, key, value) {
  const draft = loadDraft(sectionId)
  draft[key] = value
  saveDraft(sectionId, draft)
  showSaveState(`Saved on this device at ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}.`, 'success')
  clearTimeout(pendingSave)
}

function renderNav() {
  document.getElementById('sectionNav').innerHTML = STAGE_CONTENT.sections.map((s, i) => `
    <button type="button" class="ta-section-nav-item ${i === currentIdx ? 'ta-active' : ''} ${completedSections.has(s.id) ? 'ta-done' : ''}" ${i === currentIdx ? 'aria-current="step"' : ''} onclick="goToStep(${i})">
      ${i + 1}. ${escHtml(s.title.replace(/^Part [A-Z] — /, ''))}
    </button>`).join('')
  document.querySelector('.ta-section-nav-item.ta-active')?.scrollIntoView({ block: 'nearest', inline: 'center' })
}

function renderCurrentPanel() {
  const s = STAGE_CONTENT.sections[currentIdx]
  document.getElementById('panels').innerHTML = `
    <section class="ta-panel ta-active" aria-labelledby="currentSectionTitle">
      <h2 id="currentSectionTitle" tabindex="-1">${escHtml(s.title)}</h2>
      ${renderSectionBody(s)}
    </section>`
  document.getElementById('prevBtn').hidden = currentIdx === 0
  const isLast = currentIdx === STAGE_CONTENT.sections.length - 1
  document.getElementById('nextBtn').textContent = isLast
    ? (completedSections.has(s.id) ? 'Completed — back to pathway' : 'Mark complete & finish')
    : 'Mark complete & continue →'
  renderNav()
  U.enhanceStagePanel(document.querySelector('.ta-panel'), s.title)
  document.getElementById('validationSummary').classList.remove('ta-visible')
}

function goToStep(i) { currentIdx = i; renderCurrentPanel(); document.getElementById('currentSectionTitle')?.focus(); window.scrollTo({ top: 56, behavior: 'smooth' }) }
function goStep(delta) { goToStep(Math.max(0, Math.min(STAGE_CONTENT.sections.length - 1, currentIdx + delta))) }

async function completeAndAdvance() {
  const s = STAGE_CONTENT.sections[currentIdx]
  const draft = loadDraft(s.id)
  const validation = completedSections.has(s.id) ? { valid: true, missing: [] } : U.validateStagePanel(document.querySelector('.ta-panel'))
  const summary = document.getElementById('validationSummary')
  if (!validation.valid) {
    summary.textContent = `Complete ${validation.missing.length} required field${validation.missing.length === 1 ? '' : 's'} before marking this section complete.`
    summary.classList.add('ta-visible')
    validation.missing[0].focus()
    return
  }
  summary.classList.remove('ta-visible')

  showSaveState('Saving to your Academy…')
  try {
    if (Object.keys(draft).length) {
      const evidenceResponse = await fetch('/api/v1/tutor-academy/evidence', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ stageId: STAGE_ID, evidenceType: s.type, evidenceKey: s.id, content: JSON.stringify(draft) })
      })
      if (!evidenceResponse.ok) throw new Error((await evidenceResponse.json()).error?.message || 'Could not save your evidence.')
    }
    const progressResponse = await fetch('/api/v1/tutor-academy/progress', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ stageId: STAGE_ID, sectionId: s.id, status: 'complete' })
    })
    if (!progressResponse.ok) throw new Error((await progressResponse.json()).error?.message || 'Could not save your progress.')
  } catch (error) {
    showSaveState(error.message || 'Your progress could not be saved. Please try again.', 'error')
    return
  }

  completedSections.add(s.id)
  showSaveState(`Saved to your Academy at ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}.`, 'success')

  if (currentIdx === STAGE_CONTENT.sections.length - 1) {
    window.location.href = '/teacher/tutor-academy/biology-gcse.html'
    return
  }
  goStep(1)
}

async function checkAuth() {
  const { data: { session: s } } = await supa.auth.getSession()
  if (!s) { window.location.href = '/index.html'; return null }
  const { data: profile, error } = await supa.from('profiles').select('role, full_name').eq('id', s.user.id).single()
  if (error || !profile || !['teacher','teacher_manager','admin','super_admin'].includes(profile.role)) {
    window.location.href = '/dashboard.html'
    return null
  }
  const allowed = await U.tutorCanAccessStage(supa, s.user.id, STAGE_ID, profile.role)
  if (!allowed) {
    window.location.replace('/teacher/tutor-academy/biology-gcse.html?locked=' + encodeURIComponent(STAGE_ID))
    return null
  }
  if (profile.full_name) document.getElementById('topbar-user').textContent = profile.full_name
  document.getElementById('authLoading').style.display = 'none'
  return s
}

async function loadProgress() {
  const { data: rows } = await supa.from('tutor_academy_progress')
    .select('section_id, status').eq('profile_id', session.user.id).eq('stage_id', STAGE_ID)
  ;(rows || []).forEach(r => { if (r.status === 'complete') completedSections.add(r.section_id) })
}

;(async () => {
  session = await checkAuth()
  if (!session) return
  if (!STAGE_CONTENT || !Array.isArray(STAGE_CONTENT.sections) || !STAGE_CONTENT.sections.length) {
    document.getElementById('panels').innerHTML = '<div class="ta-panel ta-active"><h2>Content unavailable</h2><p style="color:var(--muted);">This stage\'s content didn\'t load correctly. Please refresh the page — if this keeps happening, let us know.</p></div>'
    document.getElementById('nextBtn').style.display = 'none'
    document.getElementById('prevBtn').style.display = 'none'
    return
  }
  document.getElementById('stageTitle').textContent = 'Stage 1 — ' + STAGE_CONTENT.title
  document.getElementById('stageSubtitle').textContent = STAGE_CONTENT.subtitle + ' — ' + STAGE_CONTENT.overview
  await loadProgress()
  renderCurrentPanel()
})()
</script>
</body>
</html>
