<!DOCTYPE html>
<html lang="en">
<head>

<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--navy); color: var(--white); min-height: 100vh; font-size: 15px; line-height: 1.6; }
  .auth-loading { position: fixed; inset: 0; background: var(--navy); display: flex; align-items: center; justify-content: center; z-index: 999; flex-direction: column; gap: 16px; }
  .auth-loading-logo { font-family: var(--font-display); font-size: 28px; font-weight: 700; color: var(--gold); }
  .auth-loading-sub { font-size: 13px; color: var(--muted); font-family: var(--font-mono); }
  .topbar { position: fixed; top: 0; left: 0; right: 0; height: 56px; background: rgba(11,22,40,0.95); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 16px; z-index: 100; backdrop-filter: blur(8px); }
  .topbar-logo { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--gold); letter-spacing: 0.02em; text-decoration: none; }
  .topbar-divider { width: 1px; height: 20px; background: var(--border); }
  .topbar-title { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .btn-ghost { background: none; border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; border-radius: 7px; font-family: var(--font-body); font-size: 13px; cursor: pointer; }
  .btn-ghost:hover { border-color: var(--muted); color: var(--white); }

  .ta-stage-head { margin-bottom: 1.2rem; }
  .ta-stage-head h1 { font-family: var(--font-display); font-size: 1.6rem; margin-bottom: .3rem; }
  .ta-stage-head .ta-sub { color: var(--muted); font-size: .9rem; }
  .ta-download-link { display: inline-flex; align-items: center; gap: .35rem; margin-top: .6rem; font-size: .82rem; color: var(--gold); text-decoration: none; }
  .ta-save-note { font-size: .78rem; color: var(--muted); margin-top: .5rem; font-family: var(--font-mono); min-height: 1.1em; }
  .ta-lens-table, .ta-mini-table { width: 100%; border-collapse: collapse; font-size: .85rem; margin-bottom: 1.2rem; }
  .ta-lens-table th, .ta-lens-table td, .ta-mini-table th, .ta-mini-table td { padding: .5rem .6rem; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  .ta-lens-table th, .ta-mini-table th { color: var(--gold); font-family: var(--font-mono); font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; }
  .ta-command-card { background: var(--navy); border: 1px solid var(--border); border-radius: 10px; padding: .9rem 1rem; margin-bottom: .7rem; }
  .ta-command-word { font-weight: 700; color: var(--gold); margin-bottom: .3rem; }
  .ta-command-meaning { font-size: .87rem; margin-bottom: .3rem; }
  .ta-command-fail { font-size: .8rem; color: var(--muted); font-style: italic; }
</style>
</head>
<body>

<div class="auth-loading" id="authLoading">
  <div class="auth-loading-logo">Inspire</div>
  <div class="auth-loading-sub">Verifying access...</div>
</div>

<header class="topbar">
  <a href="/teacher/teacher.html" class="topbar-logo">Inspire</a>
  <div class="topbar-divider"></div>
  <span class="topbar-title">Tutor Academy</span>
  <div class="topbar-right">
    <span class="topbar-user" id="topbar-user"></span>
    <button class="btn-ghost" onclick="window.location.href='/teacher/tutor-academy/biology-gcse.html'">← Pathway</button>
  </div>
</header>

<div class="ta-shell">
  <div class="ta-stage-head">
    <h1 id="stageTitle"></h1>
    <div class="ta-sub" id="stageSubtitle"></div>
    <a class="ta-download-link" href="/resources/tutor-academy/biology-gcse/03_IBTAEP_Pack_03_GCSE_Examiner_School.docx" target="_blank" rel="noopener">⬇ Download original workbook (Pack 03)</a>
  </div>

  <div class="ta-section-nav" id="sectionNav"></div>
  <div id="panels"></div>
  <div class="ta-nav-buttons">
    <button class="btn btn-outline" id="prevBtn" onclick="goStep(-1)">← Previous</button>
    <button class="btn btn-gold" id="nextBtn" onclick="completeAndAdvance()">Mark complete &amp; continue →</button>
  </div>
  <div class="ta-save-note" id="saveNote"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
<script src="/assets/js/tutor-academy-ui.js"></script>
<script src="/assets/js/tutor-academy-biology-content.js"></script>
<script>
const SUPABASE_URL      = 'https://ygtsrdwoikqnrbexjrtl.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_XxmrO4J18iyQ1Srub73BhQ_FBhd8mXR'
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

const STAGE_ID = 'biology-gcse-stage-3'
const STAGE_CONTENT = window.TutorAcademyContent[STAGE_ID]
const U = window.TutorAcademyUI

let session = null
let currentIdx = 0
let completedSections = new Set()
const draftKey = sid => `ia-tutor-academy-draft-${STAGE_ID}-${sid}`

function escHtml(s) { return U.escHtml(s) }
function loadDraft(sectionId) { try { return JSON.parse(localStorage.getItem(draftKey(sectionId)) || '{}') } catch (e) { return {} } }
function saveDraft(sectionId, data) { try { localStorage.setItem(draftKey(sectionId), JSON.stringify(data)) } catch (e) {} }

function qBlock(section, id, marks, text, draft) {
  return `
    <div class="ta-q-block">
      <div class="ta-q-head"><span class="ta-q-text">${escHtml(text)}</span>${marks ? `<span class="ta-q-marks">[${marks}]</span>` : ''}</div>
      <textarea class="ta-q-answer" data-key="${id}" oninput="onFieldInput('${section.id}','${id}', this.value)">${escHtml(draft[id] || '')}</textarea>
    </div>`
}

function renderSectionBody(section) {
  const draft = loadDraft(section.id)
  switch (section.type) {
    case 'four-lens':
      return `
        <div class="note-box" style="background:var(--navy);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:14px 18px;font-size:13px;color:var(--muted);margin-bottom:1.2rem;">${escHtml(section.mantra)}</div>
        <div style="overflow-x:auto;"><table class="ta-lens-table"><thead><tr><th>Lens</th><th>Question</th><th>Tutor action</th></tr></thead><tbody>
          ${section.lenses.map(l => `<tr><td style="color:var(--gold);font-weight:700;">${escHtml(l.lens)}</td><td>${escHtml(l.question)}</td><td>${escHtml(l.action)}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="ta-group-heading">Worked example</div>
        <p style="font-size:.87rem;color:var(--muted);margin-bottom:1rem;">${escHtml(section.workedExample)}</p>
        ${qBlock(section, 'task', null, section.task, draft)}`

    case 'command-words':
      return `
        <p class="ta-lede">${escHtml(section.intro)}</p>
        ${section.commands.map(c => `
          <div class="ta-command-card">
            <div class="ta-command-word">${escHtml(c.word)}</div>
            <div class="ta-command-meaning">${escHtml(c.meaning)}</div>
            <div class="ta-command-fail">Typical failure: ${escHtml(c.failure)}</div>
          </div>`).join('')}
        <div class="ta-group-heading">Command-switch drill</div>
        <p style="font-size:.85rem;color:var(--muted);margin-bottom:.8rem;">For each stem, explain how the answer must change when the command word changes.</p>
        ${section.drill.map(d => qBlock(section, d.id, null, `${escHtml(d.stem)} — Commands: ${escHtml(d.commands)}`, draft)).join('')}`

    case 'ao-thinking':
      return `
        <p class="ta-lede">${escHtml(section.intro)}</p>
        <div style="overflow-x:auto;"><table class="ta-lens-table"><thead><tr><th>AO</th><th>Shorthand</th><th>What the student is doing</th></tr></thead><tbody>
          ${section.aos.map(a => `<tr><td style="color:var(--gold);font-weight:700;">${escHtml(a.ao)}</td><td>${escHtml(a.shorthand)}</td><td>${escHtml(a.desc)}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="note-box" style="background:var(--navy);border:1px solid var(--border);border-left:3px solid var(--orange);border-radius:0 10px 10px 0;padding:14px 18px;font-size:13px;color:var(--muted);margin-bottom:1.2rem;">${escHtml(section.warning)}</div>
        <div class="ta-group-heading">AO Classification Drill (20 items)</div>
        ${section.drillItems.map((item, i) => `
          <div class="ta-boundary-row">
            <span class="ta-boundary-text">${i+1}. ${escHtml(item)}</span>
            <select class="ta-boundary-select" data-key="ao${i}" onchange="onFieldInput('${section.id}','ao${i}', this.value)">
              <option value="">—</option>
              ${['AO1','AO2','AO3'].map(v => `<option value="${v}" ${draft['ao'+i] === v ? 'selected' : ''}>${v}</option>`).join('')}
            </select>
          </div>`).join('')}`

    case 'question-lab':
      return `
        <p class="ta-lede">${escHtml(section.instructions)}</p>
        ${section.questions.map(q => qBlock(section, q.id, q.marks, q.text, draft)).join('')}`

    case 'suggest-clinic':
      return `
        <p class="ta-lede">${escHtml(section.intro)}</p>
        <div class="ta-group-heading">The SCOPE protocol</div>
        <ul style="margin-left:1.2rem;color:var(--muted);font-size:.87rem;line-height:1.8;margin-bottom:1.2rem;">
          ${section.protocol.map(p => `<li><strong style="color:var(--white);">${escHtml(p.step)}</strong> — ${escHtml(p.prompt)}</li>`).join('')}
        </ul>
        ${section.questions.map(q => qBlock(section, q.id, q.marks, q.text, draft)).join('')}`

    case 'data-school':
      return `
        <p class="ta-lede">${escHtml(section.intro)}</p>
        <div class="ta-group-heading">The READ-DATA protocol</div>
        <ul style="margin-left:1.2rem;color:var(--muted);font-size:.85rem;line-height:1.7;margin-bottom:1.2rem;">
          ${section.protocol.map(p => `<li>${escHtml(p)}</li>`).join('')}
        </ul>
        ${section.datasets.map(ds => `
          <div class="ta-group-heading">${escHtml(ds.title)}</div>
          <div style="overflow-x:auto;"><table class="ta-mini-table">
            <thead><tr>${ds.table.headers.map(h => `<th>${escHtml(h)}</th>`).join('')}</tr></thead>
            <tbody>${ds.table.row ? `<tr>${ds.table.row.map(c => `<td>${escHtml(c)}</td>`).join('')}</tr>` : (ds.table.rows || []).map(r => `<tr>${r.map(c => `<td>${escHtml(c)}</td>`).join('')}</tr>`).join('')}</tbody>
          </table></div>
          ${ds.questions.map(q => qBlock(section, q.id, q.marks, q.text, draft)).join('')}
        `).join('')}`

    case 'extended-response':
      return `
        <p class="ta-lede">${escHtml(section.intro)}</p>
        <div class="ta-group-heading">The Inspire CHAIN method</div>
        <ul style="margin-left:1.2rem;color:var(--muted);font-size:.87rem;line-height:1.8;margin-bottom:1.2rem;">
          ${section.chain.map(c => `<li><strong style="color:var(--gold);">${escHtml(c.letter)} — ${escHtml(c.label)}:</strong> ${escHtml(c.meaning)}</li>`).join('')}
        </ul>
        <div class="ta-group-heading">Worked planning exercise</div>
        ${qBlock(section, section.worked.id, section.worked.marks, section.worked.text, draft)}
        <div class="ta-group-heading">Independent six-mark tasks</div>
        ${section.independent.map(q => qBlock(section, q.id, q.marks, q.text, draft)).join('')}`

    case 'calibration-lab':
      return `
        <div class="note-box" style="background:var(--navy);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:14px 18px;font-size:13px;color:var(--muted);margin-bottom:1.2rem;">${escHtml(section.rule)}</div>
        ${section.sets.map(set => `
          <div class="ta-group-heading">${escHtml(set.title)}</div>
          <p style="font-size:.87rem;margin-bottom:1rem;"><strong>Question:</strong> ${escHtml(set.question)} <span style="color:var(--gold);">[${set.maxMarks}]</span></p>
          ${set.students.map(s => `
            <div class="ta-q-block">
              <div style="font-weight:700;margin-bottom:.2rem;">Student ${s.id}</div>
              <p style="font-size:.85rem;color:var(--muted);font-style:italic;margin-bottom:.6rem;">${escHtml(s.text)}</p>
              <div style="display:flex;gap:.7rem;align-items:center;margin-bottom:.5rem;">
                <label style="font-size:.82rem;color:var(--muted);">Your mark:</label>
                <input type="text" class="ta-evidence-input" style="width:90px;" data-key="${set.title}-${s.id}-mark" placeholder="_/${set.maxMarks}" value="${escHtml(draft[set.title+'-'+s.id+'-mark'] || '')}" oninput="onFieldInput('${section.id}','${set.title}-${s.id}-mark', this.value)">
              </div>
              <textarea class="ta-q-answer" placeholder="Rationale" data-key="${set.title}-${s.id}-rationale" oninput="onFieldInput('${section.id}','${set.title}-${s.id}-rationale', this.value)">${escHtml(draft[set.title+'-'+s.id+'-rationale'] || '')}</textarea>
            </div>`).join('')}
        `).join('')}`

    case 'error-taxonomy':
      return `
        <p class="ta-lede">${escHtml(section.intro)}</p>
        ${U.renderErrorTaxonomy()}
        <div class="ta-group-heading" style="margin-top:1.2rem;">Diagnosis drill</div>
        ${section.drill.map(d => `
          <div class="ta-q-block">
            <div class="ta-q-text" style="margin-bottom:.5rem;">${escHtml(d.case)}</div>
            <div style="display:flex;gap:.8rem;flex-wrap:wrap;margin-bottom:.5rem;">
              <input type="text" class="ta-evidence-input" style="width:140px;" placeholder="Primary code" data-key="${d.id}-primary" value="${escHtml(draft[d.id+'-primary'] || '')}" oninput="onFieldInput('${section.id}','${d.id}-primary', this.value)">
              <input type="text" class="ta-evidence-input" style="width:140px;" placeholder="Secondary code" data-key="${d.id}-secondary" value="${escHtml(draft[d.id+'-secondary'] || '')}" oninput="onFieldInput('${section.id}','${d.id}-secondary', this.value)">
            </div>
            <textarea class="ta-q-answer" placeholder="Next intervention" data-key="${d.id}-intervention" oninput="onFieldInput('${section.id}','${d.id}-intervention', this.value)">${escHtml(draft[d.id+'-intervention'] || '')}</textarea>
          </div>`).join('')}`

    case '100-mark-lab':
      return `
        <p class="ta-lede">${escHtml(section.intro)}</p>
        <div class="ta-group-heading">For every question, record</div>
        <ul style="margin-left:1.2rem;color:var(--muted);font-size:.87rem;line-height:1.8;margin-bottom:1.2rem;">
          ${section.captureFields.map(f => `<li>${escHtml(f)}</li>`).join('')}
        </ul>
        <textarea class="ta-q-answer" style="min-height:160px;" placeholder="Your laboratory log — paste or summarise your worked question analyses here" data-key="log" oninput="onFieldInput('${section.id}','log', this.value)">${escHtml(draft.log || '')}</textarea>
        <div class="ta-group-heading">Reflection</div>
        ${qBlock(section, 'reflection', null, section.reflectionPrompt, draft)}`

    case 'microteaching':
      return `
        <p class="ta-lede">${escHtml(section.intro)}</p>
        <div style="overflow-x:auto;"><table class="ta-lens-table"><thead><tr><th>Minutes</th><th>Tutor action</th></tr></thead><tbody>
          ${section.structure.map(s => `<tr><td style="color:var(--gold);font-family:var(--font-mono);">${escHtml(s.minutes)}</td><td>${escHtml(s.action)}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="ta-group-heading">Choose one microteaching focus</div>
        <select class="ta-boundary-select" style="width:100%;padding:.6rem;" data-key="focus" onchange="onFieldInput('${section.id}','focus', this.value)">
          <option value="">— select —</option>
          ${section.focusOptions.map(o => `<option value="${escHtml(o)}" ${draft.focus === o ? 'selected' : ''}>${escHtml(o)}</option>`).join('')}
        </select>
        <div class="ta-group-heading">Lesson plan</div>
        ${section.planFields.map((f, i) => `
          <div class="ta-q-block">
            <div class="ta-q-text" style="margin-bottom:.4rem;">${escHtml(f)}</div>
            <textarea class="ta-q-answer" data-key="plan${i}" oninput="onFieldInput('${section.id}','plan${i}', this.value)">${escHtml(draft['plan'+i] || '')}</textarea>
          </div>`).join('')}`

    case 'formal-assessment':
      return `
        <p class="ta-lede">${escHtml(section.instructions)}</p>
        ${section.sections.map(sec => `
          <div class="ta-group-heading">${escHtml(sec.heading)}</div>
          ${sec.questions.map(q => qBlock(section, q.id, q.marks, q.text, draft)).join('')}
        `).join('')}`

    case 'self-evaluation':
      return `
        <div class="ta-group-heading">Rate yourself (1-5) on each competency</div>
        ${section.competencies.map((c, i) => `
          <div class="ta-boundary-row">
            <span class="ta-boundary-text">${escHtml(c)}</span>
            <select class="ta-boundary-select" data-key="rate${i}" onchange="onFieldInput('${section.id}','rate${i}', this.value)">
              <option value="">—</option>
              ${[1,2,3,4,5].map(v => `<option value="${v}" ${draft['rate'+i] == v ? 'selected' : ''}>${v}</option>`).join('')}
            </select>
          </div>`).join('')}
        <div class="ta-group-heading">Reflection</div>
        ${section.prompts.map((p, i) => qBlock(section, `prompt${i}`, null, p, draft)).join('')}`

    default:
      return '<p style="color:var(--muted);">Content coming soon.</p>'
  }
}

let pendingSave = null
function onFieldInput(sectionId, key, value) {
  const draft = loadDraft(sectionId)
  draft[key] = value
  saveDraft(sectionId, draft)
  document.getElementById('saveNote').textContent = 'Saved locally…'
  clearTimeout(pendingSave)
  pendingSave = setTimeout(() => { document.getElementById('saveNote').textContent = '' }, 1500)
}

function renderNav() {
  document.getElementById('sectionNav').innerHTML = STAGE_CONTENT.sections.map((s, i) => `
    <div class="ta-section-nav-item ${i === currentIdx ? 'ta-active' : ''} ${completedSections.has(s.id) ? 'ta-done' : ''}" onclick="goToStep(${i})">
      ${i + 1}. ${escHtml(s.title)}
    </div>`).join('')
}

function renderCurrentPanel() {
  const s = STAGE_CONTENT.sections[currentIdx]
  document.getElementById('panels').innerHTML = `
    <div class="ta-panel ta-active">
      <h2>${escHtml(s.title)}</h2>
      ${renderSectionBody(s)}
    </div>`
  document.getElementById('prevBtn').style.visibility = currentIdx === 0 ? 'hidden' : 'visible'
  const isLast = currentIdx === STAGE_CONTENT.sections.length - 1
  document.getElementById('nextBtn').textContent = isLast
    ? (completedSections.has(s.id) ? 'Completed — back to pathway' : 'Mark complete & finish')
    : 'Mark complete & continue →'
  renderNav()
}

function goToStep(i) { currentIdx = i; renderCurrentPanel(); window.scrollTo({ top: 0, behavior: 'smooth' }) }
function goStep(delta) { goToStep(Math.max(0, Math.min(STAGE_CONTENT.sections.length - 1, currentIdx + delta))) }

async function completeAndAdvance() {
  const s = STAGE_CONTENT.sections[currentIdx]
  const draft = loadDraft(s.id)

  document.getElementById('saveNote').textContent = 'Saving…'
  await fetch('/api/v1/tutor-academy/progress', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
    body: JSON.stringify({ stageId: STAGE_ID, sectionId: s.id, status: 'complete' })
  }).catch(() => {})

  if (Object.keys(draft).length) {
    await fetch('/api/v1/tutor-academy/evidence', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ stageId: STAGE_ID, evidenceType: s.type, evidenceKey: s.id, content: JSON.stringify(draft) })
    }).catch(() => {})
  }

  completedSections.add(s.id)
  document.getElementById('saveNote').textContent = 'Saved.'

  if (currentIdx === STAGE_CONTENT.sections.length - 1) {
    window.location.href = '/teacher/tutor-academy/biology-gcse.html'
    return
  }
  goStep(1)
}

async function checkAuth() {
  const { data: { session: s } } = await supa.auth.getSession()
  if (!s) { window.location.href = '/index.html'; return null }
  const { data: profile, error } = await supa.from('profiles').select('role, full_name').eq('id', s.user.id).single()
  if (error || !profile || !['teacher','admin'].includes(profile.role)) {
    window.location.href = '/dashboard.html'
    return null
  }
  if (profile.full_name) document.getElementById('topbar-user').textContent = profile.full_name
  document.getElementById('authLoading').style.display = 'none'
  return s
}

async function loadProgress() {
  const { data: rows } = await supa.from('tutor_academy_progress')
    .select('section_id, status').eq('profile_id', session.user.id).eq('stage_id', STAGE_ID)
  ;(rows || []).forEach(r => { if (r.status === 'complete') completedSections.add(r.section_id) })
}

;(async () => {
  session = await checkAuth()
  if (!session) return
  if (!STAGE_CONTENT || !Array.isArray(STAGE_CONTENT.sections) || !STAGE_CONTENT.sections.length) {
    document.getElementById('panels').innerHTML = '<div class="ta-panel ta-active"><h2>Content unavailable</h2><p style="color:var(--muted);">This stage\'s content didn\'t load correctly. Please refresh the page — if this keeps happening, let us know.</p></div>'
    document.getElementById('nextBtn').style.display = 'none'
    document.getElementById('prevBtn').style.display = 'none'
    return
  }
  document.getElementById('stageTitle').textContent = 'Stage 3 — ' + STAGE_CONTENT.title
  document.getElementById('stageSubtitle').textContent = STAGE_CONTENT.subtitle + ' — ' + STAGE_CONTENT.overview
  await loadProgress()
  renderCurrentPanel()
})()
</script>
</body>
</html>
