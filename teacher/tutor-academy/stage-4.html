const SUPABASE_URL      = 'https://ygtsrdwoikqnrbexjrtl.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_XxmrO4J18iyQ1Srub73BhQ_FBhd8mXR'
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

const STAGE_ID = 'biology-gcse-stage-4'
const STAGE_CONTENT = window.TutorAcademyContent[STAGE_ID]
const U = window.TutorAcademyUI

let session = null
let currentIdx = 0
let completedSections = new Set()
const draftKey = sid => `ia-tutor-academy-draft-${STAGE_ID}-${sid}`

function escHtml(s) { return U.escHtml(s) }
function loadDraft(sectionId) { try { return JSON.parse(localStorage.getItem(draftKey(sectionId)) || '{}') } catch (e) { return {} } }
function saveDraft(sectionId, data) { try { localStorage.setItem(draftKey(sectionId), JSON.stringify(data)) } catch (e) {} }

function qBlock(section, id, marks, text, draft) {
  return `
    <div class="ta-q-block">
      <div class="ta-q-head"><span class="ta-q-text">${escHtml(text)}</span>${marks ? `<span class="ta-q-marks">[${marks}]</span>` : ''}</div>
      <textarea class="ta-q-answer" data-key="${id}" oninput="onFieldInput('${section.id}','${id}', this.value)">${escHtml(draft[id] || '')}</textarea>
    </div>`
}

function renderSectionBody(section) {
  const draft = loadDraft(section.id)
  switch (section.type) {
    case 'six-lens':
      return `
        <p class="ta-lede">${escHtml(section.intro)}</p>
        <div style="overflow-x:auto;"><table class="ta-lens-table"><thead><tr><th>Lens</th><th>Tutor question</th></tr></thead><tbody>
          ${section.lenses.map(l => `<tr><td style="color:var(--gold);font-weight:700;">${escHtml(l.lens)}</td><td>${escHtml(l.question)}</td></tr>`).join('')}
        </tbody></table></div>
        ${qBlock(section, 'task', null, section.task, draft)}`

    case 'practicals-set':
      return `
        <div class="note-box" style="background:var(--navy);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:14px 18px;font-size:13px;color:var(--muted);margin-bottom:1.2rem;">${escHtml(section.note)}</div>
        ${section.practicals.map(rp => `
          <div class="ta-rp-card">
            <button class="ta-rp-head" onclick="this.parentElement.classList.toggle('ta-open')">
              <span>RP${rp.number} — ${escHtml(rp.title)}${rp.biologyOnly ? ' <span style="color:var(--orange);font-weight:400;font-size:.75rem;">(Biology only)</span>' : ''}</span>
              <span style="color:var(--muted);">▾</span>
            </button>
            <div class="ta-rp-body">
              <p style="font-size:.87rem;color:var(--muted);margin-bottom:.7rem;"><strong style="color:var(--white);">Core purpose:</strong> ${escHtml(rp.purpose)}</p>
              <p style="font-size:.85rem;color:var(--muted);margin-bottom:.5rem;"><strong style="color:var(--gold);">Maths/data link:</strong> ${escHtml(rp.mathsLink)}</p>
              <p style="font-size:.85rem;color:var(--muted);margin-bottom:.8rem;"><strong style="color:var(--orange);">Common traps:</strong> ${escHtml(rp.traps)}</p>
              <div style="font-size:.82rem;color:var(--muted);margin-bottom:.4rem;">Your candidate notes (independent/dependent variables, controls, apparatus, expected pattern, data processing, evaluation):</div>
              <textarea class="ta-q-answer" style="min-height:100px;margin-bottom:.7rem;" data-key="${rp.id}-notes" oninput="onFieldInput('${section.id}','${rp.id}-notes', this.value)">${escHtml(draft[rp.id+'-notes'] || '')}</textarea>
              <div style="font-size:.82rem;color:var(--muted);margin-bottom:.4rem;">Transfer challenge — write one unfamiliar-context question testing the same reasoning, without naming this practical, plus a concise mark-worthy answer:</div>
              <textarea class="ta-q-answer" data-key="${rp.id}-transfer" oninput="onFieldInput('${section.id}','${rp.id}-transfer', this.value)">${escHtml(draft[rp.id+'-transfer'] || '')}</textarea>
            </div>
          </div>`).join('')}`

    case 'design-clinic':
      return `
        <p class="ta-lede">${escHtml(section.intro)}</p>
        <div style="overflow-x:auto;"><table class="ta-lens-table"><thead><tr><th>Term</th><th>Working definition</th></tr></thead><tbody>
          ${section.terms.map(t => `<tr><td style="color:var(--gold);font-weight:700;">${escHtml(t.term)}</td><td>${escHtml(t.def)}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="ta-group-heading">Repair these designs</div>
        ${section.repairs.map(r => qBlock(section, r.id, null, r.text, draft)).join('')}`

    case 'evaluation-language':
      return `
        <p class="ta-lede">${escHtml(section.intro)}</p>
        <div style="overflow-x:auto;"><table class="ta-lens-table"><thead><tr><th>Weak statement</th><th>Stronger tutor model</th></tr></thead><tbody>
          ${section.pairs.map(p => `<tr><td style="color:var(--muted);font-style:italic;">${escHtml(p.weak)}</td><td>${escHtml(p.strong)}</td></tr>`).join('')}
        </tbody></table></div>
        ${qBlock(section, 'task', null, section.task, draft)}`

    case 'measurement-concepts':
      return `
        <p class="ta-lede">${escHtml(section.intro)}</p>
        <div style="overflow-x:auto;"><table class="ta-lens-table"><thead><tr><th>Idea</th><th>Tutor-level distinction</th></tr></thead><tbody>
          ${section.concepts.map(c => `<tr><td style="color:var(--gold);font-weight:700;">${escHtml(c.idea)}</td><td>${escHtml(c.def)}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="ta-group-heading">Oral viva prompts</div>
        ${section.vivaPrompts.map((p, i) => qBlock(section, 'viva'+i, null, p, draft)).join('')}`

    case 'maths-map':
      return `
        <p class="ta-lede">${escHtml(section.intro)}</p>
        <div style="overflow-x:auto;"><table class="ta-lens-table"><thead><tr><th>Domain</th><th>Candidate must teach</th></tr></thead><tbody>
          ${section.domains.map(d => `<tr><td style="color:var(--gold);font-weight:700;">${escHtml(d.domain)}</td><td>${escHtml(d.teach)}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="note-box" style="background:var(--navy);border:1px solid var(--border);border-left:3px solid var(--orange);border-radius:0 10px 10px 0;padding:14px 18px;font-size:13px;color:var(--muted);">${escHtml(section.principle)}</div>`

    case 'maths-labs':
      return section.labs.map(lab => `
        <div class="ta-group-heading">Laboratory ${escHtml(lab.key)} — ${escHtml(lab.title)}</div>
        ${lab.questions.map(q => qBlock(section, q.id, null, q.text, draft)).join('')}
      `).join('')

    case 'data-interp':
      return `
        <p class="ta-lede">${escHtml(section.intro)}</p>
        <div style="overflow-x:auto;"><table class="ta-mini-table">
          <thead><tr>${section.table.headers.map(h => `<th>${escHtml(h)}</th>`).join('')}</tr></thead>
          <tbody>${section.table.rows.map(r => `<tr>${r.map(c => `<td>${escHtml(c)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>
        ${section.questions.map(q => qBlock(section, q.id, null, q.text, draft)).join('')}`

    case 'claim-audit':
      return `
        <p class="ta-lede">${escHtml(section.intro)}</p>
        ${section.claims.map(c => `
          <div class="ta-q-block">
            <div class="ta-q-text" style="margin-bottom:.5rem;">${escHtml(c.text)}</div>
            <div style="display:flex;gap:.7rem;align-items:center;margin-bottom:.5rem;">
              <label style="font-size:.82rem;color:var(--muted);">Verdict:</label>
              <input type="text" class="ta-evidence-input" style="width:160px;" placeholder="e.g. overclaimed" data-key="${c.id}-verdict" value="${escHtml(draft[c.id+'-verdict'] || '')}" oninput="onFieldInput('${section.id}','${c.id}-verdict', this.value)">
            </div>
            <textarea class="ta-q-answer" placeholder="Better conclusion" data-key="${c.id}-conclusion" oninput="onFieldInput('${section.id}','${c.id}-conclusion', this.value)">${escHtml(draft[c.id+'-conclusion'] || '')}</textarea>
          </div>`).join('')}`

    case 'formal-assessment':
      return `
        <p class="ta-lede">${escHtml(section.instructions)}</p>
        ${section.sections.map(sec => `
          <div class="ta-group-heading">${escHtml(sec.heading)}</div>
          ${sec.questions.map(q => qBlock(section, q.id, q.marks, q.text, draft)).join('')}
        `).join('')}`

    case 'clearance-microteaching':
      return `
        <p class="ta-lede">${escHtml(section.intro)}</p>
        <div class="ta-group-heading">Prompt options (your assessor picks one)</div>
        <ul style="margin-left:1.2rem;color:var(--muted);font-size:.87rem;line-height:1.8;margin-bottom:1.2rem;">
          ${section.promptOptions.map(p => `<li>${escHtml(p)}</li>`).join('')}
        </ul>
        <div class="ta-group-heading">Lesson architecture</div>
        <p style="font-size:.87rem;color:var(--gold);font-family:var(--font-mono);margin-bottom:1.2rem;">${escHtml(section.architecture)}</p>
        <div class="ta-group-heading">Observation domains (self-rate 1-5 after delivery)</div>
        ${section.observationDomains.map((d, i) => `
          <div class="ta-boundary-row">
            <span class="ta-boundary-text">${escHtml(d)}</span>
            <select class="ta-boundary-select" data-key="rate${i}" onchange="onFieldInput('${section.id}','rate${i}', this.value)">
              <option value="">—</option>
              ${[1,2,3,4,5].map(v => `<option value="${v}" ${draft['rate'+i] == v ? 'selected' : ''}>${v}</option>`).join('')}
            </select>
          </div>`).join('')}`

    case 'clearance-board':
      return `
        <div style="overflow-x:auto;"><table class="ta-lens-table"><thead><tr><th>Gate</th><th>Required standard</th><th>Compensable?</th></tr></thead><tbody>
          ${section.gates.map(g => `<tr><td>${escHtml(g.gate)}</td><td style="color:var(--gold);">${escHtml(g.standard)}</td><td>${escHtml(g.compensable)}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="ta-group-heading">Possible decisions</div>
        <ul style="margin-left:1.2rem;color:var(--muted);font-size:.87rem;line-height:1.8;margin-bottom:1.2rem;">
          ${section.decisions.map(d => `<li>${escHtml(d)}</li>`).join('')}
        </ul>
        <div class="note-box" style="background:var(--navy);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:14px 18px;font-size:13px;color:var(--muted);">${escHtml(section.nonNegotiable)}</div>`

    case 'deployment-charter':
      return `
        <p class="ta-lede">${escHtml(section.intro)}</p>
        <div class="ta-group-heading">For the first six weeks, I will</div>
        <ul style="margin-left:1.2rem;color:var(--muted);font-size:.88rem;line-height:1.9;margin-bottom:1.2rem;">
          ${section.commitments.map(c => `<li>${escHtml(c)}</li>`).join('')}
        </ul>
        <div class="note-box" style="background:var(--navy);border:1px solid var(--border);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:14px 18px;font-size:13px;color:var(--muted);">${escHtml(section.standard)}</div>`

    default:
      return '<p style="color:var(--muted);">Content coming soon.</p>'
  }
}

let pendingSave = null
function showSaveState(message, tone) {
  const note = document.getElementById('saveNote')
  note.textContent = message
  note.className = `ta-save-note ${tone ? `ta-save-${tone}` : ''}`
}
function onFieldInput(sectionId, key, value) {
  const draft = loadDraft(sectionId)
  draft[key] = value
  saveDraft(sectionId, draft)
  showSaveState(`Saved on this device at ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}.`, 'success')
  clearTimeout(pendingSave)
}

function renderNav() {
  document.getElementById('sectionNav').innerHTML = STAGE_CONTENT.sections.map((s, i) => `
    <button type="button" class="ta-section-nav-item ${i === currentIdx ? 'ta-active' : ''} ${completedSections.has(s.id) ? 'ta-done' : ''}" ${i === currentIdx ? 'aria-current="step"' : ''} onclick="goToStep(${i})">
      ${i + 1}. ${escHtml(s.title)}
    </button>`).join('')
  const activeNavItem = nav.querySelector('.ta-section-nav-item.ta-active')
  if (activeNavItem) nav.scrollLeft = activeNavItem.offsetLeft - (nav.clientWidth - activeNavItem.clientWidth) / 2
}

function renderCurrentPanel() {
  const s = STAGE_CONTENT.sections[currentIdx]
  document.getElementById('panels').innerHTML = `
    <section class="ta-panel ta-active" aria-labelledby="currentSectionTitle">
      <h2 id="currentSectionTitle" tabindex="-1">${escHtml(s.title)}</h2>
      ${renderSectionBody(s)}
    </section>`
  document.getElementById('prevBtn').hidden = currentIdx === 0
  const isLast = currentIdx === STAGE_CONTENT.sections.length - 1
  document.getElementById('nextBtn').textContent = isLast
    ? (completedSections.has(s.id) ? 'Completed — pathway finished' : 'Mark complete & finish')
    : 'Mark complete & continue →'
  renderNav()
  U.enhanceStagePanel(document.querySelector('.ta-panel'), s.title)
  document.getElementById('validationSummary').classList.remove('ta-visible')
}

function goToStep(i) { currentIdx = i; renderCurrentPanel(); document.getElementById('currentSectionTitle')?.focus(); window.scrollTo({ top: 56, behavior: 'smooth' }) }
function goStep(delta) { goToStep(Math.max(0, Math.min(STAGE_CONTENT.sections.length - 1, currentIdx + delta))) }

async function completeAndAdvance() {
  const s = STAGE_CONTENT.sections[currentIdx]
  const draft = loadDraft(s.id)
  const validation = completedSections.has(s.id) ? { valid: true, missing: [] } : U.validateStagePanel(document.querySelector('.ta-panel'))
  const summary = document.getElementById('validationSummary')
  if (!validation.valid) {
    summary.textContent = `Complete ${validation.missing.length} required field${validation.missing.length === 1 ? '' : 's'} before marking this section complete.`
    summary.classList.add('ta-visible')
    validation.missing[0].focus()
    return
  }
  summary.classList.remove('ta-visible')

  showSaveState('Saving to your Academy…')
  try {
    if (Object.keys(draft).length) {
      const evidenceResponse = await fetch('/api/v1/tutor-academy/evidence', {
        method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ stageId: STAGE_ID, evidenceType: s.type, evidenceKey: s.id, content: JSON.stringify(draft) })
      })
      if (!evidenceResponse.ok) throw new Error((await evidenceResponse.json()).error?.message || 'Could not save your evidence.')
    }
    const progressResponse = await fetch('/api/v1/tutor-academy/progress', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({ stageId: STAGE_ID, sectionId: s.id, status: 'complete' })
    })
    if (!progressResponse.ok) throw new Error((await progressResponse.json()).error?.message || 'Could not save your progress.')
  } catch (error) {
    showSaveState(error.message || 'Your progress could not be saved. Please try again.', 'error')
    return
  }

  completedSections.add(s.id)
  showSaveState(`Saved to your Academy at ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}.`, 'success')

  if (currentIdx === STAGE_CONTENT.sections.length - 1) {
    window.location.href = '/teacher/tutor-academy/biology-gcse.html'
    return
  }
  goStep(1)
}

async function checkAuth() {
  const { data: { session: s } } = await supa.auth.getSession()
  if (!s) { window.location.href = '/index.html'; return null }
  const { data: profile, error } = await supa.from('profiles').select('role, full_name').eq('id', s.user.id).single()
  if (error || !profile || !['teacher','teacher_manager','admin','super_admin'].includes(profile.role)) {
    window.location.href = '/dashboard.html'
    return null
  }
  const allowed = await U.tutorCanAccessStage(supa, s.user.id, STAGE_ID, profile.role)
  if (!allowed) {
    window.location.replace('/teacher/tutor-academy/biology-gcse.html?locked=' + encodeURIComponent(STAGE_ID))
    return null
  }
  if (profile.full_name) document.getElementById('topbar-user').textContent = profile.full_name
  document.getElementById('authLoading').style.display = 'none'
  return s
}

async function loadProgress() {
  const { data: rows } = await supa.from('tutor_academy_progress')
    .select('section_id, status').eq('profile_id', session.user.id).eq('stage_id', STAGE_ID)
  ;(rows || []).forEach(r => { if (r.status === 'complete') completedSections.add(r.section_id) })
}

;(async () => {
  session = await checkAuth()
  if (!session) return
  if (!STAGE_CONTENT || !Array.isArray(STAGE_CONTENT.sections) || !STAGE_CONTENT.sections.length) {
    document.getElementById('panels').innerHTML = '<div class="ta-panel ta-active"><h2>Content unavailable</h2><p style="color:var(--muted);">This stage\'s content didn\'t load correctly. Please refresh the page — if this keeps happening, let us know.</p></div>'
    document.getElementById('nextBtn').style.display = 'none'
    document.getElementById('prevBtn').style.display = 'none'
    return
  }
  document.getElementById('stageTitle').textContent = 'Stage 4 — ' + STAGE_CONTENT.title
  document.getElementById('stageSubtitle').textContent = STAGE_CONTENT.subtitle + ' — ' + STAGE_CONTENT.overview
  await loadProgress()
  renderCurrentPanel()
})()
</script>
</body>
</html>
