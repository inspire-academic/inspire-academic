<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Take Attendance — Inspire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/app-shared.css">
<style>
  .auth-loading{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:16px;}
  .auth-loading-logo{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--gold);}
  .auth-loading-sub{font-size:13px;color:var(--muted);font-family:var(--font-mono);}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(11,22,40,0.95);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:100;backdrop-filter:blur(8px);}
  .topbar-logo{font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--gold);letter-spacing:0.02em;}
  .topbar-divider{width:1px;height:20px;background:var(--border);display:none;}
  .topbar-title{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .topbar-user{font-size:12.5px;color:var(--muted);}

  .wrap{max-width:720px;margin:0 auto;padding:80px 16px 64px;}
  h1{font-family:var(--font-display);font-size:23px;font-weight:700;margin-bottom:6px;}
  .subhead{font-size:13.5px;color:var(--muted);margin-bottom:24px;}

  .setup-row{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
  .setup-row input[type=text]{flex:1;background:var(--navy2);border:1px solid var(--border);border-radius:var(--r);padding:.7rem .9rem;color:var(--white);font-size:.9rem;}
  .setup-row input[type=text]:focus{outline:none;border-color:var(--gold);}

  .session-banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:.9rem 1.1rem;margin-bottom:18px;}
  .session-banner .sb-title{font-weight:700;font-size:.95rem;}
  .session-banner .sb-meta{font-size:.78rem;color:var(--muted);margin-top:2px;}
  .session-banner.ended{border-color:var(--green);}

  .roster{display:flex;flex-direction:column;gap:8px;}
  .roster-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:.75rem .9rem;}
  .roster-name{font-weight:600;font-size:.9rem;}
  .roster-status{font-size:.75rem;color:var(--muted);margin-top:2px;font-family:var(--font-mono);}
  .mark-btn{flex-shrink:0;padding:.5rem 1rem;border-radius:var(--r);border:1px solid var(--border);background:transparent;color:var(--muted);font-size:.8rem;font-weight:600;transition:all .15s;min-width:104px;text-align:center;}
  .mark-btn.present{background:#16803c22;border-color:var(--green);color:#4ade80;}
  .mark-btn.absent{background:#b92b1a22;border-color:var(--red);color:#f87171;}

  .summary-bar{display:flex;gap:18px;font-size:.8rem;color:var(--muted);margin-top:16px;font-family:var(--font-mono);}
  .summary-bar b{color:var(--white);}

  .empty-note{font-size:.85rem;color:var(--muted);padding:1rem 0;}
  .report-link{display:block;text-align:center;margin-top:28px;font-size:.85rem;}

  @media (min-width:600px){
    .setup-row{flex-direction:row;align-items:stretch;}
  }
</style>
</head>
<body>

<div class="auth-loading" id="authLoading">
  <div class="auth-loading-logo">Inspire</div>
  <div class="auth-loading-sub">Verifying access...</div>
</div>

<header class="topbar">
  <a href="/teacher/teacher.html" class="topbar-logo">Inspire</a>
  <div class="topbar-divider"></div>
  <span class="topbar-title">Take Attendance</span>
  <div class="topbar-right">
    <span class="topbar-user" id="topbar-user"></span>
    <button class="btn btn-outline" onclick="window.location.href='/teacher/teacher.html'">← Dashboard</button>
  </div>
</header>

<div class="wrap">
  <h1>Take Attendance</h1>
  <p class="subhead">Mark each student the moment they join the Zoom call. Every tap is timestamped for the monthly billing report.</p>

  <div class="setup-row">
    <input type="text" id="subject-input" list="subject-list" placeholder="What are you teaching now? e.g. Physics">
    <datalist id="subject-list">
      <option value="Physics"><option value="Chemistry"><option value="Biology"><option value="Maths">
    </datalist>
    <button class="btn btn-gold" id="start-btn" onclick="startClass()">Start Class</button>
  </div>

  <div id="session-area"></div>

  <a class="report-link gold" href="/teacher/attendance-report.html">View monthly attendance report →</a>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
<script>
const SUPABASE_URL      = 'https://ygtsrdwoikqnrbexjrtl.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_XxmrO4J18iyQ1Srub73BhQ_FBhd8mXR'
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

let ME = null
let SESSION = null
let ROSTER = []          // [{id, name}]
let RECORDS = {}         // student_id -> {status, marked_at}

function toast(msg, type){
  const t = document.getElementById('toast')
  t.textContent = msg
  t.className = 'show ' + (type||'')
  setTimeout(()=>{ t.className='' }, 2600)
}

function timeStr(ts){
  return new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
}

async function checkAuth(){
  const { data: { session } } = await supa.auth.getSession()
  if (!session) { window.location.href = '/index.html'; return false }
  const { data: profile, error } = await supa.from('profiles').select('id, role, full_name, first_name').eq('id', session.user.id).single()
  if (error || !profile || !['teacher','teacher_manager','admin','super_admin'].includes(profile.role)) {
    window.location.href = '/dashboard.html'
    return false
  }
  ME = profile
  document.getElementById('topbar-user').textContent = profile.full_name || profile.first_name || ''
  document.getElementById('authLoading').style.display = 'none'
  return true
}

async function startClass(){
  const subject = document.getElementById('subject-input').value.trim()
  if (!subject) { toast('Enter what you\'re teaching first', 'error'); return }
  const btn = document.getElementById('start-btn')
  btn.disabled = true
  const today = new Date().toISOString().slice(0,10)

  let { data: existing } = await supa.from('class_sessions').select('*')
    .eq('teacher_id', ME.id).eq('subject', subject).eq('session_date', today).maybeSingle()

  if (!existing) {
    const { data: created, error } = await supa.from('class_sessions')
      .insert({ teacher_id: ME.id, subject, session_date: today })
      .select().single()
    if (error) { toast('Could not start class: ' + error.message, 'error'); btn.disabled = false; return }
    existing = created
  }

  SESSION = existing
  btn.disabled = false
  await loadRosterAndRecords()
  renderSession()
}

async function loadRosterAndRecords(){
  const { data: asgn } = await supa.from('teacher_student_assignments')
    .select('student_id').eq('teacher_id', ME.id).eq('is_active', true)
  const studentIds = [...new Set((asgn||[]).map(a=>a.student_id))]

  if (studentIds.length === 0) { ROSTER = []; RECORDS = {}; return }

  const { data: students } = await supa.from('profiles')
    .select('id, first_name, full_name').in('id', studentIds)
  ROSTER = (students||[])
    .map(s => ({ id: s.id, name: s.full_name || s.first_name || 'Student' }))
    .sort((a,b) => a.name.localeCompare(b.name))

  const { data: records } = await supa.from('attendance_records')
    .select('student_id, status, marked_at').eq('session_id', SESSION.id)
  RECORDS = {}
  ;(records||[]).forEach(r => { RECORDS[r.student_id] = r })
}

function renderSession(){
  const area = document.getElementById('session-area')
  if (!SESSION) { area.innerHTML = ''; return }

  const started = timeStr(SESSION.started_at)
  const endedNote = SESSION.ended_at ? ` · Ended ${timeStr(SESSION.ended_at)}` : ''

  let rosterHtml
  if (ROSTER.length === 0) {
    rosterHtml = '<p class="empty-note">No students are assigned to you yet — ask an admin to assign students via Manage Teachers.</p>'
  } else {
    rosterHtml = '<div class="roster">' + ROSTER.map(s => {
      const rec = RECORDS[s.id]
      const present = rec && rec.status === 'present'
      const absent = rec && rec.status === 'absent'
      const cls = present ? 'present' : (absent ? 'absent' : '')
      const label = present ? ('Present · ' + timeStr(rec.marked_at)) : (absent ? 'Absent' : 'Mark present')
      const statusLine = present ? 'Joined ' + timeStr(rec.marked_at) : (absent ? 'Not marked present' : 'Not yet marked')
      return `<div class="card roster-row">
        <div><div class="roster-name">${escapeHtml(s.name)}</div><div class="roster-status">${statusLine}</div></div>
        <button class="mark-btn ${cls}" onclick="toggleStudent('${s.id}')">${label}</button>
      </div>`
    }).join('') + '</div>'
  }

  const presentCount = ROSTER.filter(s => RECORDS[s.id]?.status === 'present').length
  const absentCount = ROSTER.filter(s => RECORDS[s.id]?.status === 'absent').length

  area.innerHTML = `
    <div class="card session-banner ${SESSION.ended_at ? 'ended' : ''}">
      <div>
        <div class="sb-title">${escapeHtml(SESSION.subject)} — ${SESSION.session_date}</div>
        <div class="sb-meta">Started ${started}${endedNote}</div>
      </div>
      <button class="btn ${SESSION.ended_at ? 'btn-outline' : 'btn-gold'}" onclick="endClass()">${SESSION.ended_at ? 'Re-run End Class' : 'End Class'}</button>
    </div>
    ${rosterHtml}
    <div class="summary-bar"><span><b>${presentCount}</b> present</span><span><b>${absentCount}</b> absent</span><span><b>${ROSTER.length - presentCount - absentCount}</b> unmarked</span></div>
  `
}

async function toggleStudent(studentId){
  const rec = RECORDS[studentId]
  if (rec && rec.status === 'present') {
    // Unmark — back to "not yet arrived"
    await supa.from('attendance_records').delete().eq('session_id', SESSION.id).eq('student_id', studentId)
    delete RECORDS[studentId]
  } else {
    const marked_at = new Date().toISOString()
    const { data, error } = await supa.from('attendance_records')
      .upsert({ session_id: SESSION.id, student_id: studentId, status: 'present', marked_at }, { onConflict: 'session_id,student_id' })
      .select().single()
    if (error) { toast('Could not mark student: ' + error.message, 'error'); return }
    RECORDS[studentId] = data
  }
  renderSession()
}

async function endClass(){
  const toMark = ROSTER.filter(s => !RECORDS[s.id])
  if (toMark.length > 0) {
    const rows = toMark.map(s => ({ session_id: SESSION.id, student_id: s.id, status: 'absent', marked_at: new Date().toISOString() }))
    const { error } = await supa.from('attendance_records').insert(rows)
    if (error) { toast('Could not back-fill absences: ' + error.message, 'error'); return }
  }
  if (!SESSION.ended_at) {
    const { data, error } = await supa.from('class_sessions')
      .update({ ended_at: new Date().toISOString() }).eq('id', SESSION.id).select().single()
    if (error) { toast('Could not close class: ' + error.message, 'error'); return }
    SESSION = data
  }
  await loadRosterAndRecords()
  renderSession()
  toast('Class ended — attendance saved', 'success')
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
}

checkAuth()
</script>
</body>
</html>
