<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoices — Inspire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/app-shared.css">
<style>
  .auth-loading{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:16px;}
  .auth-loading-logo{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--gold);}
  .auth-loading-sub{font-size:13px;color:var(--muted);font-family:var(--font-mono);}

  .topbar{position:fixed;top:0;left:0;right:0;height:56px;background:rgba(11,22,40,0.95);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:12px;z-index:100;backdrop-filter:blur(8px);}
  .topbar-logo{font-family:var(--font-display);font-size:19px;font-weight:700;color:var(--gold);letter-spacing:0.02em;}
  .topbar-title{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .topbar-user{font-size:12.5px;color:var(--muted);}

  .wrap{max-width:860px;margin:0 auto;padding:80px 16px 64px;}
  h1{font-family:var(--font-display);font-size:23px;font-weight:700;margin-bottom:6px;}
  .subhead{font-size:13.5px;color:var(--muted);margin-bottom:22px;}
  h2{font-size:15px;font-weight:700;margin:26px 0 10px;font-family:var(--font-display);}

  .rate-card{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .rate-card .rc-label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  .rate-card .rc-value{font-family:var(--font-display);font-size:19px;font-weight:700;margin-top:2px;}
  .inline-edit{display:flex;align-items:center;gap:8px;}
  .inline-edit input{background:var(--navy);border:1px solid var(--gold);border-radius:var(--r);padding:.4rem .6rem;color:var(--white);font-size:.9rem;width:100px;}

  .filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:8px;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);}
  .field input,.field select{background:var(--navy2);border:1px solid var(--border);border-radius:var(--r);padding:.55rem .7rem;color:var(--white);font-size:.85rem;min-width:180px;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--gold);}

  .empty-note{font-size:.85rem;color:var(--muted);padding:1rem 0;}
  .link-btn{background:none;border:none;color:var(--gold);font-size:.8rem;font-weight:600;cursor:pointer;padding:.2rem 0;}
  .link-btn:hover{color:var(--gold2);}

  .status-chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.68rem;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.03em;}
  .status-draft{background:#7a8fa622;color:var(--muted);}
  .status-sent{background:#1d4ed822;color:#60a5fa;}
  .status-paid{background:#16803c22;color:#4ade80;}
  .status-void{background:#b92b1a22;color:#f87171;text-decoration:line-through;}

  .bank-row{display:flex;gap:14px;margin:10px 0;flex-wrap:wrap;}
  .bank-option{flex:1;min-width:220px;border:1px solid var(--border);border-radius:var(--r);padding:.8rem .9rem;cursor:pointer;font-size:.82rem;}
  .bank-option.selected{border-color:var(--gold);background:rgba(201,168,76,.06);}
  .bank-option b{display:block;font-size:.85rem;margin-bottom:3px;}
  .bank-option .bo-detail{color:var(--muted);font-size:.75rem;line-height:1.5;font-family:var(--font-mono);}

  .action-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:.82rem;}
  th{text-align:left;padding:8px 10px;font-size:.68rem;color:var(--muted);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);white-space:nowrap;}
  td{padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;}
  tr:last-child td{border-bottom:none;}

  /* ── Printable invoice — light document styling, distinct from the app's dark chrome (matches assessment-report.html's convention) ── */
  #invoice-preview{background:#ffffff;color:#1a1a1a;border-radius:10px;padding:2.2rem 2rem;font-family:var(--font-body);}
  #invoice-preview .inv-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #0b1628;padding-bottom:1rem;margin-bottom:1.4rem;}
  #invoice-preview .inv-brand{font-family:var(--font-display);font-style:italic;font-size:22px;color:#0b1628;}
  #invoice-preview .inv-brand b{font-style:normal;color:#c9a84c;}
  #invoice-preview .inv-meta{text-align:right;font-size:.8rem;color:#555;}
  #invoice-preview .inv-meta .inv-number{font-weight:700;color:#0b1628;font-size:.95rem;}
  #invoice-preview .inv-bill-to{margin-bottom:1.4rem;font-size:.85rem;}
  #invoice-preview .inv-bill-to .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:#888;margin-bottom:3px;}
  #invoice-preview table{font-size:.82rem;}
  #invoice-preview th{color:#888;border-bottom:1px solid #ddd;}
  #invoice-preview td{border-bottom:1px solid #eee;color:#222;}
  #invoice-preview .inv-total-row td{font-weight:700;border-top:2px solid #0b1628;border-bottom:none;font-size:.95rem;}
  #invoice-preview .inv-pay{background:#f7f6f2;border-left:4px solid #c9a84c;border-radius:6px;padding:.9rem 1.1rem;margin-top:1.4rem;font-size:.8rem;}
  #invoice-preview .inv-pay .lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:#888;margin-bottom:5px;}
  #invoice-preview .inv-footer{margin-top:1.6rem;text-align:center;font-size:.72rem;color:#999;}

  @media (min-width:640px){ .filters{align-items:flex-end;} }
</style>
</head>
<body>

<div class="auth-loading" id="authLoading">
  <div class="auth-loading-logo">Inspire</div>
  <div class="auth-loading-sub">Verifying access...</div>
</div>

<header class="topbar">
  <a href="/teacher/teacher.html" class="topbar-logo">Inspire</a>
  <span class="topbar-title">Invoices</span>
  <div class="topbar-right">
    <span class="topbar-user" id="topbar-user"></span>
    <button class="btn btn-outline" onclick="inspireGoBack('/teacher/teacher.html')">← Dashboard</button>
  </div>
</header>

<div class="wrap">
  <h1>Invoices</h1>
  <p class="subhead">Generate a monthly invoice from a student's recorded attendance.</p>

  <div class="card rate-card">
    <div>
      <div class="rc-label">Default rate (per session)</div>
      <div class="rc-value" id="default-rate-display">£—</div>
    </div>
    <button class="link-btn" id="edit-default-rate-btn" onclick="editDefaultRate()" style="display:none;">Edit</button>
  </div>

  <div class="filters">
    <div class="field">
      <label>Student</label>
      <select id="f-student"><option value="">Choose a student…</option></select>
    </div>
    <div class="field">
      <label>Month</label>
      <input type="month" id="f-month">
    </div>
    <button class="btn btn-gold" onclick="loadInvoiceArea()">Load</button>
  </div>

  <div id="invoice-area"><p class="empty-note">Choose a student and month, then Load.</p></div>

  <div id="past-invoices-area"></div>

  <h2 style="display:none;" id="preview-heading">Preview</h2>
  <div id="invoice-preview" style="display:none;"></div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"></script>
<script src="/assets/js/nav-back.js"></script>
<script>
const SUPABASE_URL      = 'https://ygtsrdwoikqnrbexjrtl.supabase.co'
const SUPABASE_ANON_KEY = 'sb_publishable_XxmrO4J18iyQ1Srub73BhQ_FBhd8mXR'
const supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)

// Business identity is always "Inspire Academic" with no printed address,
// regardless of which bank account is selected (Eric confirmed 2026-09-12) —
// selecting CIC changes only the bank-transfer block below, never this.
const CONTACT_EMAIL = 'info@inspireacademic.org'
const CONTACT_PHONE = '07885557082'

const BANK_ACCOUNTS = {
  default: {
    label: 'Default — Wise',
    bankName: 'Wise', accountName: 'Eric Kweku Appiah',
    accountNumber: '11020190', sortCode: '23-14-70'
  },
  cic: {
    label: 'CIC — NatWest',
    bankName: 'NatWest', accountName: 'Inspire Centre for Education and Innovation',
    accountNumber: '65610342', sortCode: '51-50-02'
  }
}

let ME = null
let IS_ADMIN = false
let ALL_STUDENTS = []          // [{id, name}]
let DEFAULT_RATE = 35
let SELECTED_BANK = 'default'
let CURRENT_SESSIONS = []      // sessions computed for a NEW invoice, before saving
let CURRENT_RATE = 35
let CURRENT_PERIOD = null      // {start, end, monthLabel}
let CURRENT_STUDENT = null     // {id, name}
let CURRENT_INVOICE = null     // the saved invoice row currently shown/previewed
let CURRENT_LINE_ITEMS = []    // class_sessions backing CURRENT_INVOICE

function toast(msg, type){
  const t = document.getElementById('toast')
  t.textContent = msg
  t.className = 'show ' + (type||'')
  setTimeout(()=>{ t.className='' }, 2800)
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
}

function fmtMoney(n){
  return '£' + Number(n).toFixed(2)
}

function fmtDate(d){
  return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })
}

function monthLabel(monthStr){
  const [y,m] = monthStr.split('-').map(Number)
  return new Date(y, m-1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' })
}

function monthToBounds(monthStr){
  const [y,m] = monthStr.split('-').map(Number)
  const start = new Date(y, m-1, 1)
  const end = new Date(y, m, 0)
  const iso = d => d.toISOString().slice(0,10)
  return { start: iso(start), end: iso(end), label: monthLabel(monthStr) }
}

function defaultMonthValue(){
  const now = new Date()
  const prev = new Date(now.getFullYear(), now.getMonth() - 1, 1)
  return `${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,'0')}`
}

async function checkAuth(){
  const { data: { session } } = await supa.auth.getSession()
  if (!session) { window.location.href = '/index.html'; return false }
  const { data: profile, error } = await supa.from('profiles').select('id, role, full_name, first_name').eq('id', session.user.id).single()
  if (error || !profile || !['teacher','teacher_manager','admin','super_admin'].includes(profile.role)) {
    window.location.href = '/dashboard.html'
    return false
  }
  ME = profile
  IS_ADMIN = profile.role === 'admin' || profile.role === 'super_admin'
  document.getElementById('topbar-user').textContent = profile.full_name || profile.first_name || ''
  document.getElementById('authLoading').style.display = 'none'
  if (IS_ADMIN) document.getElementById('edit-default-rate-btn').style.display = 'inline'
  document.getElementById('f-month').value = defaultMonthValue()

  await Promise.all([loadAllStudents(), loadBillingSettings()])
  populateStudentSelect()
  return true
}

// Admins see every student, same rationale as attendance.html's IS_ADMIN
// fix — an explicit teacher_student_assignments row shouldn't gate who a
// staff member can bill.
async function loadAllStudents(){
  if (IS_ADMIN) {
    const { data: students } = await supa.from('profiles').select('id, first_name, full_name').eq('role', 'student')
    ALL_STUDENTS = (students||[]).map(s => ({ id: s.id, name: s.full_name || s.first_name || 'Student' }))
      .sort((a,b) => a.name.localeCompare(b.name))
    return
  }
  const { data: asgn } = await supa.from('teacher_student_assignments')
    .select('student_id').eq('teacher_id', ME.id).eq('is_active', true)
  const studentIds = [...new Set((asgn||[]).map(a=>a.student_id))]
  if (studentIds.length === 0) { ALL_STUDENTS = []; return }
  const { data: students } = await supa.from('profiles').select('id, first_name, full_name').in('id', studentIds)
  ALL_STUDENTS = (students||[]).map(s => ({ id: s.id, name: s.full_name || s.first_name || 'Student' }))
    .sort((a,b) => a.name.localeCompare(b.name))
}

function populateStudentSelect(){
  const sel = document.getElementById('f-student')
  sel.innerHTML = '<option value="">Choose a student…</option>' +
    ALL_STUDENTS.map(s => `<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('')
}

async function loadBillingSettings(){
  const { data } = await supa.from('billing_settings').select('default_rate').eq('id', 'default').maybeSingle()
  DEFAULT_RATE = (data && Number(data.default_rate)) || 35
  document.getElementById('default-rate-display').textContent = fmtMoney(DEFAULT_RATE) + ' / session'
}

function editDefaultRate(){
  const card = document.querySelector('.rate-card')
  const current = card.querySelector('.rc-value')
  const editBtn = document.getElementById('edit-default-rate-btn')
  current.innerHTML = `<span class="inline-edit">
    <input type="number" step="0.01" min="0" id="default-rate-input" value="${DEFAULT_RATE}">
    <button class="btn btn-gold" style="padding:.35rem .8rem;" onclick="saveDefaultRate()">Save</button>
    <button class="btn btn-outline" style="padding:.35rem .8rem;" onclick="cancelEditDefaultRate()">Cancel</button>
  </span>`
  editBtn.style.display = 'none'
}

async function cancelEditDefaultRate(){
  await loadBillingSettings()
  document.getElementById('edit-default-rate-btn').style.display = IS_ADMIN ? 'inline' : 'none'
}

async function saveDefaultRate(){
  const val = parseFloat(document.getElementById('default-rate-input').value)
  if (!(val > 0)) { toast('Enter a rate greater than 0', 'error'); return }
  const { error } = await supa.from('billing_settings')
    .update({ default_rate: val, updated_at: new Date().toISOString() }).eq('id', 'default')
  if (error) { toast('Could not save: ' + error.message, 'error'); return }
  DEFAULT_RATE = val
  await loadBillingSettings()
  document.getElementById('edit-default-rate-btn').style.display = IS_ADMIN ? 'inline' : 'none'
  toast('Default rate updated', 'success')
}

async function getStudentRate(studentId){
  const { data } = await supa.from('student_billing_rates').select('rate').eq('student_id', studentId).maybeSingle()
  return (data && Number(data.rate)) || DEFAULT_RATE
}

// ── Main flow: load either an existing invoice for this student+month, or a fresh generator ──
async function loadInvoiceArea(){
  const studentId = document.getElementById('f-student').value
  const monthStr = document.getElementById('f-month').value
  const area = document.getElementById('invoice-area')
  hidePreview()

  if (!studentId || !monthStr) { toast('Choose a student and month', 'error'); return }

  const student = ALL_STUDENTS.find(s => s.id === studentId)
  const period = monthToBounds(monthStr)
  CURRENT_STUDENT = student
  CURRENT_PERIOD = period

  area.innerHTML = '<p class="empty-note">Loading…</p>'

  const { data: existing } = await supa.from('invoices').select('*')
    .eq('student_id', studentId).eq('period_start', period.start).eq('period_end', period.end)
    .neq('status', 'void').maybeSingle()

  if (existing) {
    await renderExistingInvoiceCard(existing)
  } else {
    await renderNewInvoiceForm(studentId, student, period)
  }

  await loadPastInvoices(studentId)
}

async function renderNewInvoiceForm(studentId, student, period){
  const area = document.getElementById('invoice-area')

  const { data: sessions } = await supa.from('class_sessions').select('id, subject, session_date')
    .eq('teacher_id', ME.id).gte('session_date', period.start).lte('session_date', period.end)
  const sessionIds = (sessions||[]).map(s => s.id)

  let presentSessions = []
  if (sessionIds.length) {
    const { data: records } = await supa.from('attendance_records')
      .select('session_id, status').in('session_id', sessionIds).eq('student_id', studentId).eq('status', 'present')
    const presentIds = new Set((records||[]).map(r => r.session_id))
    presentSessions = sessions.filter(s => presentIds.has(s.id)).sort((a,b) => a.session_date.localeCompare(b.session_date))
  }

  const rate = await getStudentRate(studentId)
  CURRENT_SESSIONS = presentSessions
  CURRENT_RATE = rate
  const total = presentSessions.length * rate

  if (presentSessions.length === 0) {
    area.innerHTML = `<div class="card"><p class="empty-note">No attended sessions found for ${escapeHtml(student.name)} in ${period.label}.</p></div>`
    return
  }

  const parentEmail = await loadParentEmail(studentId)

  area.innerHTML = `
    <div class="card">
      <h2 style="margin-top:0;">${escapeHtml(student.name)} — ${period.label}</h2>
      <p class="empty-note" style="padding:0 0 10px;">${presentSessions.length} session${presentSessions.length!==1?'s':''} attended
        <span class="inline-edit" style="display:inline-flex;">
          × <span id="rate-display">${fmtMoney(rate)}</span>
          ${IS_ADMIN ? `<button class="link-btn" onclick="editStudentRate('${studentId}')">Edit rate</button>` : ''}
        </span>
        = <b id="total-display">${fmtMoney(total)}</b>
      </p>

      <div class="field"><label>Recipient email</label>
        <input type="text" id="recipient-email" value="${escapeHtml(parentEmail)}" placeholder="parent@example.com" style="min-width:260px;">
      </div>

      <div style="margin-top:14px;">
        <label style="font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);">Bank account to show on invoice</label>
        <div class="bank-row" id="bank-row"></div>
      </div>

      <div class="action-row">
        <button class="btn btn-gold" onclick="saveInvoice()">Save &amp; Generate Invoice</button>
      </div>
    </div>
  `
  renderBankOptions()
}

function renderBankOptions(){
  const row = document.getElementById('bank-row')
  if (!row) return
  row.innerHTML = Object.entries(BANK_ACCOUNTS).map(([key, b]) => `
    <div class="bank-option ${SELECTED_BANK===key?'selected':''}" onclick="selectBank('${key}')">
      <b>${escapeHtml(b.label)}</b>
      <div class="bo-detail">${escapeHtml(b.accountName)}<br>${escapeHtml(b.bankName)} · Acc ${escapeHtml(b.accountNumber)} · Sort ${escapeHtml(b.sortCode)}</div>
    </div>
  `).join('')
}

function selectBank(key){
  SELECTED_BANK = key
  renderBankOptions()
  if (document.getElementById('invoice-preview').style.display !== 'none') renderPreview()
}

function editStudentRate(studentId){
  const wrap = document.getElementById('rate-display').parentElement
  wrap.innerHTML = `<span class="inline-edit">
    <input type="number" step="0.01" min="0" id="student-rate-input" value="${CURRENT_RATE}">
    <button class="btn btn-gold" style="padding:.3rem .7rem;" onclick="saveStudentRate('${studentId}')">Save</button>
  </span>`
}

async function saveStudentRate(studentId){
  const val = parseFloat(document.getElementById('student-rate-input').value)
  if (!(val > 0)) { toast('Enter a rate greater than 0', 'error'); return }
  const { error } = await supa.from('student_billing_rates')
    .upsert({ student_id: studentId, rate: val, updated_at: new Date().toISOString() }, { onConflict: 'student_id' })
  if (error) { toast('Could not save: ' + error.message, 'error'); return }
  toast('Rate updated for this student', 'success')
  await loadInvoiceArea()
}

async function loadParentEmail(studentId){
  try {
    const { data: { session } } = await supa.auth.getSession()
    const res = await fetch(`/api/v1/student/info?studentId=${encodeURIComponent(studentId)}`, {
      headers: { Authorization: `Bearer ${session.access_token}` }
    })
    const json = await res.json()
    return (json.success && json.parent && json.parent.email) || ''
  } catch (e) {
    return ''
  }
}

function genInvoiceNumber(monthStr, studentId){
  const rand = Math.random().toString(16).slice(2,6)
  return `INV-${monthStr.replace('-','')}-${studentId.slice(0,6)}-${rand}`
}

async function saveInvoice(){
  const recipientEmail = document.getElementById('recipient-email').value.trim()
  const invoiceNumber = genInvoiceNumber(document.getElementById('f-month').value, CURRENT_STUDENT.id)
  const total = CURRENT_SESSIONS.length * CURRENT_RATE

  const { data: inv, error } = await supa.from('invoices').insert({
    invoice_number: invoiceNumber,
    student_id: CURRENT_STUDENT.id,
    teacher_id: ME.id,
    period_start: CURRENT_PERIOD.start,
    period_end: CURRENT_PERIOD.end,
    session_count: CURRENT_SESSIONS.length,
    rate: CURRENT_RATE,
    currency: 'GBP',
    total,
    bank_account: SELECTED_BANK,
    recipient_email: recipientEmail || null,
    status: 'draft'
  }).select().single()

  if (error) {
    toast(error.code === '23505' ? 'An invoice for this student/month already exists.' : 'Could not save: ' + error.message, 'error')
    return
  }

  const links = CURRENT_SESSIONS.map(s => ({ invoice_id: inv.id, session_id: s.id }))
  const { error: linkError } = await supa.from('invoice_sessions').insert(links)
  if (linkError) toast('Invoice saved, but line items could not be linked: ' + linkError.message, 'error')
  else toast('Invoice saved', 'success')
  await renderExistingInvoiceCard(inv)
  await loadPastInvoices(CURRENT_STUDENT.id)
}

async function renderExistingInvoiceCard(inv){
  const area = document.getElementById('invoice-area')
  const student = ALL_STUDENTS.find(s => s.id === inv.student_id) || CURRENT_STUDENT
  SELECTED_BANK = inv.bank_account

  const { data: links } = await supa.from('invoice_sessions').select('session_id').eq('invoice_id', inv.id)
  const sessionIds = (links||[]).map(l => l.session_id)
  const { data: sessions } = sessionIds.length
    ? await supa.from('class_sessions').select('id, subject, session_date').in('id', sessionIds)
    : { data: [] }
  const lineItems = (sessions||[]).slice().sort((a,b) => a.session_date.localeCompare(b.session_date))

  CURRENT_INVOICE = inv
  CURRENT_LINE_ITEMS = lineItems

  area.innerHTML = `
    <div class="card">
      <h2 style="margin-top:0;">${escapeHtml(student ? student.name : 'Student')} — ${escapeHtml(inv.invoice_number)}
        <span class="status-chip status-${inv.status}">${inv.status}</span>
      </h2>
      <p class="empty-note" style="padding:0 0 10px;">
        ${inv.session_count} session${inv.session_count!==1?'s':''} × ${fmtMoney(inv.rate)} = <b>${fmtMoney(inv.total)}</b>
        · ${escapeHtml(BANK_ACCOUNTS[inv.bank_account].label)}
        ${inv.recipient_email ? ' · to ' + escapeHtml(inv.recipient_email) : ''}
      </p>
      ${inv.status !== 'void' && !inv.recipient_email ? `
        <div class="field" style="margin-bottom:10px;"><label>Recipient email (needed to send)</label>
          <input type="text" id="existing-recipient-email" placeholder="parent@example.com" style="min-width:260px;">
        </div>
      ` : ''}
      <div class="action-row">
        <button class="btn btn-outline" onclick="showPreview()">Preview</button>
        <button class="btn btn-outline" onclick="downloadPdf()">Download PDF</button>
        ${inv.status !== 'void' ? `<button class="btn btn-gold" onclick="emailInvoice()">${inv.status==='sent'||inv.status==='paid' ? 'Resend' : 'Email'}</button>` : ''}
        ${inv.status === 'draft' || inv.status === 'sent' ? `<button class="btn btn-outline" onclick="markPaid('${inv.id}')">Mark Paid</button>` : ''}
        ${inv.status !== 'void' ? `<button class="btn btn-outline" onclick="voidInvoice('${inv.id}')">Void</button>` : ''}
      </div>
    </div>
  `
}

function buildInvoiceHtml(){
  const inv = CURRENT_INVOICE
  const student = ALL_STUDENTS.find(s => s.id === inv.student_id) || CURRENT_STUDENT
  const bank = BANK_ACCOUNTS[inv.bank_account]
  const rows = CURRENT_LINE_ITEMS.map(s => `
    <tr><td>${fmtDate(s.session_date)}</td><td>${escapeHtml(s.subject)}</td><td>${fmtMoney(inv.rate)}</td></tr>
  `).join('')

  return `
    <div class="inv-head">
      <div class="inv-brand"><b>Inspire</b> Academic</div>
      <div class="inv-meta">
        <div class="inv-number">${escapeHtml(inv.invoice_number)}</div>
        <div>Issued ${fmtDate(inv.created_at.slice(0,10))}</div>
      </div>
    </div>
    <div class="inv-bill-to">
      <div class="lbl">Billed to</div>
      <div>${escapeHtml(student ? student.name : 'Student')}</div>
      ${inv.recipient_email ? `<div>${escapeHtml(inv.recipient_email)}</div>` : ''}
      <div class="lbl" style="margin-top:8px;">Billing period</div>
      <div>${fmtDate(inv.period_start)} – ${fmtDate(inv.period_end)}</div>
    </div>
    <table>
      <thead><tr><th>Date</th><th>Subject</th><th>Amount</th></tr></thead>
      <tbody>
        ${rows}
        <tr class="inv-total-row"><td colspan="2">Total (${inv.session_count} session${inv.session_count!==1?'s':''})</td><td>${fmtMoney(inv.total)}</td></tr>
      </tbody>
    </table>
    <div class="inv-pay">
      <div class="lbl">Payment details — bank transfer</div>
      <div><b>${escapeHtml(bank.bankName)}</b> — ${escapeHtml(bank.accountName)}</div>
      <div>Account number: ${escapeHtml(bank.accountNumber)} · Sort code: ${escapeHtml(bank.sortCode)}</div>
    </div>
    <div class="inv-footer">
      Inspire Academic · Questions about this invoice? ${escapeHtml(CONTACT_EMAIL)} · ${escapeHtml(CONTACT_PHONE)}
    </div>
  `
}

function renderPreview(){
  document.getElementById('invoice-preview').innerHTML = buildInvoiceHtml()
}

function showPreview(){
  renderPreview()
  document.getElementById('preview-heading').style.display = 'block'
  document.getElementById('invoice-preview').style.display = 'block'
  document.getElementById('invoice-preview').scrollIntoView({ behavior: 'smooth', block: 'start' })
}

function hidePreview(){
  document.getElementById('preview-heading').style.display = 'none'
  document.getElementById('invoice-preview').style.display = 'none'
  document.getElementById('invoice-preview').innerHTML = ''
}

// ── PDF generation (lazy-loaded, client-side — same pattern as assessment-report.html) ──
let html2pdfLoaded = null
function loadHtml2Pdf(){
  if (window.html2pdf) return Promise.resolve()
  if (html2pdfLoaded) return html2pdfLoaded
  html2pdfLoaded = new Promise((resolve, reject) => {
    const s = document.createElement('script')
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js'
    s.onload = resolve
    s.onerror = () => reject(new Error('Could not load PDF engine — check your connection and try again.'))
    document.head.appendChild(s)
  })
  return html2pdfLoaded
}

function pdfOptions(){
  return {
    margin: 0,
    filename: `${CURRENT_INVOICE.invoice_number}.pdf`,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, letterRendering: true },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
  }
}

async function downloadPdf(){
  if (!CURRENT_INVOICE) { toast('Nothing to download', 'error'); return }
  renderPreview()
  document.getElementById('invoice-preview').style.display = 'block'
  try {
    await loadHtml2Pdf()
    await html2pdf().set(pdfOptions()).from(document.getElementById('invoice-preview')).save()
  } catch (e) {
    console.error('PDF generation error:', e)
    toast('Could not generate PDF — try again.', 'error')
  }
}

async function emailInvoice(){
  const inlineInput = document.getElementById('existing-recipient-email')
  const recipientEmail = CURRENT_INVOICE.recipient_email || (inlineInput && inlineInput.value.trim())
  if (!recipientEmail) { toast('Enter a recipient email address first.', 'error'); return }

  renderPreview()
  document.getElementById('invoice-preview').style.display = 'block'
  try {
    await loadHtml2Pdf()
    const dataUri = await html2pdf().set(pdfOptions()).from(document.getElementById('invoice-preview')).output('datauristring')
    const pdfBase64 = dataUri.split('base64,')[1]

    const { data: { session } } = await supa.auth.getSession()
    const res = await fetch('/api/v1/invoices/email', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
      body: JSON.stringify({
        recipientEmail,
        studentId: CURRENT_INVOICE.student_id,
        invoiceNumber: CURRENT_INVOICE.invoice_number,
        periodLabel: `${fmtDate(CURRENT_INVOICE.period_start)} – ${fmtDate(CURRENT_INVOICE.period_end)}`,
        total: CURRENT_INVOICE.total,
        pdfBase64,
        filename: `${CURRENT_INVOICE.invoice_number}.pdf`
      })
    })
    const json = await res.json()
    if (!json.success) throw new Error((json.error && json.error.message) || 'Could not send email')

    await supa.from('invoices').update({
      status: 'sent', sent_at: new Date().toISOString(), recipient_email: recipientEmail
    }).eq('id', CURRENT_INVOICE.id)

    toast('Invoice emailed to ' + recipientEmail, 'success')
    await loadInvoiceArea()
  } catch (e) {
    console.error('Email invoice error:', e)
    toast(e.message || 'Could not send the invoice email.', 'error')
  }
}

async function markPaid(invoiceId){
  const { error } = await supa.from('invoices').update({ status: 'paid', paid_at: new Date().toISOString() }).eq('id', invoiceId)
  if (error) { toast('Could not update: ' + error.message, 'error'); return }
  toast('Marked as paid', 'success')
  await loadInvoiceArea()
}

async function voidInvoice(invoiceId){
  if (!confirm('Void this invoice? This frees up the period to generate a new one, and does not affect past attendance records.')) return
  const { error } = await supa.from('invoices').update({ status: 'void' }).eq('id', invoiceId)
  if (error) { toast('Could not update: ' + error.message, 'error'); return }
  toast('Invoice voided', 'success')
  await loadInvoiceArea()
}

async function loadPastInvoices(studentId){
  const area = document.getElementById('past-invoices-area')
  const { data: invoices } = await supa.from('invoices').select('*')
    .eq('student_id', studentId).order('period_start', { ascending: false })

  if (!invoices || !invoices.length) { area.innerHTML = ''; return }

  const rows = invoices.map(inv => `
    <tr>
      <td>${fmtDate(inv.period_start)} – ${fmtDate(inv.period_end)}</td>
      <td>${escapeHtml(inv.invoice_number)}</td>
      <td>${fmtMoney(inv.total)}</td>
      <td><span class="status-chip status-${inv.status}">${inv.status}</span></td>
      <td><button class="link-btn" onclick='loadSpecificInvoice(${JSON.stringify(inv.id)})'>Open</button></td>
    </tr>
  `).join('')

  area.innerHTML = `
    <h2>Past invoices for this student</h2>
    <div class="card table-scroll">
      <table>
        <thead><tr><th>Period</th><th>Invoice #</th><th>Total</th><th>Status</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `
}

async function loadSpecificInvoice(invoiceId){
  const { data: inv } = await supa.from('invoices').select('*').eq('id', invoiceId).single()
  if (!inv) return
  hidePreview()
  await renderExistingInvoiceCard(inv)
  window.scrollTo({ top: document.getElementById('invoice-area').offsetTop - 70, behavior: 'smooth' })
}

checkAuth()
</script>
