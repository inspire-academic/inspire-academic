<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank You — Year 6 Science Bridging Programme — Inspire Academic</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"></noscript>
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/global.css">
<style>
:root{
  --bridge:#0e7c7b; --bridge-light:#2dd4bf; --bridge-rgb:14,124,123;
  --grad-bridge: linear-gradient(135deg, var(--bridge), var(--bridge-light));
  --r:12px;
}
body{min-height:100vh;display:flex;flex-direction:column;}
a{text-decoration:none;color:inherit;}

.topbar{display:flex;align-items:center;padding:1.1rem 1.4rem;max-width:640px;margin:0 auto;width:100%;}
.brand-link{font-family:var(--font-display);font-weight:700;font-size:1.1rem;}
.brand-link .gold{color:var(--gold);}

main{flex:1;max-width:560px;margin:0 auto;width:100%;padding:3rem 1.4rem;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;}

.badge{
  width:56px;height:56px;border-radius:50%;background:var(--grad-bridge);
  display:flex;align-items:center;justify-content:center;margin-bottom:1.6rem;
  box-shadow:0 10px 30px rgba(var(--bridge-rgb),.35);
}
.badge svg{width:26px;height:26px;stroke:#fff;stroke-width:2.5;fill:none;}

h1{font-family:var(--font-display);font-weight:700;font-size:1.7rem;margin-bottom:.8rem;text-wrap:balance;}
p{color:var(--text-muted);line-height:1.7;margin-bottom:1.6rem;max-width:44ch;}
p strong{color:var(--text);}

.links{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;}
.btn-secondary{
  display:inline-flex;align-items:center;gap:.5rem;background:var(--bg-card);color:var(--text);
  border:1px solid var(--border);padding:.85rem 1.5rem;border-radius:var(--r);
  font-weight:600;font-size:.9rem;transition:border-color .2s;
}
.btn-secondary:hover{border-color:var(--bridge-light);}
</style>
</head>
<body>

<header class="topbar">
  <a href="/" class="brand-link">Inspire <span class="gold">Academic</span></a>
</header>

<main>
  <div class="badge" aria-hidden="true">
    <svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg>
  </div>
  <h1>Thank you — we've received your registration.</h1>
  <p>Your interest in the <strong>Year 6 Science Bridging Programme</strong> has been recorded. A member of the Inspire Academic team will be in touch by email or phone.</p>
  <div class="links">
    <a class="btn-secondary" href="../">Back to programme details</a>
    <a class="btn-secondary" href="/">Inspire Academic home</a>
  </div>
</main>

</body>
</html>
