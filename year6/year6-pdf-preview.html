function formatDate(date){
  return new Date(date).toLocaleDateString('en-GB', {
    day:'numeric', month:'long', year:'numeric'
  });
}

function renderField(label, value, type='text'){
  if(!value || (Array.isArray(value) && value.length === 0)){
    return `
      <div class="field-group">
        <div class="field-label">${label}</div>
        <div class="field-value empty">Not completed</div>
      </div>
    `;
  }
  
  if(Array.isArray(value)){
    return `
      <div class="field-group">
        <div class="field-label">${label}</div>
        <div class="field-value">
          <ul>
            ${value.map(v => `<li>${v}</li>`).join('')}
          </ul>
        </div>
      </div>
    `;
  }
  
  // Handle tables
  if(type === 'table' && Array.isArray(value) && value.length > 0){
    return `
      <div class="field-group">
        <div class="field-label">${label}</div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Ramp Length (cm)</th>
                <th>Trial 1 (cm)</th>
                <th>Trial 2 (cm)</th>
                <th>Average (cm)</th>
              </tr>
            </thead>
            <tbody>
              ${value.map(row => `
                <tr>
                  ${row.map(cell => `<td>${cell || '—'}</td>`).join('')}
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      </div>
    `;
  }
  
  return `
    <div class="field-group">
      <div class="field-label">${label}</div>
      <div class="field-value">${value.replace(/\n/g, '<br>')}</div>
    </div>
  `;
}

function renderPhotos(photos){
  if(!photos || photos.length === 0) return '';
  return `
    <div class="photo-grid">
      ${photos.map(photo => `
        <div class="photo-item">
          <img src="${photo.photo_url}" alt="Project photo">
        </div>
      `).join('')}
    </div>
  `;
}


function renderPDFField(field, fieldName, data, photosBySection){
  const lbl = (field.label || '').replace(/\n/g, '<br>');
  switch(field.type){
    case 'drawing':
      return (field.columns || []).map((col, ci) => {
        const val = data[fieldName + '_col' + ci];
        return renderField(lbl + ' — ' + col, val);
      }).join('');
    case 'photo-upload':
      if(field.section && photosBySection[field.section]){
        return `<div class="field-group"><div class="field-label">${lbl}</div>${renderPhotos(photosBySection[field.section])}</div>`;
      }
      return '';
    case 'table': {
      const val = data[fieldName];
      if(!val || !Array.isArray(val) || val.length === 0){
        return `<div class="field-group"><div class="field-label">${lbl}</div><div class="field-value empty">Not completed</div></div>`;
      }
      const cols = field.columns || [];
      const thead = cols.length ? `<thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead>` : '';
      const tbody = val.map(row=>`<tr>${(Array.isArray(row)?row:[row]).map(cell=>`<td>${cell||'&#x2014;'}</td>`).join('')}</tr>`).join('');
      return `<div class="field-group"><div class="field-label">${lbl}</div><div class="table-container"><table>${thead}<tbody>${tbody}</tbody></table></div></div>`;
    }
    default:
      return renderField(lbl, data[fieldName]);
  }
}

function renderSectionForPDF(section, idx, data, photosBySection){
  const fields = section.fields.map((field, fi) => {
    const name = field.name || (section.id + '_f' + fi);
    return renderPDFField(field, name, data, photosBySection);
  }).join('');
  return `
    <div class="section-page">
      <div class="page-header">
        <h2 class="section-title">${section.title}</h2>
        <div class="page-number">Page ${idx + 3}</div>
      </div>
      ${fields}
    </div>
  `;
}
async function generateReport(){
  const params = new URLSearchParams(window.location.search);
  const submissionId = params.get('submission');
  
  if(!submissionId){
    document.getElementById('report').innerHTML = '<p style="color:#fff;text-align:center;padding:3rem;">Invalid submission ID</p>';
    return;
  }
  
  // Load submission
  const {data: submission} = await supa.from('student_submissions')
    .select('*')
    .eq('id', submissionId)
    .single();
  
  if(!submission){
    document.getElementById('report').innerHTML = '<p style="color:#fff;text-align:center;padding:3rem;">Submission not found</p>';
    return;

  // Load profile
  const {data: profile} = await supa.from('profiles')
    .select('*')
    .eq('id', submission.user_id)
    .single();
  
  // Load project
  const {data: project} = await supa.from('projects')
    .select('*')
    .eq('id', submission.project_id)
    .single();
  
  // Load photos
  const {data: photos} = await supa.from('submission_photos')
    .select('*')
    .eq('submission_id', submissionId);
  
  const data = submission.submission_data || {};
  const studentName = profile?.full_name || profile?.first_name || 'Student';
  
  // Group photos by section
  const photosBySection = {};
  if(photos){
    photos.forEach(photo => {
      if(!photosBySection[photo.section_name]) photosBySection[photo.section_name] = [];
      photosBySection[photo.section_name].push(photo);
    });
  }
  
  const activeSections = projectSections[submission.project_id] || project1Sections;
  const meta = projectMeta[submission.project_id] || {};

  // Generate report HTML
  const reportHTML = `
    <!-- Cover Page -->
    <div class="cover-page">
      <div class="cover-logo">
        <img src="/assets/images/shared/1775416612494_image.webp" alt="Inspire Academic">
      </div>
      <div class="cover-badge">Year 6 Science Bridging Programme</div>
      <h1 class="cover-title">Project ${submission.project_id} Report</h1>
      <h2 class="cover-subtitle">${project.title}</h2>
      <div class="cover-student">${studentName}</div>
      <div class="cover-date">${formatDate(submission.created_at)}</div>
      <div class="cover-footer">
        <strong>INSPIRE Academic™</strong><br>
        Wonder • Understanding • Purpose
      </div>
    </div>
    
    <!-- Overview Page -->
    <div class="report-page page-break">
      <div class="page-header">
        <h2 style="margin:0;font-size:1.2rem;color:#0b1628;">Project Overview</h2>
        <div class="page-number">Page 2</div>
      </div>
      
      <h3 style="font-family:var(--font-display);font-size:1.5rem;color:#0b1628;margin-bottom:1rem;">
        ${project.title}
      </h3>
      
      <p style="font-size:1rem;line-height:1.7;color:#1a1a1a;margin-bottom:2rem;">
        ${meta.subtitle || project.description}
      </p>

      <div style="background:#f7f6f2;padding:1.5rem;border-radius:8px;border-left:3px solid #d4a017;">
        <h4 style="font-size:.9rem;font-weight:600;color:#7a8fa6;text-transform:uppercase;letter-spacing:.08em;margin-bottom:1rem;">
          Learning Objectives
        </h4>
        <ul style="margin:0;padding-left:1.5rem;line-height:1.8;color:#1a1a1a;">
          ${(meta.objectives || []).map(obj => `<li>${obj}</li>`).join('')}
        </ul>
      </div>
      
      <div style="margin-top:2rem;padding-top:2rem;border-top:1px solid #e5e5e5;">

        </p>

// Download as proper PDF with maintained formatting
async function downloadPDF(){
  const btn = document.getElementById('download-btn');
  btn.textContent = '⏳ Generating PDF...';
  btn.disabled = true;
  
  const element = document.getElementById('report');
  const projectTitle = new URLSearchParams(window.location.search).get('title') || 'Project_Report';
  const studentName = new URLSearchParams(window.location.search).get('student') || 'Student';
  
  const opt = {
    margin: 0,
    filename: `${studentName}_${projectTitle}.pdf`,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, letterRendering: true },
    jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
  };
  
  try {
    await html2pdf().set(opt).from(element).save();
    btn.textContent = '✓ Downloaded!';
    setTimeout(() => {
      btn.textContent = '📥 Download PDF';
      btn.disabled = false;
    }, 2000);
  } catch(error){
    console.error('PDF generation error:', error);
    btn.textContent = '❌ Error - Try Again';
    btn.disabled = false;
  }
}
</script>
