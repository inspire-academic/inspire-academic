<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Annotator - Inspire Academic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
:root {
  --navy: #0b1628;
  --navy2: #152035;
  --navy3: #1f2937;
  --gold: #c9a84c;
  --amber: #f59e0b;
  --red: #ef4444;
  --green: #10b981;
  --blue: #3b82f6;
  --purple: #8b5cf6;
  --muted: #9ca3af;
  --border: #374151;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family:'DM Sans',sans-serif;
  background:var(--navy);
  color:#fff;
  overflow:hidden;
  height:100vh;
  display:flex;
  flex-direction:column;
}

.header {
  background:var(--navy2);
  border-bottom:1px solid var(--border);
  padding:.75rem 1.5rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:1rem;
  flex-shrink:0;
}

.header-left {
  display:flex;
  align-items:center;
  gap:1rem;
}

.logo {
  font-family:'Playfair Display',serif;
  font-size:1.1rem;
  font-weight:600;
}

.inspire { color:var(--gold); }
.science { color:#fff; }

.file-name {
  font-size:.85rem;
  color:var(--muted);
  max-width:400px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.header-right {
  display:flex;
  align-items:center;
  gap:.75rem;
}

.btn {
  padding:.5rem 1rem;
  border-radius:6px;
  font-size:.8rem;
  font-weight:500;
  cursor:pointer;
  transition:all .15s;
  border:1px solid var(--border);
  background:transparent;
  color:#fff;
  font-family:'DM Sans',sans-serif;
  display:flex;
  align-items:center;
  gap:.5rem;
}

.btn:hover {
  border-color:var(--gold);
  background:rgba(201,168,76,.05);
}

.btn-primary {
  background:var(--gold);
  color:var(--navy);
  border-color:var(--gold);
}

.btn-primary:hover {
  background:#d4b961;
  border-color:#d4b961;
}

.toolbar {
  background:var(--navy2);
  border-bottom:1px solid var(--border);
  padding:.5rem 1.5rem;
  display:flex;
  align-items:center;
  gap:1rem;
  flex-wrap:wrap;
  flex-shrink:0;
}

.tool-group {
  display:flex;
  gap:.5rem;
  align-items:center;
  padding-right:1rem;
  border-right:1px solid var(--border);
}

.tool-group:last-child {
  border-right:none;
}

.tool-btn {
  width:36px;
  height:36px;
  border-radius:6px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  transition:all .15s;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.1rem;
}

.tool-btn:hover {
  background:var(--navy3);
  color:#fff;
  border-color:var(--gold);
}

.tool-btn.active {
  background:var(--gold);
  color:var(--navy);
  border-color:var(--gold);
}

.color-picker {
  width:36px;
  height:36px;
  border-radius:6px;
  border:1px solid var(--border);
  cursor:pointer;
  padding:2px;
  background:transparent;
}

.color-picker::-webkit-color-swatch-wrapper {
  padding:0;
}

.color-picker::-webkit-color-swatch {
  border:none;
  border-radius:4px;
}

.size-slider {
  width:100px;
  height:4px;
  background:var(--border);
  border-radius:2px;
  cursor:pointer;
}

.tool-label {
  font-size:.7rem;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.05em;
}

.cursor-select {
  padding:.3rem .5rem;
  border-radius:4px;
  font-size:.75rem;
  background:var(--navy3);
  border:1px solid var(--border);
  color:#fff;
  cursor:pointer;
  font-family:'DM Sans',sans-serif;
}

.canvas-container {
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:2rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2rem;
  background:var(--navy3);
}

.page-wrapper {
  position:relative;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
  background:#fff;
  margin-bottom:2rem;
}

.page-canvas {
  display:block;
}

.annotation-canvas {
  position:absolute;
  top:0;
  left:0;
}

.page-number {
  position:absolute;
  top:-2rem;
  left:0;
  font-size:.75rem;
  color:var(--muted);
  background:var(--navy2);
  padding:.25rem .75rem;
  border-radius:4px;
}

.cursor-crosshair { cursor:crosshair; }
.cursor-pen { cursor:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20"><path d="M15 3l2 2-10 10H5v-2L15 3z" fill="white" stroke="black" stroke-width="1"/></svg>') 2 18, auto; }
.cursor-text { cursor:text; }

.text-input-wrapper {
  position:absolute;
  z-index:10;
}

.text-input {
  border:2px solid var(--gold);
  background:rgba(255,255,255,.95);
  padding:.25rem .5rem;
  font-family:'DM Sans',sans-serif;
  font-size:16px;
  min-width:150px;
  outline:none;
  border-radius:4px;
}

.loading {
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background:rgba(11,22,40,.95);
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:1rem;
  z-index:1000;
}

.spinner {
  width:40px;
  height:40px;
  border:3px solid var(--border);
  border-top-color:var(--gold);
  border-radius:50%;
  animation:spin 1s linear infinite;
}

@keyframes spin {
  to { transform:rotate(360deg); }
}

.toast {
  position:fixed;
  top:1rem;
  right:1rem;
  background:var(--navy2);
  border:1px solid var(--border);
  border-radius:8px;
  padding:1rem 1.25rem;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
  display:none;
  align-items:center;
  gap:.75rem;
  z-index:1001;
}

.toast.show { display:flex; }

.toast.success { border-color:var(--green); color:var(--green); }
.toast.error { border-color:var(--red); color:var(--red); }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">
      <span class="inspire">Inspire</span> <span class="science">Science</span>
    </div>
    <div class="file-name" id="file-name">Loading...</div>
  </div>
  <div class="header-right">
    <button class="btn" onclick="goBack()">← Back</button>
    <button class="btn" onclick="clearAll()">🗑️ Clear All</button>
    <button class="btn btn-primary" onclick="downloadAnnotated()">💾 Download Annotated PDF</button>
  </div>
</div>

<div class="toolbar">
  <div class="tool-group">
    <button class="tool-btn active" onclick="setTool('pen')" data-tool="pen" title="Pen">✏️</button>
    <button class="tool-btn" onclick="setTool('highlighter')" data-tool="highlighter" title="Highlighter">🖍️</button>
    <button class="tool-btn" onclick="setTool('text')" data-tool="text" title="Text">T</button>
    <button class="tool-btn" onclick="setTool('eraser')" data-tool="eraser" title="Eraser">🧹</button>
  </div>
  
  <div class="tool-group">
    <span class="tool-label">Color</span>
    <input type="color" class="color-picker" id="color-picker" value="#000000">
  </div>
  
  <div class="tool-group">
    <span class="tool-label">Size</span>
    <input type="range" class="size-slider" id="size-slider" min="1" max="20" value="3">
  </div>
  
  <div class="tool-group">
    <span class="tool-label">Cursor</span>
    <select class="cursor-select" id="cursor-select" onchange="changeCursor()">
      <option value="crosshair">Crosshair</option>
      <option value="pen">Pen</option>
    </select>
  </div>
  
  <div class="tool-group">
    <button class="tool-btn" onclick="undo()" title="Undo (Ctrl+Z)">↶</button>
    <button class="tool-btn" onclick="redo()" title="Redo (Ctrl+Y)">↷</button>
  </div>
  
  <div class="tool-group">
    <button class="tool-btn" onclick="zoomIn()" title="Zoom In">🔍+</button>
    <button class="tool-btn" onclick="zoomOut()" title="Zoom Out">🔍−</button>
    <button class="tool-btn" onclick="resetZoom()" title="Reset Zoom">⚖️</button>
  </div>
</div>

<div class="canvas-container" id="canvas-container">
</div>

<div class="loading" id="loading">
  <div class="spinner"></div>
  <div>Loading PDF pages...</div>
</div>

<div class="toast" id="toast">
  <span id="toast-message"></span>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc = null;
let scale = 1.5;
let currentTool = 'pen';
let currentColor = '#000000';
let currentSize = 3;
let currentCursor = 'crosshair';
let pages = [];
let pdfUrl = '';
let fileName = '';
let pdfBytes = null;

// ── Keyboard Shortcuts ──
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key === 'z') {
    e.preventDefault();
    undo();
  }
  if (e.ctrlKey && e.key === 'y') {
    e.preventDefault();
    redo();
  }
});

(async () => {
  try {
    const params = new URLSearchParams(window.location.search);
    pdfUrl = params.get('url');
    fileName = params.get('name') || 'document.pdf';
    
    if (!pdfUrl) {
      showToast('No PDF URL provided', 'error');
      return;
    }
    
    document.getElementById('file-name').textContent = fileName;
    
    const response = await fetch(pdfUrl);
    pdfBytes = await response.arrayBuffer();
    
    const loadingTask = pdfjsLib.getDocument(pdfBytes);
    pdfDoc = await loadingTask.promise;
    
    await renderAllPages();
    
    document.getElementById('loading').style.display = 'none';
    
  } catch (error) {
    console.error('PDF load error:', error);
    showToast('Failed to load PDF', 'error');
    document.getElementById('loading').style.display = 'none';
  }
})();

async function renderAllPages() {
  const container = document.getElementById('canvas-container');
  container.innerHTML = '';
  pages = [];
  
  for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
    const page = await pdfDoc.getPage(pageNum);
    const viewport = page.getViewport({ scale });
    
    const pageWrapper = document.createElement('div');
    pageWrapper.className = 'page-wrapper';
    pageWrapper.style.width = viewport.width + 'px';
    pageWrapper.style.height = viewport.height + 'px';
    
    const pageLabel = document.createElement('div');
    pageLabel.className = 'page-number';
    pageLabel.textContent = `Page ${pageNum} of ${pdfDoc.numPages}`;
    pageWrapper.appendChild(pageLabel);
    
    const pdfCanvas = document.createElement('canvas');
    pdfCanvas.className = 'page-canvas';
    pdfCanvas.width = viewport.width;
    pdfCanvas.height = viewport.height;
    pageWrapper.appendChild(pdfCanvas);
    
    const annotationCanvas = document.createElement('canvas');
    annotationCanvas.className = `annotation-canvas ${currentCursor === 'pen' ? 'cursor-pen' : 'cursor-crosshair'}`;
    annotationCanvas.width = viewport.width;
    annotationCanvas.height = viewport.height;
    pageWrapper.appendChild(annotationCanvas);
    
    container.appendChild(pageWrapper);
    
    const pdfCtx = pdfCanvas.getContext('2d');
    await page.render({ canvasContext: pdfCtx, viewport }).promise;
    
    const annotationCtx = annotationCanvas.getContext('2d');
    pages.push({
      pageNum,
      pdfCanvas,
      annotationCanvas,
      annotationCtx,
      strokes: [],
      redoStack: [],
      texts: []
    });
    
    attachDrawingEvents(annotationCanvas, pages.length - 1);
  }
}

function attachDrawingEvents(canvas, pageIndex) {
  let isDrawing = false;
  let lastX = 0;
  let lastY = 0;
  
  canvas.addEventListener('mousedown', (e) => {
    if (currentTool === 'text') {
      addTextBox(e, canvas, pageIndex);
      return;
    }
    
    isDrawing = true;
    const rect = canvas.getBoundingClientRect();
    lastX = e.clientX - rect.left;
    lastY = e.clientY - rect.top;
    
    pages[pageIndex].strokes.push({
      tool: currentTool,
      color: currentColor,
      size: currentSize,
      points: [{x: lastX, y: lastY}]
    });
    pages[pageIndex].redoStack = [];
  });
  
  canvas.addEventListener('mousemove', (e) => {
    if (!isDrawing || currentTool === 'text') return;
    
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    
    const currentStroke = pages[pageIndex].strokes[pages[pageIndex].strokes.length - 1];
    currentStroke.points.push({x, y});
    
    const ctx = pages[pageIndex].annotationCtx;
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = currentSize;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    if (currentTool === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.lineWidth = currentSize * 3;
    } else {
      ctx.globalCompositeOperation = 'source-over';
      if (currentTool === 'highlighter') {
        ctx.globalAlpha = 0.3;
      } else {
        ctx.globalAlpha = 1.0;
      }
    }
    
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(x, y);
    ctx.stroke();
    
    lastX = x;
    lastY = y;
  });
  
  canvas.addEventListener('mouseup', () => {
    isDrawing = false;
  });
  
  canvas.addEventListener('mouseout', () => {
    isDrawing = false;
  });
}

function addTextBox(e, canvas, pageIndex) {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  
  const wrapper = document.createElement('div');
  wrapper.className = 'text-input-wrapper';
  wrapper.style.position = 'fixed';
  wrapper.style.left = e.clientX + 'px';
  wrapper.style.top = e.clientY + 'px';
  
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'text-input';
  input.style.color = currentColor;
  input.style.fontSize = (currentSize * 4) + 'px';
  
  wrapper.appendChild(input);
  document.body.appendChild(wrapper);
  input.focus();
  
  input.addEventListener('blur', () => {
    if (input.value.trim()) {
      const ctx = pages[pageIndex].annotationCtx;
      ctx.font = `${currentSize * 4}px DM Sans, sans-serif`;
      ctx.fillStyle = currentColor;
      ctx.fillText(input.value, x, y);
      
      pages[pageIndex].texts.push({
        text: input.value,
        x, y,
        color: currentColor,
        size: currentSize * 4
      });
    }
    wrapper.remove();
  });
  
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      input.blur();
    }
    if (e.key === 'Escape') {
      wrapper.remove();
    }
  });
}

function setTool(tool) {
  currentTool = tool;
  document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tool === tool);
  });
  
  if (tool === 'highlighter') {
    currentColor = '#ffff00';
    document.getElementById('color-picker').value = '#ffff00';
  }
  
  document.querySelectorAll('.annotation-canvas').forEach(canvas => {
    canvas.className = 'annotation-canvas';
    if (currentCursor === 'pen') {
      canvas.classList.add('cursor-pen');
    } else if (tool === 'text') {
      canvas.classList.add('cursor-text');
    } else {
      canvas.classList.add('cursor-crosshair');
    }
  });
}

document.getElementById('color-picker').addEventListener('change', (e) => {
  currentColor = e.target.value;
});

document.getElementById('size-slider').addEventListener('input', (e) => {
  currentSize = parseInt(e.target.value);
});

function changeCursor() {
  currentCursor = document.getElementById('cursor-select').value;
  document.querySelectorAll('.annotation-canvas').forEach(canvas => {
    canvas.className = 'annotation-canvas';
    if (currentCursor === 'pen') {
      canvas.classList.add('cursor-pen');
    } else if (currentTool === 'text') {
      canvas.classList.add('cursor-text');
    } else {
      canvas.classList.add('cursor-crosshair');
    }
  });
}

function undo() {
  pages.forEach(page => {
    if (page.strokes.length > 0) {
      page.redoStack.push(page.strokes.pop());
      redrawPage(page);
    }
  });
  showToast('Undo', '');
}

function redo() {
  pages.forEach(page => {
    if (page.redoStack.length > 0) {
      page.strokes.push(page.redoStack.pop());
      redrawPage(page);
    }
  });
  showToast('Redo', '');
}

function clearAll() {
  if (confirm('Clear all annotations on all pages?')) {
    pages.forEach(page => {
      page.strokes = [];
      page.redoStack = [];
      page.texts = [];
      redrawPage(page);
    });
  }
}

function redrawPage(page) {
  const ctx = page.annotationCtx;
  ctx.clearRect(0, 0, page.annotationCanvas.width, page.annotationCanvas.height);
  
  page.strokes.forEach(stroke => {
    ctx.strokeStyle = stroke.color;
    ctx.lineWidth = stroke.size;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    
    if (stroke.tool === 'eraser') {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.lineWidth = stroke.size * 3;
    } else {
      ctx.globalCompositeOperation = 'source-over';
      if (stroke.tool === 'highlighter') {
        ctx.globalAlpha = 0.3;
      } else {
        ctx.globalAlpha = 1.0;
      }
    }
    
    ctx.beginPath();
    stroke.points.forEach((point, i) => {
      if (i === 0) {
        ctx.moveTo(point.x, point.y);
      } else {
        ctx.lineTo(point.x, point.y);
      }
    });
    ctx.stroke();
  });
  
  page.texts.forEach(text => {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1.0;
    ctx.font = `${text.size}px DM Sans, sans-serif`;
    ctx.fillStyle = text.color;
    ctx.fillText(text.text, text.x, text.y);
  });
  
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1.0;
}

function zoomIn() {
  scale += 0.2;
  renderAllPages();
}

function zoomOut() {
  if (scale > 0.5) {
    scale -= 0.2;
    renderAllPages();
  }
}

function resetZoom() {
  scale = 1.5;
  renderAllPages();
}

async function downloadAnnotated() {
  try {
    showToast('Preparing PDF...', '');
    
    const pdfLibDoc = await PDFLib.PDFDocument.load(pdfBytes);
    
    for (let i = 0; i < pages.length; i++) {
      const page = pages[i];
      const pdfPage = pdfLibDoc.getPages()[i];
      
      if (page.strokes.length === 0 && page.texts.length === 0) continue;
      
      const mergedCanvas = document.createElement('canvas');
      mergedCanvas.width = page.pdfCanvas.width;
      mergedCanvas.height = page.pdfCanvas.height;
      const mergedCtx = mergedCanvas.getContext('2d');
      
      mergedCtx.fillStyle = '#ffffff';
      mergedCtx.fillRect(0, 0, mergedCanvas.width, mergedCanvas.height);
      mergedCtx.drawImage(page.pdfCanvas, 0, 0);
      mergedCtx.drawImage(page.annotationCanvas, 0, 0);
      
      const pngDataUrl = mergedCanvas.toDataURL('image/png');
      const pngImageBytes = await fetch(pngDataUrl).then(res => res.arrayBuffer());
      const pngImage = await pdfLibDoc.embedPng(pngImageBytes);
      
      const { width, height } = pdfPage.getSize();
      pdfPage.drawImage(pngImage, {
        x: 0,
        y: 0,
        width: width,
        height: height
      });
    }
    
    const pdfBytesOutput = await pdfLibDoc.save();
    const blob = new Blob([pdfBytesOutput], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName.replace('.pdf', '_annotated.pdf');
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    
    showToast('Downloaded! ✓', 'success');
    
  } catch (error) {
    console.error('Download error:', error);
    showToast('Download failed: ' + error.message, 'error');
  }
}

function goBack() {
  if (confirm('Go back? Unsaved annotations will be lost.')) {
    window.close();
    if (!window.closed) {
      window.history.back();
    }
  }
}

function showToast(message, type = '') {
  const toast = document.getElementById('toast');
  const toastMessage = document.getElementById('toast-message');
  
  toastMessage.textContent = message;
  toast.className = 'toast show ' + type;
  
  setTimeout(() => {
    toast.classList.remove('show');
  }, 2000);
}
</script>

</body>
</html>
